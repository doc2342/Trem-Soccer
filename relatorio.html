<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot e relatório</title>
<link rel="stylesheet" href="estilo.css">
<style>.kv { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:13px; } .kv span:nth-child(odd) { color:var(--mut); }</style>
</head>
<body>
<main>
  <h1>Bot e relatório da partida</h1>
  <div class="mut">Dois clubes sem dono: o bot escolhe a formação, a escalação e as instruções de cada um, o motor joga e o relatório explica o resultado.</div>

  <div class="card row">
    <label>Nível do mandante<input id="nivel0" type="number" min="15" max="42" value="30" style="width:90px"></label>
    <label>Elenco do mandante<input id="elenco0" type="number" value="1" style="width:90px"></label>
    <label>Nível do visitante<input id="nivel1" type="number" min="15" max="42" value="30" style="width:90px"></label>
    <label>Elenco do visitante<input id="elenco1" type="number" value="2" style="width:90px"></label>
    <label>Analista<select id="analista"><option value="1">Nível 1</option><option value="2">Nível 2</option><option value="3" selected>Nível 3</option></select></label>
    <label>Semente da partida<input id="semente" type="number" value="1" style="width:90px"></label>
    <button id="jogar">Jogar outra partida</button>
  </div>

  <div class="duas"><div class="card" id="bot0"></div><div class="card" id="bot1"></div></div>
  <div id="rel"></div>
</main>

<script type="module">
import { criarRng } from "./src/rng.js";
import { gerarElenco, PERFIS } from "./src/gerador.js";
import { prepararTime, simularPartida } from "./src/motor.js";
import { taticaBot } from "./src/bot.js";
import { montarRelatorio } from "./src/relatorio.js";
import { htmlRelatorio } from "./src/ui-relatorio.js";

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f2 = v => v.toFixed(2).replace(".", ","), f1 = v => v.toFixed(1).replace(".", ","), pc = v => Math.round(v * 100) + "%";
const nomes = await (await fetch("./dados/nomes.json")).json();
const NOMES_TIME = ["Mandante", "Visitante"], COR = ["casa", "fora"];
const MENT = { "-2": "muito defensiva", "-1": "defensiva", 0: "normal", 1: "ofensiva", 2: "muito ofensiva" }, LADO = { misto: "livre", E: "esquerda", D: "direita", C: "centro", lados: "os dois lados" };

function jogar() {
  const perfis = Object.keys(PERFIS);
  const elencos = [0, 1].map(i => gerarElenco(criarRng(2000 + +$("elenco" + i).value), { nivel: +$("nivel" + i).value, perfil: perfis[+$("elenco" + i).value % perfis.length], nomes, prefixoId: "t" + i + "_" }));
  // cada bot conhece só a força do onze adversário, como um dirigente veria na tabela
  const previa = elencos.map(e => taticaBot(e));
  const taticas = elencos.map((e, i) => taticaBot(e, { mandante: i === 0, forcaAdversario: previa[1 - i].forca }));
  const times = taticas.map((t, i) => prepararTime({ nome: NOMES_TIME[i], escalacao: t.escalacao, banco: t.banco, instrucoes: t.instrucoes, mandante: i === 0 }));
  const partida = simularPartida(criarRng(+$("semente").value), times[0], times[1]);
  const nivel = +$("analista").value, r = montarRelatorio(partida, [nivel, nivel]);
  const nomeDe = id => { for (const e of elencos) { const j = e.find(x => x.id === id); if (j) return j.nome; } return "—"; };

  taticas.forEach((t, i) => {
    const I = t.instrucoes;
    $("bot" + i).innerHTML = `<h2 class="${COR[i]}">${NOMES_TIME[i]}: escolhas do bot</h2><div class="kv">
      <span>Formação</span><span>${t.formacao} · nota média ${f1(t.forca)}</span>
      <span>Escalação</span><span>${t.escalacao.map(x => `<span class="pp">${x.pos}</span> ${esc(x.j.nome)}`).join(" · ")}</span>
      <span>Banco</span><span>${t.banco.map(j => esc(j.nome)).join(", ")}</span>
      <span>Mentalidade</span><span>${MENT[I.mentalidade]}</span>
      <span>Lado do ataque</span><span>${LADO[I.lado]}</span>
      <span>Capitão e vice</span><span>${esc(nomeDe(I.capitao))} e ${esc(nomeDe(I.vice))}</span>
      <span>Armador · homem-alvo</span><span>${esc(nomeDe(I.armador))} · ${esc(nomeDe(I.alvo))}</span>
      <span>Pênaltis</span><span>${I.cobradores.penalti.map(nomeDe).map(esc).join(", ")}</span>
      <span>Substituições</span><span>${I.substituicoes.map(s => `${s.min}': sai ${esc(nomeDe(s.sai))}, entra ${esc(nomeDe(s.entra))}`).join("; ") || "nenhuma"}</span>
      <span>Ordens</span><span>perdendo aos 70: ${MENT[I.ordens[0].muda.mentalidade]}; ganhando aos 80: ${MENT[I.ordens[1].muda.mentalidade]}</span></div>`;
  });

  $("rel").innerHTML = htmlRelatorio(r, { nomes: NOMES_TIME });
  return { r, taticas, partida };
}

$("jogar").onclick = () => { $("semente").value = +$("semente").value + 1; jogar(); };
document.querySelectorAll("input, select").forEach(el => el.onchange = jogar);
jogar();
window.__teste = { jogar, taticaBot, gerarElenco, criarRng, prepararTime, simularPartida, montarRelatorio, nomes };
</script>
</body>
</html>
