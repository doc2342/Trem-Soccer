<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trem Soccer · Partida</title>
<link rel="stylesheet" href="estilo.css">
<script src="atualiza.js"></script>
<style>
  .painel { display:grid; grid-template-columns:minmax(0, 1fr) auto minmax(0, 1fr); align-items:center; gap:10px; text-align:center; max-width:560px; margin:6px auto 0; }
  .painel .time { display:flex; flex-direction:column; align-items:center; gap:4px; font-weight:600; min-width:0; overflow-wrap:anywhere; }
  .painel .gols { font-size:44px; font-weight:800; white-space:nowrap; }
  @media (max-width:620px) { .painel .gols { font-size:34px; } .painel .time { font-size:13.5px; } .painel .time svg { width:46px; height:46px; } }
  .cronometro { text-align:center; color:var(--ac); font-weight:700; margin-top:6px; font-size:18px; font-variant-numeric:tabular-nums; }
  .aovivo { display:grid; grid-template-columns:minmax(0,2fr) minmax(240px,1fr); gap:12px; align-items:start; }
  @media (max-width:760px) { .aovivo { grid-template-columns:1fr; } }
  .estat { width:100%; } .estat td { text-align:center; padding:5px 4px; } .estat td.esq { text-align:left; }
</style>
</head>
<body>
<main>
  <div style="display:flex;gap:12px;align-items:center"><a href="jogo.html" style="color:var(--ac)">← Voltar ao clube</a><span class="relogio" style="margin-left:auto" title="Hora deste aparelho"></span></div>
  <div class="card" id="topo"><div class="mut">Carregando…</div></div>
  <div id="corpo"></div>
</main>

<script type="module">
import { nomeDoGrupo, PAISES, FASES_DA_COPA, ehCopa, nomeDaCopa, precoDoIngresso, ligaAtual, partidaPorId, clubesPorIds, lancesDaPartida, relatorioDaPartida, partidasDoGrupo, clubesDaLiga, resultadosDe, golsDasPartidas, estatisticasDaLiga } from "./src/banco.js";
import { classificacao } from "./src/rodada.js";
import { fraseDoPresidente, variacaoDaConfianca, posicaoPelosEsperados } from "./src/diretoria.js";
import { metasDaTemporada } from "./src/banco.js";
import { sb } from "./src/banco.js";
// "Suas ordens": a tabela só devolve as linhas do clube de quem está logado (e nada sem login ou sem o 90_ordens_privadas.sql)
const ordensDaPartida = async partida => { const { data } = await sb.from("ordens_partida").select("clube_id, itens").eq("partida_id", partida.id); const de = id => ((data || []).find(o => o.clube_id === id) || {}).itens || null; return [de(partida.casa), de(partida.fora)]; };
import { htmlRelatorio, htmlLance, htmlResumo, LEGENDA_LANCES } from "./src/ui-relatorio.js";
import { svgEscudo, svgUniforme, uniformesDoJogo } from "./src/escudo.js";
import { sg } from "./src/siglas.js";

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f2 = v => v.toFixed(2).replace(".", ",");
const id = +new URLSearchParams(location.search).get("id");
const COR = ["casa", "fora"];
let partida, clubes, encerrada = false, relogio, tique, preco = null;
const baixados = []; // lances já recebidos; cada consulta traz só os que vieram depois

// ---------- rodada ao vivo: os outros jogos do grupo e a classificação se mexendo (só em partida de liga) ----------
let rodada = null, voltas = 0;
// O servidor entrega os lances dos próximos 10 minutos (SQL 75) e a página mostra cada um na hora dele, pelo relógio: uma busca a cada ~9 minutos
// em vez de uma a cada 10 segundos. adiante: a última busca trouxe lance futuro; sem o SQL 75 isso nunca acontece e vale o ritmo antigo.
let proximaBusca = 0, adiante = false;
async function carregarRodada() {
  if (partida.fase && partida.fase !== "liga") return;
  const [ps, cls, est] = await Promise.all([partidasDoGrupo(partida.liga_id, partida.grupo), clubesDaLiga(partida.liga_id), estatisticasDaLiga(partida.liga_id, partida.grupo).catch(() => null)]);
  const doGrupo = ps.filter(p => !p.fase || p.fase === "liga");
  rodada = { ps: doGrupo, clubes: cls.filter(c => c.grupo === partida.grupo), daRodada: doGrupo.filter(p => p.rodada === partida.rodada), res: [], gols: [], art: (est && est.artilheiros) || [] };
  await atualizarRodada();
}
async function atualizarRodada() {
  if (!rodada) return;
  const [res, gols] = await Promise.all([resultadosDe(rodada.ps.map(p => p.id), true), golsDasPartidas(rodada.daRodada.filter(p => p.id !== id).map(p => p.id))]);
  rodada.res = res; rodada.gols = gols;
}
// Classificação e placares no instante T (o administrador lê tudo no banco: aqui vale só o que já foi ao ar). meu: [gols da casa, gols de fora] desta partida.
function estadoDaRodada(T, meu) {
  const noAr = x => !x.libera_em || new Date(x.libera_em).getTime() <= T, daRodada = new Set(rodada.daRodada.map(p => p.id));
  const res = rodada.res.filter(r => noAr(r) && !daRodada.has(r.partida_id)), vivos = [], placares = {};
  for (const p of rodada.daRodada) {
    const fim = rodada.res.find(r => r.partida_id === p.id && noAr(r));
    const g = p.id === id ? meu : fim ? [fim.gols_casa, fim.gols_fora] : new Date(p.inicio).getTime() <= T ? [0, 1].map(t => rodada.gols.filter(x => x.partida_id === p.id && x.time === t && noAr(x)).length) : null;
    placares[p.id] = { g, fim: !!fim };
    if (g) vivos.push({ partida_id: p.id, gols_casa: g[0], gols_fora: g[1], pts_esp_casa: 0, pts_esp_fora: 0 });
  }
  return { antes: classificacao(rodada.clubes, rodada.ps, res), agora: classificacao(rodada.clubes, rodada.ps, [...res, ...vivos]), placares };
}
// zona da tabela pela posição (0 = líder): A cai 3; nas outras sobe o campeão, do 2º ao 4º é playoff, e na B caem 2
const divisaoDoGrupo = g => PAISES[g] ? 0 : g === "A" ? 1 : "BC".includes(g) ? 2 : 3; // 0: país de uma divisão só
function zonaDaPosicao(i, n) { const d = divisaoDoGrupo(partida.grupo);
  return !d ? (i === 0 ? "lider" : i <= 2 ? "lib" : "") : d === 1 ? (i === 0 ? "lider" : i <= 2 ? "lib" : i >= n - 3 ? "cai" : "") : i === 0 ? "sobe" : i <= 3 ? "playoff" : d === 2 && i >= n - 2 ? "cai" : ""; }
const NOME_DA_ZONA = { lider: "a liderança", lib: "a zona da Libertadores", sobe: "a vaga de acesso direto", playoff: "a zona de playoff", cai: "a zona de descenso" };
function htmlRodada(meu, T = Date.now()) {
  if (!rodada) return "";
  const e = estadoDaRodada(T, meu), nome = c => esc(rodada.clubes.find(x => x.id === c)?.nome || "—"), posAntes = Object.fromEntries(e.antes.map((t, i) => [t.clube.id, i])), n = e.agora.length;
  const hora = d => new Date(d).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }), COR_DA_ZONA = { lider: "var(--ac)", lib: "var(--ac)", sobe: "var(--ok, #4caf50)", playoff: "var(--ac)", cai: "var(--bad, #e57373)" };
  const jogos = rodada.daRodada.map(p => { const x = e.placares[p.id];
    return `<div style="padding:3px 0;${p.id === id ? "font-weight:700" : ""}">${p.id === id ? "" : `<a href="aovivo.html?id=${p.id}" style="color:inherit;text-decoration:none">`}${nome(p.casa)} <b>${x.g ? x.g[0] + " x " + x.g[1] : "x"}</b> ${nome(p.fora)}${p.id === id ? "" : "</a>"} <span class="mut" style="font-weight:400;font-size:12px">${x.fim ? "encerrado" : x.g ? "ao vivo" : hora(p.inicio)}</span></div>`; }).join("");
  const tabela = e.agora.map((t, i) => { const d = posAntes[t.clube.id] - i, z = zonaDaPosicao(i, n), nosso = t.clube.id === partida.casa || t.clube.id === partida.fora;
    return `<tr style="${nosso ? "font-weight:700" : ""}"><td style="border-left:3px solid ${COR_DA_ZONA[z] || "transparent"};padding-left:5px">${i + 1}</td><td style="width:22px;font-size:11px" class="${d > 0 ? "ok" : d < 0 ? "bad" : "mut"}">${d > 0 ? "▲" + d : d < 0 ? "▼" + (-d) : ""}</td><td class="esq" style="text-align:left">${esc(t.clube.nome)}</td><td><b>${t.pts}</b></td><td>${t.j}</td><td>${t.gp - t.gc}</td></tr>`; }).join("");
  return `<div class="card"><h2>Rodada ${partida.rodada} ao vivo <span class="tag">${esc(nomeDoGrupo(partida.grupo))}</span></h2>${jogos}
    <table style="width:100%;margin-top:8px;font-size:13.5px"><tr><th></th><th></th><th style="text-align:left">Clube</th><th>P</th><th>J</th><th>SG</th></tr>${tabela}</table>
    <div class="mut" style="margin-top:6px;font-size:12px">Classificação como ficaria com os placares deste momento. As setas comparam com o início da rodada.</div></div>`;
}
// Diretoria (91_diretoria.sql): confiança e frase do presidente de cada clube com dirigente; na liga, quanto a virada daria com a tabela de agora
// (finanças e copa ficam fora da conta: o caixa é privado e a copa só entra no fim). Sem o SQL, a consulta falha e nada aparece.
async function htmlDiretoria() {
  const ids = [partida.casa, partida.fora].filter(c => clubes[c] && clubes[c].dono);
  if (!ids.length) return "";
  const conf = await sb.from("clubes").select("id, confianca").in("id", ids).then(({ data, error }) => error ? [] : data);
  if (!conf.length) return "";
  let tab = null, metas = [];
  if (rodada) {
    const liga = await ligaAtual();
    const [rs, ms] = await Promise.all([resultadosDe(rodada.ps.map(p => p.id)), liga ? metasDaTemporada(liga.id, liga.temporada) : []]);
    tab = classificacao(rodada.clubes, rodada.ps, rs); metas = ms;
  }
  const esp = tab ? posicaoPelosEsperados(tab) : {}, sinal = x => (x > 0 ? "+" : "") + x;
  const linhas = conf.filter(c => clubes[c.id] && c.confianca != null).map(c => {
    const meta = metas.find(m => m.clube_id === c.id), i = tab ? tab.findIndex(t => t.clube.id === c.id) : -1;
    let conta = "";
    if (meta && i >= 0 && tab[i].j) { const avaliada = (i + 1 + esp[c.id]) / 2, v = variacaoDaConfianca({ avaliada, faixa: [meta.faixa_min, meta.faixa_max] });
      conta = ` Meta: ${meta.faixa_min === meta.faixa_max ? meta.faixa_min + "º" : `${meta.faixa_min}º a ${meta.faixa_max}º`}; com a tabela de agora, a liga daria <b class="${v.liga > 0 ? "ok" : v.liga < 0 ? "bad" : ""}">${sinal(v.liga)}</b> na virada.`; }
    return `<div style="margin:3px 0"><b>${esc(clubes[c.id].nome)}</b>: confiança ${c.confianca}. <i>“${fraseDoPresidente(c.confianca)}”</i>${conta}</div>`;
  });
  return `<div class="card"><h2>Diretoria</h2>${linhas.join("")}</div>`;
}
// Notas de contexto dos gols desta partida: o que o gol muda na tabela e na artilharia. lances: os liberados, com a hora de cada um.
function notasDosGols(lances) {
  const notas = {}; if (!rodada) return notas;
  const meu = [0, 0], noJogo = {}, lider = rodada.art.length ? rodada.art[0].gols : 0, nomeDoTime = i => esc(clubes[i ? partida.fora : partida.casa].nome);
  for (const l of lances) { const d = l.dados; if (d.resultado !== "gol") continue;
    const T = new Date(l.libera_em || Date.now()).getTime(), antes = estadoDaRodada(T, meu.slice()).agora; meu[d.time]++;
    const depois = estadoDaRodada(T, meu.slice()).agora, n = depois.length, frases = [];
    [d.time, 1 - d.time].forEach((lado, k) => { const cid = lado ? partida.fora : partida.casa, a = antes.findIndex(t => t.clube.id === cid), b = depois.findIndex(t => t.clube.id === cid);
      if (a === b) return; const za = zonaDaPosicao(a, n), zb = zonaDaPosicao(b, n);
      if (k === 0) frases.push(`Com o gol, ${nomeDoTime(lado)} vai a ${b + 1}º${zb && zb !== za ? (zb === "lider" ? " e assume a liderança" : ` e entra n${NOME_DA_ZONA[zb]}`) : za === "cai" && !zb ? " e sai da zona de descenso" : ""}.`);
      else if (zb !== za) frases.push(zb === "cai" ? `${nomeDoTime(lado)} cai para a zona de descenso.` : za ? `${nomeDoTime(lado)} perde ${NOME_DA_ZONA[za]}.` : `${nomeDoTime(lado)} cai para ${b + 1}º.`); });
    // artilharia: gols na série antes desta partida (só quem está entre os 20 primeiros) mais os de hoje
    noJogo[d.finalizador] = (noJogo[d.finalizador] || 0) + 1;
    const previa = rodada.art.find(x => x.id === d.finalizador), total = (previa ? previa.gols : 0) + noJogo[d.finalizador];
    if (noJogo[d.finalizador] === 3) frases.push(`Terceiro gol de ${esc(d.quem || "")} na partida.`);
    if (previa && total >= 5) frases.push(`${esc(d.quem || "")} chega a ${total} gols na série${total > lider && previa.gols <= lider ? (previa.id === rodada.art[0].id ? "" : " e passa à frente na artilharia") : total === lider ? " e encosta no artilheiro" : ""}.`);
    if (frases.length) notas[d.n] = frases.join(" "); }
  return notas;
}

// Minuto de jogo a partir do relógio real, com 15 minutos de intervalo, na escala da transmissão.
function momento() {
  const total = (new Date(partida.fim) - new Date(partida.inicio)) / 60000;
  const t = total > 0 ? (Date.now() - new Date(partida.inicio)) / 60000 * 105 / total : Date.now() >= new Date(partida.inicio) ? 105 : -1;
  const mmss = x => { const s = Math.max(0, Math.floor(x * 60)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
  if (t < 0) { const falta = Math.ceil((new Date(partida.inicio) - Date.now()) / 60000); return { texto: falta > 90 ? `Começa em ${new Date(partida.inicio).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}` : `Começa em ${falta} min`, antes: true }; }
  if (t <= 45) return { texto: `${mmss(t)} · 1º tempo` };
  if (t < 60) return { texto: "45:00 · intervalo" };
  if (t < 105) return { texto: `${mmss(t - 15)} · 2º tempo` };
  if (ehCopa(partida) && !encerrada) { // se não houve prorrogação, o resultado chega e encerra a transmissão antes disto aparecer
    if (t < 110) return { texto: "90:00 · fim do tempo normal", fim: true };
    if (t < 140) return { texto: `${mmss(t - 20)} · prorrogação`, fim: true };
    return { texto: "Pênaltis", fim: true };
  }
  return { texto: "Fim de jogo", fim: true };
}

function topo(gols, m, narracao = []) {
  const c = [clubes[partida.casa], clubes[partida.fora]], u = uniformesDoJogo(c[0].uniforme || {}, c[1].uniforme || {}); // o segundo usa o reserva se as camisas se parecem
  $("topo").innerHTML = `<div class="mut" style="text-align:center">${ehCopa(partida) ? `${nomeDaCopa(partida)} · campo neutro` : `${esc(nomeDoGrupo(partida.grupo))} · rodada ${partida.rodada}`}</div>
    <div class="painel"><div class="time casa"><span>${svgEscudo(c[0].escudo, c[0].sigla, 56)} ${svgUniforme(u[0], 26)}</span>${esc(c[0].nome)}</div><div class="gols">${m.antes ? "–" : gols[0]} x ${m.antes ? "–" : gols[1]}</div><div class="time fora"><span>${svgEscudo(c[1].escudo, c[1].sigla, 56)} ${svgUniforme(u[1], 26)}</span>${esc(c[1].nome)}</div></div>
    <div class="cronometro" id="crono">${m.texto}</div>${htmlResumo(narracao)}`;
}

const milhar = v => Math.round(v).toLocaleString("pt-BR");
// público e renda: gravados pelo servidor logo depois do cálculo da partida
function htmlEstadio(pre) {
  const renda = partida.publico != null && preco != null ? Math.round(partida.publico * preco / 1000) : null;
  return `<div class="card"><h2>Estádio</h2><table class="estat">
    <tr><td class="esq">Público pagante</td><td>${partida.publico != null ? milhar(partida.publico) : "–"}</td></tr>
    <tr><td class="esq">Renda da partida${ehCopa(partida) ? " (meio a meio)" : ""}</td><td>${renda != null ? (renda >= 1000 ? f2(renda / 1000) + " mi" : milhar(renda) + " mil") : "–"}</td></tr>
    ${pre && pre.clima ? `<tr><td class="esq">Clima</td><td>${esc(pre.clima.nome)} (${pre.clima.temp} °C)</td></tr>` : ""}${pre && pre.grande ? `<tr><td class="esq">Jogo grande</td><td>a experiência pesa mais</td></tr>` : ""}</table></div>`;
}
// estatísticas do que já foi ao ar: finalizações, cartões e afins contados pelos lances; posse, faltas e escanteios pela parcial do último lance
function htmlEstatisticas(narracao) {
  const conta = f => [0, 1].map(i => narracao.filter(l => l.time === i && f(l)).length);
  const fin = l => l.resultado !== undefined, ult = narracao.filter(l => l.p).pop(), p = ult ? ult.p : null;
  const xg = [0, 1].map(i => narracao.filter(l => l.time === i && fin(l)).reduce((s, l) => s + (l.xg || 0), 0));
  const linhas = [
    ["Posse", p ? [p[0] + "%", 100 - p[0] + "%"] : ["–", "–"]],
    ["Finalizações", conta(fin)], ["No gol", conta(l => l.resultado === "gol" || l.resultado === "defesa")], ["xG", xg.map(f2)],
    ["Escanteios", p ? [p[3], p[4]] : ["–", "–"]], ["Faltas cometidas", p ? [p[1], p[2]] : ["–", "–"]],
    ["Cartões amarelos", conta(l => l.tipo === "amarelo")], ["Cartões vermelhos", conta(l => l.tipo === "vermelho")],
    ["Impedimentos", conta(l => l.tipo === "impedimento")], ["Contra-ataques", conta(l => l.tipo === "contra")],
  ];
  return `<div class="card"><h2>Estatísticas <span class="tag">ao vivo</span></h2><table class="estat">${linhas.map(([n, v]) => `<tr><td class="casa">${v[0]}</td><td class="mut">${n}</td><td class="fora">${v[1]}</td></tr>`).join("")}</table></div>`;
}
// abertura, como no Dugout: cara ou coroa, público, clima e as duas escalações
// cronologico: na reprise, depois do jogo, a abertura vem primeiro e na ordem em que aconteceu
function htmlAbertura(pre, cronologico = false) {
  if (!pre) return "";
  const nomes = [clubes[partida.casa].nome, clubes[partida.fora].nome];
  const time = (e, i) => `<div class="lance"><span class="min">–</span><span class="ico">📋</span><span><b class="${COR[i]}">${esc(nomes[i])}</b> entra com ${e.titulares.map(j => `${esc(j.nome)} (${sg(j.pos)})`).join(", ")}.${e.banco.length ? ` <span class="mut">Banco: ${e.banco.map(j => `${esc(j.nome)} (${sg(j.pos)})`).join(", ")}.</span>` : ""}</span></div>`;
  const partes = [time(pre.escalacoes[1], 1), time(pre.escalacoes[0], 0),
    `<div class="lance"><span class="min">–</span><span class="ico">🌤️</span><span>${partida.publico != null ? `${milhar(partida.publico)} torcedores vieram ao estádio. ` : ""}Clima: ${esc(pre.clima.nome.toLowerCase())}, ${pre.clima.temp} °C.</span></div>`,
    `<div class="lance"><span class="min">–</span><span class="ico">🪙</span><span>${esc(nomes[pre.moeda])} venceu o cara ou coroa. A partida vai começar.</span></div>`];
  return (cronologico ? partes.reverse() : partes).join("");
}

async function atualizar() {
  const m = momento();
  if (m.antes) { topo([0, 0], m); $("corpo").innerHTML = `<div class="card mut">A transmissão começa no horário do jogo. Os lances aparecem aqui minuto a minuto.</div>`; return; }
  // o administrador lê tudo no banco; aqui a transmissão segue o relógio para ele também
  const agora = Date.now(), noAr = x => !x.libera_em || new Date(x.libera_em).getTime() <= agora;
  const ultima = baixados.length ? baixados[baixados.length - 1].ordem : -100;
  // o relatório só é pedido depois do apito final; até lá, apenas os lances novos
  let res = null;
  if (m.fim || agora >= proximaBusca) {
    let novos; [novos, res] = await Promise.all([lancesDaPartida(id, ultima), m.fim ? relatorioDaPartida(id) : null]);
    // duas buscas podem correr juntas (volta à aba + relógio de 10 s) e trazer os mesmos lances: só entra ordem nova
    const tem = new Set(baixados.map(l => l.ordem));
    baixados.push(...novos.filter(l => !tem.has(l.ordem)));
    baixados.sort((a, b) => a.ordem - b.ordem);
    const ultimo = Math.max(0, ...baixados.map(l => new Date(l.libera_em || 0).getTime()));
    adiante = ultimo > agora; proximaBusca = adiante ? Math.max(agora + 60000, ultimo - 60000) : 0; // volta a buscar um minuto antes de acabar o que já tem
  }
  const lances = baixados.filter(noAr); if (res && !noAr(res)) res = null;
  const tudo = lances.map(l => l.dados), pre = tudo.find(l => l.tipo === "inicio"), narracao = tudo.filter(l => l.tipo !== "inicio");
  if (res) {
    encerrada = true; clearInterval(relogio); clearInterval(tique);
    topo([res.gols_casa, res.gols_fora], { texto: "Fim de jogo" + (res.relatorio.penaltis ? ` · pênaltis ${res.relatorio.penaltis[0]} x ${res.relatorio.penaltis[1]}` : "") });
    // depois do jogo, estádio e comando cabem numa linha só; o placar grande já está no topo
    const renda = partida.publico != null && preco != null ? Math.round(partida.publico * preco / 1000) : null;
    const resumo = [partida.publico != null ? `${milhar(partida.publico)} pagantes` : "", renda != null ? `renda de ${renda >= 1000 ? f2(renda / 1000) + " mi" : milhar(renda) + " mil"}${ehCopa(partida) ? ", dividida meio a meio" : ""}` : "",
      pre && pre.clima ? `${esc(pre.clima.nome.toLowerCase())}, ${pre.clima.temp} °C` : "",
      `${esc(clubes[partida.casa].nome)} comandado por ${res.relatorio.comandados[0]}, ${esc(clubes[partida.fora].nome)} por ${res.relatorio.comandados[1]}`].filter(Boolean);
    $("corpo").innerHTML = `<div class="card mut" style="font-size:13.5px">${resumo.join(" · ")}.</div>` + htmlRodada([res.gols_casa, res.gols_fora]) +
      await htmlDiretoria() + htmlRelatorio({ ...res.relatorio, narracao }, { semPlacar: true, nomes: [clubes[partida.casa].nome, clubes[partida.fora].nome], abertura: htmlAbertura(pre, true), ordens: await ordensDaPartida(partida) });
    return;
  }
  const gols = [0, 1].map(i => narracao.filter(l => l.resultado === "gol" && l.time === i).length);
  topo(gols, m, narracao);
  const notas = notasDosGols(lances), comNota = l => htmlLance(l) + (notas[l.n] ? `<div class="mut" style="margin:-2px 0 6px 46px;font-size:12.5px">📌 ${notas[l.n]}</div>` : "");
  $("corpo").innerHTML = !partida.processada && !lances.length
    ? `<div class="card aviso">A partida ainda não foi calculada pelo servidor. Os lances aparecem assim que o cálculo rodar.</div>`
    : `<div class="aovivo"><div class="card"><h2>Lances <span class="tag">os mais recentes em cima · atualiza sozinho</span></h2>${LEGENDA_LANCES}${narracao.slice().reverse().map(comNota).join("") || `<div class="mut">Bola rolando. Nenhum lance de perigo ainda.</div>`}${htmlAbertura(pre)}
       <div class="mut" style="margin-top:8px">Mapa de zonas, notas e análise aparecem depois do apito final.</div></div>
       <div>${htmlRodada(gols)}${htmlEstatisticas(narracao)}${htmlEstadio(pre)}</div></div>`;
}

async function iniciar() {
  partida = id ? await partidaPorId(id) : null;
  if (!partida) { $("topo").innerHTML = `<div class="bad">Partida não encontrada.</div>`; return; }
  clubes = Object.fromEntries((await clubesPorIds([partida.casa, partida.fora])).map(c => [c.id, c]));
  preco = await precoDoIngresso(partida.casa).catch(() => null);
  await carregarRodada().catch(() => { rodada = null; });
  await atualizar();
  // a cada 10 segundos redesenha com o que o relógio já liberou (sem consultar o banco) (e busca lances novos só quando os baixados estão acabando); com a aba em segundo plano não busca nada, e ao voltar busca de uma vez o que aconteceu
  let consultaDaPartida = 0; // a partida (calculada? público?) é conferida no máximo uma vez por minuto
  const buscar = async () => { if (encerrada || document.hidden) return; if ((!partida.processada || partida.publico == null) && Date.now() - consultaDaPartida >= 60000) { consultaDaPartida = Date.now(); partida = await partidaPorId(id); }
    // os outros jogos do grupo: junto com a busca dos lances; no ritmo antigo, a cada 30 segundos
    if (adiante ? momento().fim || Date.now() >= proximaBusca : ++voltas % 3 === 0) await atualizarRodada().catch(() => {});
    atualizar().catch(() => {}); };
  relogio = setInterval(buscar, 10000);
  document.addEventListener("visibilitychange", () => { buscar().catch(() => {}); });
  tique = setInterval(() => { if (!encerrada && $("crono")) $("crono").textContent = momento().texto; }, 1000);
}
window.__teste = { notasDosGols: () => notasDosGols(baixados), htmlRodada, htmlDiretoria, rodada: () => rodada }; // para conferir pelo console
iniciar().catch(e => { $("topo").innerHTML = `<div class="bad">Não consegui carregar: ${esc(e.message)}</div>`; });
</script>
