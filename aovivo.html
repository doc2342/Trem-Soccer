<body>
<main>
  <div style="display:flex;gap:12px;align-items:center"><a href="jogo.html" style="color:var(--ac)">← Voltar ao clube</a><button id="som" class="sec" style="margin-left:auto;padding:3px 10px" title="Sons da transmissão"></button><span class="relogio" title="Hora deste aparelho"></span></div>
  <div class="card" id="topo"><div class="mut">Carregando…</div></div>
  <div id="intervalo"></div>
  <div id="corpo"></div>
</main>

<script type="module">
import { SEDES } from "./src/estadio.js";
import { nomeDoGrupo, nomeDoPlayoff, PAISES, FASES_DA_COPA, ehCopa, nomeDaCopa, precoDoIngresso, ligaAtual, partidaPorId, clubesPorIds, lancesDaPartida, relatorioDaPartida, partidasDoGrupo, clubesDaLiga, resultadosDe, golsDasPartidas, estatisticasDaLiga } from "./src/banco.js";
import { classificacao } from "./src/rodada.js";
import { fraseDoPresidente, variacaoDaConfianca, posicaoPelosEsperados } from "./src/diretoria.js";
import { metasDaTemporada, marcasDosClubes } from "./src/banco.js";
import { MARCAS, selo, placasDoEstadio, ANUNCIE, jogoPatrocinado, marcaDaCompeticao } from "./src/patrocinio.js";
import { sb } from "./src/banco.js";
// "Suas ordens" só do clube do próprio usuário (nada sem login ou sem o 90_ordens_privadas.sql): o admin lê todas as linhas pelo banco, mas não deve ver o plano do adversário aqui
const ordensDaPartida = async (partida, clubes) => { const uid = ((await sb.auth.getSession()).data.session || {}).user?.id; if (!uid) return null;
  const { data } = await sb.from("ordens_partida").select("clube_id, itens").eq("partida_id", partida.id); const de = id => clubes[id] && clubes[id].dono === uid ? ((data || []).find(o => o.clube_id === id) || {}).itens || null : null; return [de(partida.casa), de(partida.fora)]; };
import { htmlRelatorio, htmlLance, htmlResumo, LEGENDA_LANCES, lembrarJogadores, linkJogador } from "./src/ui-relatorio.js";
import { svgEscudo, svgUniforme, uniformesDoJogo } from "./src/escudo.js";
import { sg, pp } from "./src/siglas.js";

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f2 = v => v.toFixed(2).replace(".", ",");
const id = +new URLSearchParams(location.search).get("id");
const COR = ["casa", "fora"];
let partida, clubes, encerrada = false, relogio, tique, preco = null;
const baixados = []; // lances já recebidos; cada consulta traz só os que vieram depois

// ---------- sons (Web Audio, gerados aqui: nenhum arquivo, nada no banco) ----------
// O navegador só toca depois de um clique: o botão cria o áudio e a escolha fica guardada neste aparelho.
let somLigado = false, ctx = null;
try { somLigado = localStorage.getItem("mo_som") === "1"; } catch (e) {}
const audio = () => { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); return ctx; };
// um tom: frequência, início e duração em segundos; trinado = vibrato rápido (o apito)
function tom(f, ini, dur, { tipo = "sine", vol = 0.25, trinado = 0, ate = f } = {}) {
  const a = audio(), t = a.currentTime + ini, o = a.createOscillator(), g = a.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f, t); o.frequency.linearRampToValueAtTime(ate, t + dur);
  if (trinado) { const l = a.createOscillator(), lg = a.createGain(); l.frequency.value = trinado; lg.gain.value = f * 0.06; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + dur); }
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.setValueAtTime(vol, t + dur - 0.05); g.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
}
const apito = n => { for (let i = 0; i < n; i++) tom(2600, i * 0.45, i === n - 1 ? 0.9 : 0.3, { trinado: 28, vol: 0.12 }); };
const SONS = {
  inicio: () => apito(1), intervalo: () => apito(2), fim: () => apito(3),
  gol: () => [523, 659, 784, 1047].forEach((f, i) => tom(f, i * 0.12, i === 3 ? 0.7 : 0.14, { tipo: "triangle", vol: 0.3 })), // fanfarra subindo
  amarelo: () => tom(880, 0, 0.12, { tipo: "square", vol: 0.08 }),
  vermelho: () => { tom(440, 0, 0.18, { tipo: "square", vol: 0.1 }); tom(330, 0.2, 0.3, { tipo: "square", vol: 0.1 }); },
};
const tocar = s => { if (somLigado) try { SONS[s](); } catch (e) {} };
function botaoDoSom() { $("som").textContent = somLigado ? "🔇" : "🔊 ativar som"; }
$("som").onclick = () => { somLigado = !somLigado; try { localStorage.setItem("mo_som", somLigado ? "1" : "0"); } catch (e) {} if (somLigado) { audio(); tocar("amarelo"); } botaoDoSom(); };
// som já ligado de outra visita: o áudio só destrava no primeiro clique na página
document.addEventListener("click", () => { if (somLigado) audio(); }, { once: true });
botaoDoSom();
// Só lance novo na tela faz barulho: o primeiro desenho marca tudo como visto em silêncio, e quem chega com a aba voltando de segundo plano
// (liberado há mais de 30 s) entra calado. fase: muda de 1º tempo, intervalo, 2º tempo e fim pelo relógio.
let vistos = null, fase = null;
// intervalo: a TV roda só os comerciais dos masters dos dois times e da marca que dá nome à competição, um a cada 8 s (sem master nenhum, roda as placas);
// o LED embaixo passa as demais marcas (as que não estão na TV) e o anuncie aqui.
let tv = null;
function intervaloComercial(m) {
  const el = $("intervalo"), no = !m.antes && !m.fim && m.texto.includes("intervalo");
  if (!no) { if (tv) { clearInterval(tv); tv = null; el.innerHTML = ""; } return; }
  if (tv) return; // já está passando: não recomeça a cada atualização
  const total = (new Date(partida.fim) - new Date(partida.inicio)) / 60000, volta = new Date(partida.inicio).getTime() + total * (60 + acrDoJogo()[0]) / 105 * 60000;
  const placas = placasDoEstadio(partida.casa), lados = [partida.casa, partida.fora].map(id => clubes[id]).filter(c => c && MARCAS[c.marca]);
  const comp = marcaDaCompeticao(partida.fase === "copa" ? (partida.copa_fase ? "COPA" : "") : partida.grupo);
  const marcas = [...lados.map(c => ({ master: c })), ...(comp && !lados.some(c => c.marca === comp) ? [{ master: { marca: comp }, quem: `Patrocinador ${ehCopa(partida) ? "da competição" : "do " + nomeDoGrupo(partida.grupo)}` }] : [])];

    <div class="painel"><div class="uni-g">${svgUniforme(u[0], 88)}</div><div class="time casa">${lkClube(partida.casa, `<span>${svgEscudo(c[0].escudo, c[0].sigla, 56)} <span class="uni-p">${svgUniforme(u[0], 26)}</span></span>`, "")}${lkClube(partida.casa, esc(c[0].nome))}</div><div class="gols">${m.antes ? "–" : gols[0]} x ${m.antes ? "–" : gols[1]}</div><div class="time fora">${lkClube(partida.fora, `<span>${svgEscudo(c[1].escudo, c[1].sigla, 56)} <span class="uni-p">${svgUniforme(u[1], 26)}</span></span>`, "")}${lkClube(partida.fora, esc(c[1].nome))}</div><div class="uni-g">${svgUniforme(u[1], 88)}</div></div>
    <div class="cronometro" id="crono">${m.texto}</div>${htmlResumo(narracao)}</div>${m.antes ? "" : htmlEstadio(pre)}</div>`;
}

// abas do celular e o "ver todos os lances" do pós-jogo: a escolha sobrevive ao redesenho de 10 em 10 segundos
const ABAS = { resumo: ["📝", "Resumo"], lances: ["📜", "Lances"], estat: ["📊", "Números"], esc: ["👕", "Escalação"], rodada: ["🏆", "Rodada"], jog: ["⭐", "Jogadores"] };
let aba = null, todosLances = false, latAba = "esc";
const BOTAO_TODOS = `<button class="sec" data-todos style="margin:0 0 8px;padding:4px 12px"><span class="v1">Ver todos os lances</span><span class="v2">Só os principais</span></button>`;
function barraDeAbas(ids) { ids = ids.filter(Boolean); if (!ids.includes(aba)) aba = ids[0];
  return `<div class="abas soCel">${ids.map(k => `<button class="aba" data-ir="${k}"><span class="ai">${ABAS[k][0]}</span><span>${ABAS[k][1]}</span></button>`).join("")}</div>`; }
function aplicarAba() {
  document.querySelectorAll("#corpo [data-aba]").forEach(e => e.classList.toggle("fora-aba", e.dataset.aba !== aba));
  document.querySelectorAll("#corpo [data-ir]").forEach(b => b.classList.toggle("ativa", b.dataset.ir === aba));
  $("corpo").classList.toggle("todos", todosLances || !encerrada);
}
$("corpo").addEventListener("click", e => {
  const b = e.target.closest("[data-ir]"); if (b) { aba = b.dataset.ir; aplicarAba(); }
  if (e.target.closest("[data-todos]")) { todosLances = !todosLances; aplicarAba(); }
  const l = e.target.closest("[data-lat]"); if (l) { latAba = l.dataset.lat; const d = l.closest(".lat-d"); d.className = "lat-d lat-" + latAba; d.querySelectorAll("[data-lat]").forEach(x => x.classList.toggle("ativa", x === l)); }
});

const milhar = v => Math.round(v).toLocaleString("pt-BR");
// público e renda: gravados pelo servidor logo depois do cálculo da partida
function htmlEstadio(pre) {
  const renda = partida.publico != null && preco != null ? Math.round(partida.publico * preco / 1000) : null;
  const kpi = (rot, v, d) => `<div class="kpi"><div class="kl">${rot}</div><div class="kv">${v}</div>${d ? `<div class="kd">${d}</div>` : ""}</div>`;
  return `<div class="kpis k3">${kpi("Público", partida.publico != null ? milhar(partida.publico) : "–", SEDES[partida.sede] ? `pagantes, de ${milhar(SEDES[partida.sede].lugares)}${partida.publico >= SEDES[partida.sede].lugares ? " · esgotado" : ""}` : "pagantes")}
    ${kpi("Renda", renda != null ? (renda >= 1000 ? f2(renda / 1000) + " mi" : milhar(renda) + " mil") : "–", ehCopa(partida) ? "dividida meio a meio" : "do mandante")}
    ${kpi("Clima", pre && pre.clima ? `${pre.clima.temp} °C` : "–", pre && pre.clima ? esc(pre.clima.nome.toLowerCase()) + (pre.grande ? " · jogo grande" : "") : "")}</div>`;
}
// escalações lado a lado, com o banco embaixo de cada time
function htmlEscalacoes(pre) {
  if (!pre || !pre.escalacoes) return "";
  const nomes = [clubes[partida.casa].nome, clubes[partida.fora].nome];
  const time = (e, i) => `<div><b class="${COR[i]}">${lkClube(i ? partida.fora : partida.casa, esc(nomes[i]))}</b>${e.titulares.map(j => `<div class="esc-j">${pp(j.pos)} ${linkJogador(j.nome)}</div>`).join("")}
    ${e.banco.length ? `<div class="mut" style="margin-top:6px;font-size:12px">Banco</div>${e.banco.map(j => `<div class="esc-j mut">${pp(j.pos)} ${linkJogador(j.nome)}</div>`).join("")}` : ""}</div>`;
  return `<div class="card" data-aba="esc"><h2>Escalações</h2><div class="esc">${time(pre.escalacoes[0], 0)}${time(pre.escalacoes[1], 1)}</div></div>`;
}
// estatísticas do que já foi ao ar: finalizações, cartões e afins contados pelos lances; posse, faltas e escanteios pela parcial do último lance
function htmlEstatisticas(narracao, soTabela) {
  const conta = f => [0, 1].map(i => narracao.filter(l => l.time === i && f(l)).length);
  const fin = l => l.resultado !== undefined, ult = narracao.filter(l => l.p).pop(), p = ult ? ult.p : null;
  const xg = [0, 1].map(i => narracao.filter(l => l.time === i && fin(l)).reduce((s, l) => s + (l.xg || 0), 0));
  const linhas = [
    ["Posse", p ? [p[0] + "%", 100 - p[0] + "%"] : ["–", "–"]],
    ["Finalizações", conta(fin)], ["No gol", conta(l => l.resultado === "gol" || l.resultado === "defesa")], ["xG", xg.map(f2)],
    ["Escanteios", p ? [p[3], p[4]] : ["–", "–"]], ["Faltas cometidas", p ? [p[1], p[2]] : ["–", "–"]],
    ["Cartões amarelos", conta(l => l.tipo === "amarelo")], ["Cartões vermelhos", conta(l => l.tipo === "vermelho")],
    ["Impedimentos", conta(l => l.tipo === "impedimento")], ["Contra-ataques", conta(l => l.tipo === "contra")],
  ];
  // barra dividida: a parte de cada time no total da linha (some quando os dois estão em zero ou sem número)
  const barra = v => { const a = parseFloat(String(v[0]).replace(",", ".")), b = parseFloat(String(v[1]).replace(",", ".")); if (!(a + b > 0)) return "";
    return `<div class="dupla"><i class="casa" style="width:${(100 * a / (a + b)).toFixed(1)}%"></i><i class="fora" style="width:${(100 * b / (a + b)).toFixed(1)}%"></i></div>`; };
  const cab = [partida.casa, partida.fora].map((c, i) => `<th class="${COR[i]}">${lkClube(c, esc(soTabela ? clubes[c].sigla || clubes[c].nome : clubes[c].nome))}</th>`);
  const tabela = `<table class="estat"><tr>${cab[0]}<th></th>${cab[1]}</tr>${linhas.map(([n, v]) => `<tr><td class="casa">${v[0]}</td><td class="mut">${n}${barra(v)}</td><td class="fora">${v[1]}</td></tr>`).join("")}</table>`;
  return soTabela ? `<div class="kl">Estatísticas</div>${tabela}` : `<div class="card" data-aba="estat"><h2>Estatísticas <span class="tag">ao vivo</span></h2>${tabela}</div>`;
}
// abertura, como no Dugout: cara ou coroa, público, clima e as duas escalações
// cronologico: na reprise, depois do jogo, a abertura vem primeiro e na ordem em que aconteceu
function htmlAbertura(pre, cronologico = false, semTimes = false) {
  if (!pre) return "";
  const nomes = [clubes[partida.casa].nome, clubes[partida.fora].nome];
  const time = (e, i) => `<div class="lance"><span class="min">–</span><span class="ico">📋</span><span><b class="${COR[i]}">${esc(nomes[i])}</b> entra com ${e.titulares.map(j => `${linkJogador(j.nome)} (${sg(j.pos)})`).join(", ")}.${e.banco.length ? ` <span class="mut">Banco: ${e.banco.map(j => `${linkJogador(j.nome)} (${sg(j.pos)})`).join(", ")}.</span>` : ""}</span></div>`;
  const partes = [...(semTimes ? [] : [time(pre.escalacoes[1], 1), time(pre.escalacoes[0], 0)]),
    `<div class="lance"><span class="min">–</span><span class="ico">🌤️</span><span>${partida.publico != null ? `${milhar(partida.publico)} torcedores vieram ${SEDES[partida.sede] ? "ao " + SEDES[partida.sede].nome : "ao estádio"}. ` : ""}Clima: ${esc(pre.clima.nome.toLowerCase())}, ${pre.clima.temp} °C.</span></div>`,
    `<div class="lance"><span class="min">–</span><span class="ico">🪙</span><span>${esc(nomes[pre.moeda])} venceu o cara ou coroa. A partida vai começar.</span></div>`];
  return (cronologico ? partes.reverse() : partes).join("");
}

async function atualizar() {
  const m = momento();
  intervaloComercial(m);
  if (m.antes) { sonsDosLances(m, [], Date.now()); topo([0, 0], m); $("corpo").innerHTML = `<div class="card mut">A transmissão começa no horário do jogo. Os lances aparecem aqui minuto a minuto.</div>`; return; }
  // o administrador lê tudo no banco; aqui a transmissão segue o relógio para ele também
  const agora = Date.now(), noAr = x => !x.libera_em || new Date(x.libera_em).getTime() <= agora;
  const ultima = baixados.length ? baixados[baixados.length - 1].ordem : -100;
  // o relatório só é pedido depois do apito final; até lá, apenas os lances novos
  let res = null;
  if (m.fim || agora >= proximaBusca) {
    let novos; [novos, res] = await Promise.all([lancesDaPartida(id, ultima), m.fim ? relatorioDaPartida(id) : null]);
    // duas buscas podem correr juntas (volta à aba + relógio de 10 s) e trazer os mesmos lances: só entra ordem nova
    const tem = new Set(baixados.map(l => l.ordem));
    baixados.push(...novos.filter(l => !tem.has(l.ordem)));
    baixados.sort((a, b) => a.ordem - b.ordem);
    const ultimo = Math.max(0, ...baixados.map(l => new Date(l.libera_em || 0).getTime()));
    adiante = ultimo > agora; proximaBusca = adiante ? Math.max(agora + 60000, ultimo - 60000) : 0; // volta a buscar um minuto antes de acabar o que já tem
  }
  const lances = baixados.filter(noAr); if (res && !noAr(res)) res = null;
  sonsDosLances(m, lances, agora);
  const tudo = lances.map(l => l.dados), pre = tudo.find(l => l.tipo === "inicio"), narracao = tudo.filter(l => l.tipo !== "inicio");
  narracao.forEach(l => lembrarJogadores([l.finalizador, l.quem])); if (res) res.relatorio.jogadores.forEach(j => lembrarJogadores([j.id, j.nome]));
  if (res) {
    encerrada = true; clearInterval(relogio); clearInterval(tique);
    topo([res.gols_casa, res.gols_fora], { texto: "Fim de jogo" + (res.relatorio.penaltis ? ` · pênaltis ${res.relatorio.penaltis[0]} x ${res.relatorio.penaltis[1]}` : "") }, [], pre);
    // depois do jogo: público, renda e clima ficam no topo, ao lado do placar
    const numeros = `
      <div class="mut" style="margin-top:8px;font-size:13px">${esc(clubes[partida.casa].nome)} comandado por ${res.relatorio.comandados[0]}, ${esc(clubes[partida.fora].nome)} por ${res.relatorio.comandados[1]}.</div>`;
    // depois do apito: reprise de um lado; estatísticas, escalações, rodada, zonas e jogadores na coluna do lado; diretoria logo depois das ordens
    $("corpo").innerHTML = numeros + barraDeAbas(["resumo", "lances", "estat", "esc", rodada && "rodada", "jog"]) + htmlRelatorio({ ...res.relatorio, narracao }, { semPlacar: true, nomes: [clubes[partida.casa].nome, clubes[partida.fora].nome], abertura: BOTAO_TODOS + htmlAbertura(pre, true), ordens: await ordensDaPartida(partida, clubes), lateral: htmlEscalacoes(pre) + htmlRodada([res.gols_casa, res.gols_fora]), jogadoresAoLado: true, aposAnalise: await htmlDiretoria() });
    aplicarAba();
    return;
  }
  const gols = [0, 1].map(i => narracao.filter(l => l.resultado === "gol" && l.time === i).length);
  topo(gols, m, narracao, pre);
  const notas = notasDosGols(lances), comNota = l => htmlLance(l) + (notas[l.n] ? `<div class="mut" style="margin:-2px 0 6px 46px;font-size:12.5px">📌 ${notas[l.n]}</div>` : "");
  $("corpo").innerHTML = !partida.processada && !lances.length
    ? `<div class="card aviso">Bola rolando! O servidor calcula a partida logo depois do apito (leva até 2 minutos). Os lances aparecem aqui sozinhos.</div>`
    : `${barraDeAbas(["lances", "estat", pre && "esc", rodada && "rodada"])}<div class="aovivo"><div class="lat-e">${htmlEstatisticas(narracao)}</div><div class="card lan" data-aba="lances"><h2>Lances <span class="tag">os mais recentes em cima · atualiza sozinho</span></h2>${LEGENDA_LANCES}${narracao.slice().reverse().map(comNota).join("") || `<div class="mut">Bola rolando. Nenhum lance de perigo ainda.</div>`}${htmlAbertura(pre, false, true)}
       <div class="mut" style="margin-top:8px">Mapa de zonas, notas e análise aparecem depois do apito final.</div></div>
       ${(duas => `<div class="lat-d ${duas ? "lat-" + latAba : ""}">${duas ? `<div class="lat-abas">${[["esc", "👕 Escalações"], ["rodada", "🏆 Rodada ao vivo"]].map(([k, n]) => `<button class="sec ${latAba === k ? "ativa" : ""}" data-lat="${k}">${n}</button>`).join("")}</div>` : ""}${htmlEscalacoes(pre)}${htmlRodada(gols)}</div>`)(!!(pre && pre.escalacoes && rodada))}</div>`;
  aplicarAba();
}

async function iniciar() {
  partida = id ? await partidaPorId(id) : null;
  if (!partida) { $("topo").innerHTML = `<div class="bad">Partida não encontrada.</div>`; return; }
  clubes = Object.fromEntries((await clubesPorIds([partida.casa, partida.fora])).map(c => [c.id, c]));
  const marcas = await marcasDosClubes([partida.casa, partida.fora]).catch(() => ({})); // patrocínio estampado na camisa
  for (const k in clubes) clubes[k].marca = marcas[k] || null;
  preco = await precoDoIngresso(partida.casa).catch(() => null);
  await carregarRodada().catch(() => { rodada = null; });
  await atualizar();
  // a cada 10 segundos redesenha com o que o relógio já liberou (sem consultar o banco) (e busca lances novos só quando os baixados estão acabando); com a aba em segundo plano não busca nada, e ao voltar busca de uma vez o que aconteceu
  let consultaDaPartida = 0; // a partida (calculada? público?) é conferida no máximo uma vez por minuto
  const buscar = async () => { if (encerrada || document.hidden) return; if ((!partida.processada || partida.publico == null) && Date.now() - consultaDaPartida >= 60000) { consultaDaPartida = Date.now(); partida = await partidaPorId(id); }
    // os outros jogos do grupo: junto com a busca dos lances; no ritmo antigo, a cada 30 segundos
    if (adiante ? momento().fim || Date.now() >= proximaBusca : ++voltas % 3 === 0) await atualizarRodada().catch(() => {});
    atualizar().catch(() => {}); };
  relogio = setInterval(buscar, 10000);
  document.addEventListener("visibilitychange", () => { buscar().catch(() => {}); });
  tique = setInterval(() => { if (!encerrada && $("crono")) $("crono").textContent = momento().texto; }, 1000);
}
window.__teste = { SONS, sonsDosLances, placa, dadosDaPlaca, notasDosGols: () => notasDosGols(baixados), htmlRodada, htmlDiretoria, rodada: () => rodada }; // para conferir pelo console
// ?demo: botões que disparam as animações (gol, substituição, acréscimo) com jogadores desta partida, para ver sem esperar o lance
function demo() {
  const pre = (baixados.find(l => l.dados && l.dados.tipo === "inicio") || {}).dados, esc0 = pre && pre.escalacoes, nomes = i => esc0 ? esc0[i].titulares.map(x => x.nome) : ["Fulano", "Beltrano"], banco = i => esc0 && esc0[i].banco.length ? esc0[i].banco.map(x => x.nome) : ["Sicrano"];
  const sorte = a => a[Math.floor(Math.random() * a.length)], lado = () => Math.random() < 0.5 ? 0 : 1;
  const el = document.createElement("div"); el.style.cssText = "position:fixed;top:10px;right:10px;z-index:40;display:flex;gap:6px;flex-wrap:wrap";
  el.innerHTML = `<button id="dGol">⚽ Gol</button><button id="dSub">🔁 Substituição</button><button id="dAcr">⏱️ Acréscimo</button>`;
  document.body.append(el);
  $("dGol").onclick = () => { const t = lado(); window.scrollTo({ top: 0, behavior: "smooth" }); setTimeout(() => avisoDeGol({ time: t, quem: sorte(nomes(t)), min: 1 + Math.floor(Math.random() * 90) }), 300); if (somLigado) tocar("gol"); };
  $("dSub").onclick = () => { const t = lado(); placa({ tipo: "substituicao", time: t, sai: sorte(nomes(t)), entra: sorte(banco(t)) }); };
  $("dAcr").onclick = () => placa({ tipo: "acrescimo", acr: 1 + Math.floor(Math.random() * 7) });
}
iniciar().then(() => { if (new URLSearchParams(location.search).has("demo")) demo(); }).catch(e => { $("topo").innerHTML = `<div class="bad">Não consegui carregar: ${esc(e.message)}</div>`; });
</script>
