// Notas de contexto dos gols desta partida: o que o gol muda na tabela e na artilharia. lances: os liberados, com a hora de cada um.
function notasDosGols(lances) {

      if (a === b) return; const za = zonaDaPosicao(a, n), zb = zonaDaPosicao(b, n);

// acréscimos dos dois tempos, que vêm no lance de abertura (partidas calculadas antes deles: zero)
const acrDoJogo = () => { const a = baixados.find(l => l.dados && l.dados.tipo === "inicio"); return (a && a.dados.acrescimos) || [0, 0]; };
// Minuto de jogo a partir do relógio real, com 15 minutos de intervalo e os acréscimos, na escala da transmissão.
function momento() {
  const [a1, a2] = acrDoJogo();
  const total = (new Date(partida.fim) - new Date(partida.inicio)) / 60000;
  const t = total > 0 ? (Date.now() - new Date(partida.inicio)) / 60000 * 105 / total : Date.now() >= new Date(partida.inicio) ? 105 : -1;
  const mmss = x => { const s = Math.max(0, Math.floor(x * 60)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
  if (t < 0) { const falta = Math.ceil((new Date(partida.inicio) - Date.now()) / 60000); return { texto: falta > 90 ? `Começa em ${new Date(partida.inicio).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}` : `Começa em ${falta} min`, antes: true }; }
  if (t <= 45) return { texto: `${mmss(t)} · 1º tempo` };
  if (t <= 45 + a1) return { texto: `45:00 +${mmss(t - 45)} · 1º tempo` };
  if (t < 60 + a1) return { texto: "45:00 · intervalo" };
  if (t < 105 + a1) return { texto: `${mmss(t - 15 - a1)} · 2º tempo` };
  if (t < 105 + a1 + a2) return { texto: `90:00 +${mmss(t - 105 - a1)} · 2º tempo` };
  if (ehCopa(partida) && !encerrada) { // se não houve prorrogação, o resultado chega e encerra a transmissão antes disto aparecer
    if (t < 110 + a1 + a2) return { texto: "90:00 · fim do tempo normal", fim: true };
    if (t < 140 + a1 + a2) return { texto: `${mmss(t - 20 - a1 - a2)} · prorrogação`, fim: true };
    return { texto: "Pênaltis", fim: true };
  }
  return { texto: "Fim de jogo", fim: true };
}

  $("corpo").innerHTML = !partida.processada && !lances.length
    ? `<div class="card aviso">Bola rolando! O servidor calcula a partida logo depois do apito (leva até 2 minutos). Os lances aparecem aqui sozinhos.</div>`
    : `${barraDeAbas(["lances", "graf", "estat", pre && "esc", rodada && "rodada"])}${htmlGraficos(narracao, [clubes[partida.casa], clubes[partida.fora]], { aoVivo: true })}<div class="aovivo"><div class="lat-e">${htmlEstatisticas(narracao)}</div><div class="card lan" data-aba="lances"><h2>Lances <span class="tag">os mais recentes em cima · atualiza sozinho</span></h2>${LEGENDA_LANCES}${narracao.slice().reverse().map(comNota).join("") || `<div class="mut">Bola rolando. Nenhum lance de perigo ainda.</div>`}${htmlAbertura(pre, false, true)}
       <div class="mut" style="margin-top:8px">Mapa de zonas, notas e análise aparecem depois do apito final.</div></div>
       ${(duas => `<div class="lat-d ${duas ? "lat-" + latAba : ""}">${duas ? `<div class="lat-abas">${[["esc", "👕 Escalações"], ["rodada", "🏆 Rodada ao vivo"]].map(([k, n]) => `<button class="sec ${latAba === k ? "ativa" : ""}" data-lat="${k}">${n}</button>`).join("")}</div>` : ""}${htmlEscalacoes(pre)}${htmlRodada(gols)}</div>`)(!!(pre && pre.escalacoes && rodada))}</div>`;
  ligarGraficos($("corpo")); aplicarAba();
}

async function iniciar() {
  partida = id ? await partidaPorId(id) : null;
  if (!partida) { $("topo").innerHTML = `<div class="bad">Partida não encontrada.</div>`; return; }
  clubes = Object.fromEntries((await clubesPorIds([partida.casa, partida.fora])).map(c => [c.id, c]));
  const marcas = await marcasDosClubes([partida.casa, partida.fora]).catch(() => ({})); // patrocínio estampado na camisa
  for (const k in clubes) clubes[k].marca = marcas[k] || null;
  preco = await precoDoIngresso(partida.casa).catch(() => null);
  await carregarRodada().catch(() => { rodada = null; });
  await atualizar();
  // a cada 10 segundos redesenha com o que o relógio já liberou (sem consultar o banco) (e busca lances novos só quando os baixados estão acabando); com a aba em segundo plano não busca nada, e ao voltar busca de uma vez o que aconteceu
  let consultaDaPartida = 0; // a partida (calculada? público?) é conferida no máximo uma vez por minuto
  const buscar = async () => { if (encerrada || document.hidden) return; if ((!partida.processada || partida.publico == null) && Date.now() - consultaDaPartida >= 60000) { consultaDaPartida = Date.now(); partida = await partidaPorId(id); }
    // os outros jogos do grupo: junto com a busca dos lances; no ritmo antigo, a cada 30 segundos
    if (adiante ? momento().fim || Date.now() >= proximaBusca : ++voltas % 3 === 0) await atualizarRodada().catch(() => {});
    atualizar().catch(() => {}); };
  relogio = setInterval(buscar, 10000);
  document.addEventListener("visibilitychange", () => { buscar().catch(() => {}); });
  tique = setInterval(() => { if (!encerrada && $("crono")) $("crono").textContent = momento().texto; }, 1000);
}
window.__teste = { SONS, sonsDosLances, placa, dadosDaPlaca, notasDosGols: () => notasDosGols(baixados), htmlRodada, htmlDiretoria, rodada: () => rodada, analiseDoIntervalo, primeiroTempo, veredito }; // para conferir pelo console
// ?demo: botões que disparam as animações (gol, substituição, acréscimo) com jogadores desta partida, para ver sem esperar o lance
function demo() {
  const pre = (baixados.find(l => l.dados && l.dados.tipo === "inicio") || {}).dados, esc0 = pre && pre.escalacoes, nomes = i => esc0 ? esc0[i].titulares.map(x => x.nome) : ["Fulano", "Beltrano"], banco = i => esc0 && esc0[i].banco.length ? esc0[i].banco.map(x => x.nome) : ["Sicrano"];
  const sorte = a => a[Math.floor(Math.random() * a.length)], lado = () => Math.random() < 0.5 ? 0 : 1;
  const el = document.createElement("div"); el.style.cssText = "position:fixed;top:10px;right:10px;z-index:40;display:flex;gap:6px;flex-wrap:wrap";
  el.innerHTML = `<button id="dGol">⚽ Gol</button><button id="dSub">🔁 Substituição</button><button id="dAcr">⏱️ Acréscimo</button><button id="dAm">🟨 Amarelo</button><button id="dVm">🟥 Vermelho</button><button id="dInt">⏸️ Intervalo</button><button id="dFim">🏁 Fim</button><button id="dTv">📺 TV</button>`;
  document.body.append(el);
  $("dGol").onclick = () => { const t = lado(); window.scrollTo({ top: 0, behavior: "smooth" }); setTimeout(() => avisoDeGol({ time: t, quem: sorte(nomes(t)), min: 1 + Math.floor(Math.random() * 90) }), 300); if (somLigado) tocar("gol"); };
  $("dSub").onclick = () => { const t = lado(); placa({ tipo: "substituicao", time: t, sai: sorte(nomes(t)), entra: sorte(banco(t)) }); };
  $("dAcr").onclick = () => placa({ tipo: "acrescimo", acr: 1 + Math.floor(Math.random() * 7) });
  $("dAm").onclick = () => { const t = lado(); placa({ tipo: "amarelo", time: t, nome: sorte(nomes(t)) }); if (somLigado) tocar("amarelo"); };
  // vermelho: metade das vezes direto, metade no segundo amarelo
  $("dVm").onclick = () => { const t = lado(); placa({ tipo: "vermelho", time: t, nome: sorte(nomes(t)), segundo: Math.random() < 0.5 }); if (somLigado) tocar("vermelho"); };
  // jogo com lances: o 1º tempo de verdade; senão, números inventados
  $("dInt").onclick = () => { const n = baixados.map(l => l.dados).filter(l => l && l.tipo !== "inicio" && l.min <= 45);
    if (n.some(l => l.resultado !== undefined)) return cartaoDeIntervalo(n);
    const t = lado(), posse = 40 + Math.floor(Math.random() * 21);
    cartaoDeIntervalo([{ min: 30, resultado: "gol", time: t, quem: sorte(nomes(t)), xg: 0.4, p: [posse] }, ...[0, 1, 0, 1, 0].map(i => ({ min: 40, resultado: "fora", time: i, xg: 0.08 + Math.random() * 0.2 }))]); };
  // jogo encerrado: o cartão de verdade; senão, um placar inventado com jogadores desta partida
  $("dFim").onclick = () => { if (ultimoFim) return cartaoDeFim(ultimoFim);
    const narracao = [], gols = [lado() + lado(), lado()];
    [0, 1].forEach(t => { for (let k = 0; k < gols[t]; k++) narracao.push({ resultado: "gol", time: t, quem: sorte(nomes(t)), min: 1 + Math.floor(Math.random() * 90), xg: 0.1 + Math.random() * 0.5 });
      for (let k = 0; k < 4 + Math.floor(Math.random() * 6); k++) narracao.push({ resultado: "fora", time: t, min: 1 + Math.floor(Math.random() * 90), xg: 0.03 + Math.random() * 0.3 }); });
    narracao.sort((a, b) => a.min - b.min); const t = lado();
    cartaoDeFim({ gols, narracao, melhor: { nome: sorte(nomes(t)), nota: 7 + Math.random() * 2, time: t } }); };
  // TV do intervalo a qualquer hora (comercial → placares → comercial → analista); de novo desliga
  $("dTv").onclick = () => { tvForcada = !tvForcada; intervaloComercial(momento()); if (tvForcada) $("intervalo").scrollIntoView({ behavior: "smooth" }); };
}
iniciar().then(() => { if (new URLSearchParams(location.search).has("demo")) demo(); }).catch(e => { $("topo").innerHTML = `<div class="bad">Não consegui carregar: ${esc(e.message)}</div>`; });
