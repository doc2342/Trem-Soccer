<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trem Soccer · Partida</title>
<link rel="stylesheet" href="estilo.css">
<style>
  .painel { display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; text-align:center; }
  .painel .time { display:flex; flex-direction:column; align-items:center; gap:4px; width:120px; font-weight:600; }
  .painel .gols { font-size:44px; font-weight:800; }
  .relogio { text-align:center; color:var(--ac); font-weight:700; margin-top:6px; }
</style>
</head>
<body>
<main>
  <div><a href="jogo.html" style="color:var(--ac)">← Voltar ao clube</a></div>
  <div class="card" id="topo"><div class="mut">Carregando…</div></div>
  <div id="corpo"></div>
</main>

<script type="module">
import { ligaAtual, partidaPorId, clubesPorIds, lancesDaPartida, relatorioDaPartida } from "./src/banco.js";
import { htmlRelatorio } from "./src/ui-relatorio.js";
import { svgEscudo } from "./src/escudo.js";

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f2 = v => v.toFixed(2).replace(".", ",");
const id = +new URLSearchParams(location.search).get("id");
const COR = ["casa", "fora"];
let partida, clubes, encerrada = false, relogio;

// Minuto de jogo a partir do relógio real, com 15 minutos de intervalo, na escala da transmissão.
function momento() {
  const total = (new Date(partida.fim) - new Date(partida.inicio)) / 60000;
  const t = total > 0 ? (Date.now() - new Date(partida.inicio)) / 60000 * 105 / total : Date.now() >= new Date(partida.inicio) ? 105 : -1;
  if (t < 0) { const falta = Math.ceil((new Date(partida.inicio) - Date.now()) / 60000); return { texto: falta > 90 ? `Começa em ${new Date(partida.inicio).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}` : `Começa em ${falta} min`, antes: true }; }
  if (t <= 45) return { texto: `${Math.max(1, Math.ceil(t))}' · 1º tempo` };
  if (t < 60) return { texto: "Intervalo" };
  if (t < 105) return { texto: `${Math.min(90, Math.ceil(t - 15))}' · 2º tempo` };
  return { texto: "Fim de jogo", fim: true };
}

function topo(gols, m) {
  const c = [clubes[partida.casa], clubes[partida.fora]];
  $("topo").innerHTML = `<div class="mut" style="text-align:center">Grupo ${esc(partida.grupo)} · rodada ${partida.rodada}</div>
    <div class="painel"><div class="time casa">${svgEscudo(c[0].escudo, c[0].sigla, 56)}${esc(c[0].nome)}</div><div class="gols">${m.antes ? "–" : gols[0]} x ${m.antes ? "–" : gols[1]}</div><div class="time fora">${svgEscudo(c[1].escudo, c[1].sigla, 56)}${esc(c[1].nome)}</div></div>
    <div class="relogio">${m.texto}</div>`;
}

async function atualizar() {
  const m = momento();
  if (m.antes) { topo([0, 0], m); $("corpo").innerHTML = `<div class="card mut">A transmissão começa no horário do jogo. Os lances aparecem aqui minuto a minuto.</div>`; return; }
  const [lances, res] = await Promise.all([lancesDaPartida(id), relatorioDaPartida(id)]);
  const narracao = lances.map(l => l.dados);
  if (res) {
    encerrada = true; clearInterval(relogio);
    topo([res.gols_casa, res.gols_fora], { texto: "Fim de jogo" });
    $("corpo").innerHTML = `<div class="card mut">Times comandados por: ${esc(clubes[partida.casa].nome)}, ${res.relatorio.comandados[0]} · ${esc(clubes[partida.fora].nome)}, ${res.relatorio.comandados[1]}.</div>` +
      htmlRelatorio({ ...res.relatorio, narracao }, { nomes: [clubes[partida.casa].nome, clubes[partida.fora].nome] });
    return;
  }
  const gols = [0, 1].map(i => narracao.filter(l => l.resultado === "gol" && l.time === i).length);
  topo(gols, m);
  $("corpo").innerHTML = !partida.processada && !lances.length
    ? `<div class="card aviso">A partida ainda não foi calculada pelo servidor. Os lances aparecem assim que o cálculo rodar.</div>`
    : `<div class="card"><h2>Lances <span class="tag">os mais recentes em cima · atualiza sozinho</span></h2>${narracao.slice().reverse().map(l => `<div class="lance ${l.resultado === "gol" ? "gol" : ""}"><span class="min">${l.min}'</span><span class="${COR[l.time]}">${esc(l.texto)}</span>${l.xg ? `<span class="xg">xG ${f2(l.xg)}</span>` : ""}</div>`).join("") || `<div class="mut">Bola rolando. Nenhum lance de perigo ainda.</div>`}
       <div class="mut" style="margin-top:8px">Estatísticas, xG, mapa de zonas e notas aparecem depois do apito final.</div></div>`;
}

async function iniciar() {
  partida = id ? await partidaPorId(id) : null;
  if (!partida) { $("topo").innerHTML = `<div class="bad">Partida não encontrada.</div>`; return; }
  clubes = Object.fromEntries((await clubesPorIds([partida.casa, partida.fora])).map(c => [c.id, c]));
  await atualizar();
  relogio = setInterval(async () => { if (encerrada) return; if (!partida.processada) partida = await partidaPorId(id); atualizar().catch(() => {}); }, 10000);
}
iniciar().catch(e => { $("topo").innerHTML = `<div class="bad">Não consegui carregar: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
