<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trem Soccer · Sede</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="estilo.css">
<script src="atualiza.js"></script>
<style>
  .cabeca { padding:16px 18px; border-top:4px solid var(--ac); }
  .cabeca h2 { margin:0; font-size:34px !important; line-height:1; font-weight:700 !important; }
  .num { display:flex; gap:22px; flex-wrap:wrap; margin-top:10px; } .num b { display:block; font-family:var(--display); font-weight:600; font-size:24px; } .num .mut { font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; }
  #cena { height:420px; border-radius:8px; overflow:hidden; background:var(--line); } @media (max-width:620px) { #cena { height:300px; } .cabeca h2 { font-size:26px !important; } }
  canvas.festa { position:absolute; inset:0; pointer-events:none; }
  .sedes { display:flex; gap:8px; flex-wrap:wrap; } .sedes a { color:var(--ac); text-decoration:none; padding:4px 10px; border:1px solid var(--line); border-radius:999px; font-size:13px; }
  .sedes a.on { background:var(--ac); color:#fff; border-color:var(--ac); }
  table { width:100%; border-collapse:collapse; font-size:13.5px; } td, th { padding:6px 4px; border-bottom:1px solid var(--line); text-align:left; } th { font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); }
</style>
</head>
<body>
<main>
  <div style="display:flex;gap:12px;align-items:center"><a href="jogo.html" style="color:var(--ac)" onclick="if (history.length > 1) { history.back(); return false; }">← Voltar</a><span class="relogio" style="margin-left:auto" title="Hora deste aparelho"></span></div>
  <div id="corpo"><div class="card mut">Carregando…</div></div>
</main>

<script type="module">
import { sb, ligaAtual, clubesPorIds } from "./src/banco.js";
import { desenharEstadio, SEDES, FINAIS, configDaSede } from "./src/estadio.js";

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const s = SEDES[new URLSearchParams(location.search).get("s")] ? new URLSearchParams(location.search).get("s") : "maracana", sede = SEDES[s];
const mil = n => (+n || 0).toLocaleString("pt-BR");
let cena = null;
// ?previa: museu e sorteio de exemplo, sem ler o banco (para ver a página antes de haver finais)
const previa = new URLSearchParams(location.search).has("previa");
const EX = [["Colorado", "#c8102e", "#ffffff"], ["America", "#0a7d3b", "#ffffff"], ["Amnesia", "#1d1d1b", "#f2c200"], ["Trem Azul", "#0b3d91", "#ffffff"], ["Ferroviário", "#5b2a86", "#f2f2f2"], ["Vila Nova", "#e05a00", "#1d1d1b"]];
const exemplo = () => { const i = Object.keys(SEDES).indexOf(s), comp = ["LIB", "COPA", "SUL", "SUP", "REC", "COPA"];
  return [3, 2, 1].map((t, j) => { const a = EX[(i + j) % 6], b = EX[(i + j + 3) % 6], gc = (i + j) % 3, gf = (i + 2 * j) % 3;
    return { temporada: t, competicao: s === "maracana" ? "LIB" : comp[(i + j) % 6], casa_nome: a[0], fora_nome: b[0], gols_casa: gc, gols_fora: gf, campeao: 1, campeao_nome: gc >= gf ? a[0] : b[0], cores: gc >= gf ? a.slice(1) : b.slice(1), publico: Math.round(SEDES[s].lugares * (0.78 + 0.07 * j)) }; }); };
const desenhar = cfg => { const el = document.getElementById("cena"); if (cena) { cena.destruir(); cena = null; } return desenharEstadio(el, cfg).then(v => { cena = v; return v; }).catch(e => { el.innerHTML = `<div class="mut" style="padding:10px">${esc(e.message)}</div>`; }); };

async function carregar() {
  document.title = "Trem Soccer · " + sede.nome;
  const liga = previa ? null : await ligaAtual();
  const sedes = previa ? { COPA: "wembley", SUL: "sansiro", SUP: "laterais", REC: "inflavel" } : liga ? ((await sb.rpc("sedes_da_temporada", { p_liga: liga.id })).data || liga.sedes || {}) : {};
  const aqui = Object.keys(FINAIS).filter(k => (k === "LIB" ? "maracana" : sedes[k]) === s);
  const finais = previa ? exemplo() : liga ? ((await sb.from("finais_nas_sedes").select("*").eq("liga_id", liga.id).eq("sede", s).order("temporada", { ascending: false }).order("criado_em", { ascending: false })).data || []) : [];
  const ultima = finais.find(f => f.campeao);
  const camp = previa ? { nome: ultima.campeao_nome, escudo: { cor1: ultima.cores[0], cor2: ultima.cores[1] } } : ultima ? (await clubesPorIds([ultima.campeao]))[0] : null;
  const festa = camp ? { nome: camp.nome, cores: [camp.escudo?.cor1 || "#0b3d91", camp.escudo?.cor2 || "#ffffff"] } : null;
  const placar = f => `${esc(f.casa_nome)} ${f.gols_casa} x ${f.gols_fora} ${esc(f.fora_nome)}${f.gols_casa === f.gols_fora ? " (pên.)" : ""}`;
  document.getElementById("corpo").innerHTML = `
    <div class="card"><div class="sedes">${Object.entries(SEDES).map(([k, v]) => `<a href="sede.html?s=${k}${previa ? "&previa" : ""}" class="${k === s ? "on" : ""}">${esc(v.nome)}</a>`).join("")}</div></div>
    <div class="card cabeca"><h2>${esc(sede.nome)}</h2><div class="mut">${esc(sede.cidade)} · sede oficial das finais${previa ? ' · <span class="aviso">prévia com finais de exemplo</span>' : ""}</div>
      <div class="num"><div><b>${mil(sede.lugares)}</b><span class="mut">lugares</span></div><div><b>${finais.length}</b><span class="mut">finais aqui</span></div>
        <div><b>${aqui.length ? aqui.map(k => FINAIS[k]).join(", ") : "—"}</b><span class="mut">final desta temporada</span></div></div></div>
    <div class="card"><div style="position:relative"><div id="cena"></div></div>
      ${festa ? `<div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button id="bFesta">Ver a festa do ${esc(camp.nome)}</button><button id="bSom" class="sec" title="Som da festa"></button><span class="mut" style="font-size:12.5px">Último campeão aqui: ${esc(FINAIS[ultima.competicao] || "")} ${ultima.temporada}</span></div>` : ""}</div>
    <div class="card"><h3>Finais disputadas aqui</h3>${finais.length ? `<table><tr><th>Temp.</th><th>Competição</th><th>Jogo</th><th>Campeão</th><th>Público</th></tr>
      ${finais.map(f => `<tr><td>${f.temporada}</td><td>${esc(FINAIS[f.competicao] || f.competicao)}</td><td>${placar(f)}</td><td><b>${esc(f.campeao_nome || "—")}</b></td><td>${mil(f.publico)}</td></tr>`).join("")}</table>`
      : `<div class="mut">Nenhuma final jogada aqui ainda.</div>`}</div>`;
  // logo depois de uma final (até 24 h) a página já abre na festa, com papel picado e fumaça
  const b = document.getElementById("bFesta");
  let emFesta = !!festa && (previa || Date.now() - new Date(ultima.criado_em).getTime() < 864e5);
  const mostrar = () => { if (b) b.textContent = emFesta ? "Ver o mosaico da sede" : `Ver a festa do ${camp.nome}`;
    desenhar(configDaSede(s, emFesta ? ultima.competicao : aqui[0], emFesta ? festa : null)); if (emFesta) festejar(festa.cores); };
  mostrar();
  if (b) b.onclick = () => { emFesta = !emFesta; if (!emFesta) SOM.parar(); mostrar(); };
  // alto-falante: desligado por padrão; ligar no meio da festa já toca a torcida pelo tempo que falta
  const bs = document.getElementById("bSom"), rotulo = () => { if (bs) bs.textContent = SOM.ligado ? "🔇 desligar som" : "🔊 ligar som"; };
  if (bs) bs.onclick = () => { SOM.alternar(); rotulo(); };
  rotulo();
}
// ---------- som da festa (Web Audio, gerado aqui: nenhum arquivo) ----------
// Torcida = ruído filtrado que cresce, ondula e vai sumindo, com palmas no começo; fogos = assobio subindo e estouro grave com estalos.
// Desligado por padrão (escolha guardada neste aparelho, separada do som do ao vivo); o navegador só toca depois de um clique.
const SOM = (() => {
  let ligado = false, ctx = null, mestre = null, buf = null, fimDaFesta = 0;
  try { ligado = localStorage.getItem("mo_som_festa") === "1"; } catch (e) {}
  const audio = () => { if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    if (ctx.state === "suspended") ctx.resume(); if (!mestre) { mestre = ctx.createGain(); mestre.gain.value = 0.9; mestre.connect(ctx.destination); } return ctx; };
  // ruído por um filtro, com o volume seguindo os pontos [segundos, volume]
  const ruido = (ini, dur, tipo, f, q, pontos) => { const a = audio(), t = a.currentTime + ini, src = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
    src.buffer = buf; src.loop = true; fl.type = tipo; fl.frequency.value = f; fl.Q.value = q; g.gain.setValueAtTime(0, t); pontos.forEach(([s, v]) => g.gain.linearRampToValueAtTime(v, t + s));
    src.connect(fl).connect(g).connect(mestre); src.start(t, Math.random() * 1.5); src.stop(t + dur); };
  const torcida = seg => { if (seg < 1.5) return; const ond = []; for (let s = 1.2; s < seg - 2; s += 0.9) ond.push([s, 0.22 + 0.1 * Math.random()]);
    ruido(0, seg, "bandpass", 700, 0.6, [[1, 0.3], ...ond, [seg, 0]]); ruido(0, seg, "bandpass", 1900, 0.9, [[1.2, 0.12], [seg - 1.5, 0.1], [seg, 0]]);
    for (let k = 0; k < 10; k++) { const t = 0.4 + k * 0.42; if (t < seg - 1) ruido(t, 0.09, "highpass", 1800, 0.7, [[0.005, 0.35], [0.09, 0]]); } }; // palmas
  const assobio = () => { const a = audio(), t = a.currentTime, o = a.createOscillator(), g = a.createGain(); o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(2600, t + 0.7);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.035, t + 0.05); g.gain.linearRampToValueAtTime(0, t + 0.7); o.connect(g).connect(mestre); o.start(t); o.stop(t + 0.75); };
  const estouro = () => { ruido(0, 1.4, "lowpass", 380, 0.8, [[0.01, 0.9], [0.25, 0.35], [1.4, 0]]);
    for (let k = 0; k < 9; k++) ruido(0.15 + Math.random() * 0.8, 0.04, "highpass", 3000, 0.6, [[0.003, 0.18], [0.04, 0]]); }; // estalos
  const ok = () => ligado && ctx && performance.now() < fimDaFesta; // festa desligada: os fogos que ainda caem ficam mudos
  return {
    get ligado() { return ligado; },
    alternar() { ligado = !ligado; try { localStorage.setItem("mo_som_festa", ligado ? "1" : "0"); } catch (e) {}
      if (ligado) { audio(); const resta = (fimDaFesta - performance.now()) / 1000; if (resta > 0) torcida(resta); } else this.parar(); },
    festa(ms) { fimDaFesta = performance.now() + ms + 1500; if (ligado) try { audio(); torcida(ms / 1000); } catch (e) {} },
    fogo() { if (ok()) try { assobio(); } catch (e) {} }, estouro() { if (ok()) try { estouro(); } catch (e) {} },
    parar() { fimDaFesta = 0; if (mestre) { const m = mestre; mestre = null; try { m.gain.setTargetAtTime(0, ctx.currentTime, 0.1); setTimeout(() => m.disconnect(), 600); } catch (e) {} } },
  };
})();
// festa do título por cima do 3D (canvas), uns 10 segundos nas cores do campeão: fogos estourando no céu,
// fumaça colorida saindo das arquibancadas e papel picado caindo
function festejar(cores) {
  const box = document.getElementById("cena").parentElement; box.querySelector("canvas.festa")?.remove(); // fora do #cena: o 3D limpa a caixa dele ao carregar
  const cv = document.createElement("canvas"); cv.className = "festa"; box.appendChild(cv);
  const W = cv.width = box.clientWidth, H = cv.height = box.clientHeight, g = cv.getContext("2d"), t0 = performance.now(), DUR = 10000; SOM.festa(DUR - 1000);
  const cor = c => /^#[0-9a-f]{6}$/i.test(c) ? c : "#ffffff", cc = cores.map(cor), cs = [...cc, "#ffffff"], R = (a, b) => a + Math.random() * (b - a), um = l => l[Math.random() * l.length | 0];
  const pap = Array.from({ length: 170 }, () => ({ x: R(0, W), y: -R(0, H), vy: R(40, 110), vx: R(-15, 15), a: R(0, 6), va: R(-4, 4), c: um(cs), w: R(4, 8) }));
  const fum = [], fogos = [], fag = [];
  let ult = t0, proxFogo = 300;
  const fumaca = (x, y, c, r, vy) => fum.push({ x, y, r, vy, vx: R(-8, 8), c, v: 0 });
  const passo = agora => { const dt = Math.min(0.05, (agora - ult) / 1000), t = agora - t0; ult = agora; g.clearRect(0, 0, W, H);
    const fim = Math.max(0, 1 - Math.max(0, t - DUR + 1800) / 1800); // tudo some nos últimos 1,8 s
    // fumaça colorida saindo das arquibancadas (o 3D diz onde elas estão na tela a cada quadro)
    const pts = cena?.pontosDaFesta?.() || [];
    if (t < DUR - 2500 && pts.length) for (let n = 0; n < 2; n++) if (Math.random() < dt * 9) { const q = um(pts); fumaca(q.x + R(-6, 6), q.y, um(cc), R(10, 18), R(10, 22)); }
    for (let k = fum.length - 1; k >= 0; k--) { const f = fum[k]; f.v += dt; f.y -= f.vy * dt; f.x += f.vx * dt; f.r += 10 * dt; if (f.v > 6) { fum.splice(k, 1); continue; }
      const gr = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r); gr.addColorStop(0, f.c + "70"); gr.addColorStop(1, f.c + "00");
      g.globalAlpha = 0.85 * fim * Math.max(0, 1 - f.v / 6); g.fillStyle = gr; g.beginPath(); g.arc(f.x, f.y, f.r, 0, 7); g.fill(); }
    g.globalCompositeOperation = "lighter";
    // fogos: sobem com rastro e estouram numa bola de faíscas
    if (t > proxFogo && t < DUR - 2500) { proxFogo = t + R(250, 550); SOM.fogo(); fogos.push({ x: W * R(0.12, 0.88), y: H, vy: -R(H * 0.9, H * 1.2), alvo: H * R(0.08, 0.32), c: um(cs) }); }
    for (let k = fogos.length - 1; k >= 0; k--) { const f = fogos[k]; f.y += f.vy * dt;
      g.globalAlpha = fim; g.fillStyle = "#fff4d0"; g.fillRect(f.x - 1.5, f.y, 3, 16);
      if (f.y <= f.alvo) { SOM.estouro(); const n = 80, v = R(H * 0.3, H * 0.45), c2 = um(cs); for (let i = 0; i < n; i++) { const a = 2 * Math.PI * i / n, vv = v * R(0.6, 1); fag.push({ x: f.x, y: f.y, vx: Math.cos(a) * vv, vy: Math.sin(a) * vv, c: i % 3 ? f.c : c2, v: 0, dur: R(1.1, 1.7) }); } fogos.splice(k, 1); } }
    for (let k = fag.length - 1; k >= 0; k--) { const q = fag[k]; q.v += dt; if (q.v > q.dur) { fag.splice(k, 1); continue; }
      q.vx *= 1 - 1.6 * dt; q.vy = q.vy * (1 - 1.6 * dt) + H * 0.25 * dt; q.x += q.vx * dt; q.y += q.vy * dt;
      g.globalAlpha = fim * (1 - q.v / q.dur); g.fillStyle = q.c; g.beginPath(); g.arc(q.x, q.y, 3, 0, 7); g.fill(); g.globalAlpha *= 0.35; g.beginPath(); g.arc(q.x, q.y, 7, 0, 7); g.fill(); }
    g.globalCompositeOperation = "source-over"; g.globalAlpha = fim;
    // papel picado
    for (const q of pap) { q.y += q.vy * dt; q.x += q.vx * dt + Math.sin(t / 300 + q.a) * 0.6; q.a += q.va * dt; if (q.y > H + 10 && t < DUR - 3000) q.y = -10;
      g.save(); g.translate(q.x, q.y); g.rotate(q.a); g.fillStyle = q.c; g.fillRect(-q.w / 2, -q.w * 0.3, q.w, q.w * 0.6 * Math.abs(Math.cos(q.a * 1.7)) + 1); g.restore(); }
    if (t < DUR && cv.isConnected) requestAnimationFrame(passo); else cv.remove(); };
  requestAnimationFrame(passo);
}
carregar().catch(e => { document.getElementById("corpo").innerHTML = `<div class="card bad">${esc(e.message)}</div>`; });
</script>
</body>
</html>
