// Clube extra: elenco novo na mÃ©dia do paÃ­s (nota mÃ©dia dos 16 melhores de cada clube sem dono de lÃ¡), com salÃ¡rios e contratos.

async function aprovarExtra(p, clubeId) {

  if (!bots.length) throw new Error("Esse paÃ­s nÃ£o tem clube sem dono.");
  const forca = el => { const n = el.filter(j => !j.juvenil).map(j => notaBruta(j.at, j.pos)).sort((a, b) => b - a).slice(0, 16); return n.reduce((s, x) => s + x, 0) / (n.length || 1); };
  const forcas = await Promise.all(bots.map(async c => forca(await elencoDoClube(c.id))));

// Nome de clube sem dono: prefixo + sobrenome do paÃ­s, e sigla com as trÃªs primeiras letras do sobrenome.
function nomeDeClube(rng, usados, pais = "Brasil") {
  for (;;) {
    const sobrenome = rng.pick(nomes.paises[pais].s), nome = `${rng.pick(pais === "Brasil" ? PREFIXOS : PREFIXOS_DE_FORA)} ${sobrenome}`;
    const sigla = sobrenome.normalize("NFD").replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase();
    if (sigla.length === 3 && !usados.has(nome) && !usados.has(sigla)) { usados.add(nome); usados.add(sigla); return { nome, sigla }; }
  }
}

  // Foto do inÃ­cio a partir de um backup (backup-AAAA-MM-DD.json.gz, baixado do Storage do Supabase): o estado daquele dia.

// Calcula as partidas cujo horÃ¡rio jÃ¡ chegou. As tÃ¡ticas dos dirigentes valem; clube sem dono ou inativo joga com o bot.
// Primeiro pede ao servidor; se a funÃ§Ã£o do servidor nÃ£o estiver publicada, calcula aqui mesmo, no navegador.
async function processar(silencioso) {
  if (ocupado) return;
  const pausada = await ligaAtual().then(l => l && l.pausada).catch(() => false);
  if (pausada) { if (!silencioso && $("progresso")) $("progresso").textContent = "A liga estÃ¡ pausada: retome antes de calcular partidas."; return; }
  ocupado = true;
  const diz = t => { if ($("progresso")) $("progresso").textContent = t; };
  try {
    const servidor = await calcularNoServidor();
    if (servidor) {
      const hora = new Date().toLocaleTimeString("pt-BR"), falhas = servidor.erros && servidor.erros.length ? ` Falhas: ${servidor.erros.join("; ")}` : "";
      ocupado = false;
      if (servidor.calculadas || falhas) await tela(`Servidor: ${servidor.calculadas} ${servidor.calculadas === 1 ? "partida calculada" : "partidas calculadas"} Ã s ${hora}.${falhas}`);
      else if (!silencioso) diz(`Servidor: nenhuma partida esperando cÃ¡lculo (${hora}).`);
      return;
    }
    const liga = await ligaAtual(), todas = liga ? await partidasPendentes(liga.id) : [];
    // jogo de copa sÃ³ o servidor calcula: aqui nÃ£o hÃ¡ cartÃµes da copa nem a trava de clube; ele espera o servidor voltar
    const pendentes = todas.filter(p => !ehCopa(p)), copaEsperando = todas.length - pendentes.length;
    const avisoCopa = copaEsperando ? ` ${copaEsperando} ${copaEsperando === 1 ? "jogo de copa espera" : "jogos de copa esperam"} o servidor (sÃ³ ele calcula a copa).` : "";
    if (!pendentes.length) { if (!silencioso || copaEsperando) diz((todas.length ? "O servidor nÃ£o respondeu." : "Nenhuma partida esperando cÃ¡lculo.") + avisoCopa); return; }
    const ids = [...new Set(pendentes.flatMap(p => [p.casa, p.fora]))];
    const [clubes, taticas] = await Promise.all([clubesPorIds(ids), taticasDe(ids)]);
    const cPor = Object.fromEntries(clubes.map(c => [c.id, c])), tPor = Object.fromEntries(taticas.map(t => [t.clube_id, t.dados])), elencos = {};
    for (let i = 0; i < ids.length; i += 10) await Promise.all(ids.slice(i, i + 10).map(async id => { elencos[id] = await elencoDoClube(id); }));
    let n = 0;
    for (const p of pendentes) {
      const lado = id => ({ clube: cPor[id], elenco: elencos[id], tatica: tPor[id] || null });
      const { lances, resultado, situacao } = calcularPartida({ partida: p, casa: lado(p.casa), fora: lado(p.fora), minutosTransmissao: liga.minutos_transmissao, semente: Math.floor(Math.random() * 2147483647) });
      await gravarPartida(p.id, lances, resultado);
      await gravarSituacao(situacao); aplicarSituacao(elencos[p.casa], situacao); aplicarSituacao(elencos[p.fora], situacao);
      await lancarRodada(p.id);
      diz(`Calculando: ${++n} de ${pendentes.length}â€¦`);
    }
    ocupado = false; await tela(`Neste navegador (o servidor nÃ£o respondeu): ${n} ${n === 1 ? "partida calculada" : "partidas calculadas"} Ã s ${new Date().toLocaleTimeString("pt-BR")}.${avisoCopa}`);
  } catch (e) { diz("Erro ao calcular: " + e.message); }
  finally { ocupado = false; }
}
