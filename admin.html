<script type="module">
import { criarRng } from "./src/rng.js";
import { notaBruta, paisDoGrupo } from "./src/modelo.js";

import { simularMetas, campanhaNaCopa, variacaoDaConfianca, posicaoPelosEsperados, metaPelaForca, forcaDoElenco, CONFIG_DIRETORIA } from "./src/diretoria.js";
import { metasDaTemporada, definirMetas, aplicarConfianca, zerarConfianca, caixasDaLiga, pedidosExtraPendentes, aprovarPedidoExtra, recusarPedidoExtra } from "./src/banco.js";
import { contratoInicial, dinheiro, impostoDoLucro } from "./src/economia.js";

import { FASES_DA_COPA, ehCopa, finalistasDaCopa, sair, ehAdmin, ligaAtual, clubesDaLiga, criarLiga, criarClubeComElenco, apagarLiga, atualizarLiga, partidasDaLiga, criarPartidas, apagarPartidas,
  partidasPendentes, taticasDe, clubesPorIds, elencoDoClube, gravarPartida, anteciparRodada, ajustarPrazos, emailsDosDirigentes, calcularNoServidor, limparTreinadores, efeitosPendentes, ajustarJanelaFinal, marcarInicioDaTemporada, executarPreAcordos, campanhasDaTemporada, guardarEstatisticas, atualizarTorcidas, premiarTemporada, fatorDaCopa, safrasRecentes, registrarSafra, gerarLigaDeBase, premiarLigaDeBase, selecaoDaTemporada, premiarTecnicos, pedidosPendentes, decidirPedido, definirContratos, gravarSituacao, lancarRodada, pausarLiga, liberarClube, refazerPartida, definirPlacar, fazerBackupNoServidor, copiaCompleta, resultadosDe, nomeDoGrupo, guardarEstadoInicial, reiniciarTeste, divisoesDosClubes, talentosDaLiga, virarTemporada, lucrosDaTemporada, distribuirTaxas, livresDaLiga, liberarJogadores, transferenciasDaLiga, anularTransferencia, PAISES, ordenarGrupos, tetoDoClube } from "./src/banco.js";

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nomes = await (await fetch("./dados/nomes.json")).json();
const GRUPOS = ["A", "B", "C", "D", "E"], POR_GRUPO = 10, NIVEL = 30;
const gruposDe = clubes => ordenarGrupos([...new Set(clubes.map(c => c.grupo))]); // os do Brasil e os dos países que já existem
const PREFIXOS_DE_FORA = ["Club Atlético", "Deportivo", "Sportivo", "Unión", "Racing", "Nacional", "Real", "Independiente", "Defensores de", "Club Social"];
// Régua provisória dos países: onze titular de 37,5 (o mais forte) a 34,5, que ainda cabe no teto de folha da Série A. A régua de verdade sai da simulação.
const NIVEL_DE_FORA = k => 37.5 - k / 3;
const PREFIXOS = ["Atlético", "Esporte Clube", "União", "Sport", "Grêmio", "Real", "Operário", "Náutico", "Associação", "Sociedade Esportiva", "Clube", "Independente"];
const dataHora = d => new Date(d).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
let relogio = null, ocupado = false;

// Fila de aprovação: pedidos de clube esperando decisão.
let nPedidos = 0, nDirigentes = 0;
const titulo = () => { document.title = `(${nPedidos ? nPedidos + " " + (nPedidos === 1 ? "pedido" : "pedidos") + " · " : ""}${nDirigentes}) Trem Soccer · Administração`; };
async function pedidos(aviso = "") {
  const el = $("pedidos"); if (!el) return;
  const [l, extras] = await Promise.all([pedidosPendentes(), pedidosExtraPendentes()]);
  const escolha = Object.fromEntries([...el.querySelectorAll("select[id^=extraClube-]")].map(x => [x.id, x.value])); // a lista se refaz a cada 30 s: guarda o que o admin já escolheu
  const bots = extras.length ? (await clubesDaLiga((await ligaAtual()).id)).filter(c => !c.dono) : [];
  nPedidos = l.length + extras.length; titulo();
  el.innerHTML = `<h2>Pedidos de clube: ${nPedidos} <span class="tag">atualiza sozinho a cada 30 segundos</span></h2>
    ${l.length ? l.map(p => `<div class="lance" style="align-items:center">${svgEscudo(p.escudo, p.sigla, 44)}<span><b>${esc(p.nome)}</b> (${esc(p.sigla)})<br><span class="tag">${esc(p.email || "")} · pediu em ${dataHora(p.criado_em)}</span></span>
      <span class="xg"><button data-aprova="${p.id}">Aprovar</button> <button class="sec" data-recusa="${p.id}">Recusar</button></span></div>`).join("") : extras.length ? "" : `<div class="mut">Nenhum pedido esperando.</div>`}
    ${extras.map(p => `<div class="lance" style="align-items:center">${svgEscudo(p.escudo, p.sigla, 44)}<span><b>${esc(p.nome)}</b> (${esc(p.sigla)}) <span class="tag">clube extra · ${esc(p.pais)}</span><br><span class="tag">${esc(p.email || "")} · pediu em ${dataHora(p.criado_em)}</span></span>
      <span class="xg"><select id="extraClube-${p.user_id}" title="Qual clube sem dono vira o clube extra"><option value="">Clube: sorteio</option>${bots.filter(c => paisDoGrupo(c.grupo) === p.pais).sort((a, b) => a.nome.localeCompare(b.nome)).map(c => `<option value="${c.id}" ${escolha["extraClube-" + p.user_id] == c.id ? "selected" : ""}>${esc(c.nome)}</option>`).join("")}</select> <button data-aprova-extra="${p.user_id}">Aprovar</button> <button class="sec" data-recusa-extra="${p.user_id}">Recusar</button></span></div>`).join("")}
    ${aviso ? `<div class="aviso" style="margin-top:8px">${esc(aviso)}</div>` : ""}`;
  el.onclick = async e => {
    const ae = e.target.dataset.aprovaExtra, re = e.target.dataset.recusaExtra;
    if (ae || re) {
      const motivo = re ? prompt("Motivo da recusa (a pessoa vai ver; pode ficar em branco):") : null;
      if (re && motivo === null) return;
      e.target.disabled = true;
      try { if (re) await recusarPedidoExtra(re, motivo); else await aprovarExtra(extras.find(p => p.user_id === ae), +$("extraClube-" + ae).value || null); await pedidos(re ? "Pedido recusado." : "Pedido aprovado: o clube extra já está com o dirigente, com elenco novo."); dirigentes().catch(() => {}); }
      catch (err) { await pedidos("Não deu: " + err.message); }
      return;
    }
    const a = e.target.dataset.aprova, r = e.target.dataset.recusa;
    if (!a && !r) return;
    let motivo = null;
    if (r) { motivo = prompt("Motivo da recusa (a pessoa vai ver; pode ficar em branco):"); if (motivo === null) return; }
    e.target.disabled = true;
    try { await decidirPedido(+(a || r), !!a, motivo); await pedidos(a ? "Pedido aprovado: o clube já está com o dirigente." : "Pedido recusado."); dirigentes().catch(() => {}); }
    catch (err) { await pedidos("Não deu: " + err.message); }
  };
}

// Clube extra: elenco novo na média do país (nota média dos 16 melhores de cada clube sem dono de lá), com salários e contratos.
// O banco sorteia o bot e troca tudo numa transação só (aprovar_pedido_extra).
async function aprovarExtra(p, clubeId) {
  const liga = await ligaAtual(), rng = criarRng(Date.now() % 2147483647);
  const bots = (await clubesDaLiga(liga.id)).filter(c => !c.dono && paisDoGrupo(c.grupo) === p.pais);
  if (!bots.length) throw new Error("Esse país não tem clube sem dono.");
  const forca = el => { const n = el.filter(j => !j.juvenil).map(j => notaBruta(j.at, j.pos)).sort((a, b) => b - a).slice(0, 16); return n.reduce((s, x) => s + x, 0) / (n.length || 1); };
  const forcas = await Promise.all(bots.map(async c => forca(await elencoDoClube(c.id))));
  const nivel = forcas.reduce((s, x) => s + x, 0) / forcas.length;
  const elenco = gerarElenco(rng, { nivel, perfil: rng.pick(Object.keys(PERFIS)), pais: p.pais, nomes }).map(j => {
    const { mercado, ...contrato } = contratoInicial(rng, j, liga.temporada);
    contrato.contrato_ate = liga.temporada + rng.int(1, 2); // clube assumido no meio do caminho: ninguém vence na temporada atual
    return { nome: j.nome, pais: j.pais, idade: j.idade, pos: j.pos, fam: j.fam, at: j.at, pe: j.pe, principal: !!j.titular, tal: j.tal, salario_mercado: mercado, ...contrato };
  });
  return aprovarPedidoExtra(p.user_id, elenco, clubeId);
}

// Clubes com dirigente, do mais recente para o mais antigo. Atualiza sozinho e põe o número no título da aba.
async function dirigentes() {
  const el = $("dirigentes"); if (!el) return;
  const liga = await ligaAtual(); if (!liga) return;
  const [clubes, emails] = await Promise.all([clubesDaLiga(liga.id), emailsDosDirigentes()]);
  const ePor = Object.fromEntries(emails.map(e => [e.clube_id, e.email]));
  // clube extra (96_seletor_de_clubes.sql) vem logo abaixo do principal do mesmo dirigente; a ordem é a do principal
  const comDono = clubes.filter(c => c.dono), maisNovo = (a, b) => new Date(b.assumido_em) - new Date(a.assumido_em);
  const principais = comDono.filter(c => !c.extra || !comDono.some(x => x.dono === c.dono && !x.extra)).sort(maisNovo);
  const l = principais.flatMap(c => [c, ...comDono.filter(x => x.dono === c.dono && x !== c && x.extra).sort(maisNovo).map(x => ({ ...x, de: c }))]);
  const novo = c => Date.now() - new Date(c.assumido_em) < 24 * 3600000;
  nDirigentes = new Set(comDono.map(c => c.dono)).size; titulo();
  el.innerHTML = `<h2>Dirigentes: ${nDirigentes}, com ${l.length} de ${clubes.length} clubes <span class="tag">atualiza sozinho a cada 30 segundos · o número também aparece no título da aba</span></h2>
    ${l.length ? `<div class="rolagem"><table><tr><th></th><th class="esq">Clube</th><th>Grupo</th>${emails.length ? `<th class="esq">E-mail</th>` : ""}<th>Entrou em</th><th>Último acesso</th><th></th></tr>
      ${l.map(c => `<tr${c.de ? ` style="font-size:.94em"` : ""}><td>${svgEscudo(c.escudo, c.sigla, 24)}</td><td class="esq">${c.de ? `<span class="mut">↳</span> ` : ""}${esc(c.nome)} ${novo(c) ? `<span class="ok">novo</span>` : ""}${c.de ? ` <span class="mut">· clube extra de ${esc(c.de.nome)}</span>` : ""}</td><td>${esc(c.grupo)}</td>${emails.length ? `<td class="esq">${esc(ePor[c.id] || "")}</td>` : ""}<td>${dataHora(c.assumido_em)}</td><td>${c.ultimo_acesso ? dataHora(c.ultimo_acesso) : "—"}</td><td><button class="sec" data-libera="${c.id}" data-nome="${esc(c.nome)}">Liberar</button></td></tr>`).join("")}</table></div>` : `<div class="mut">Nenhum clube com dirigente ainda.</div>`}`;
  el.onclick = async e => {
    const id = e.target.dataset.libera; if (!id) return;
    if (!confirm(`Liberar o clube "${e.target.dataset.nome}"? O dirigente perde o clube, que volta para o bot, e a tática dele é apagada. Não dá para desfazer.`)) return;
    e.target.disabled = true;
    try { await liberarClube(+id); await tela("Clube liberado."); } catch (err) { await tela("Não deu para liberar: " + err.message); }
  };
}

// Partidas de uma rodada e de um grupo, com as ações de refazer e de trocar o placar.
async function partidasAdmin() {
  const el = $("partidasAdm"); if (!el) return;
  const liga = await ligaAtual(), todas = await partidasDaLiga(liga.id), clubes = Object.fromEntries((await clubesDaLiga(liga.id)).map(c => [c.id, c]));
  const g = $("admGrupo") ? $("admGrupo").value : "A", rodadas = [...new Set(todas.map(p => p.rodada))];
  const ultimaFeita = Math.max(1, ...todas.filter(p => p.processada).map(p => p.rodada));
  const r = $("admRodada") ? +$("admRodada").value : ultimaFeita;
  const lista = todas.filter(p => p.grupo === g && p.rodada === r), res = Object.fromEntries((await resultadosDe(lista.map(p => p.id), true)).map(x => [x.partida_id, x]));
  el.innerHTML = `<h2>Partidas <span class="tag">refazer apaga o resultado e calcula de novo · trocar o placar serve para W.O. e não mexe no relatório</span></h2>
    <div class="row"><label>Grupo<select id="admGrupo">${gruposDe(Object.values(clubes)).map(x => `<option ${x === g ? "selected" : ""}>${x}</option>`).join("")}</select></label>
      <label>Rodada<select id="admRodada">${rodadas.map(x => `<option value="${x}" ${x === r ? "selected" : ""}>Rodada ${x}</option>`).join("")}</select></label></div>
    <div style="margin-top:8px">${lista.map(p => { const x = res[p.id]; return `<div class="lance" style="align-items:center"><span>${esc(clubes[p.casa].nome)} <b>${x ? `${x.gols_casa} x ${x.gols_fora}` : "x"}</b> ${esc(clubes[p.fora].nome)}</span>
      <span class="xg">${p.processada ? `<a href="aovivo.html?id=${p.id}" style="color:var(--ac)">ver</a> <button class="sec" data-refaz="${p.id}">Refazer</button> <button class="sec" data-placar="${p.id}">Trocar o placar</button>` : dataHora(p.inicio)}</span></div>`; }).join("") || `<div class="mut">Sem partidas.</div>`}</div>`;
  $("admGrupo").onchange = $("admRodada").onchange = () => partidasAdmin();
  el.onclick = async e => {
    const refaz = e.target.dataset.refaz, placar = e.target.dataset.placar;
    try {
      if (refaz) {
        if (!confirm("Refazer esta partida? O resultado atual é apagado e ela é calculada de novo, com as táticas de agora.")) return;
        await refazerPartida(+refaz); await processar(false); await partidasAdmin();
      } else if (placar) {
        const t = prompt("Novo placar, mandante primeiro (exemplo: 3x0):"); if (t === null) return;
        const m = t.trim().match(/^(\d{1,2})\s*[xX-]\s*(\d{1,2})$/); if (!m) return alert("Placar inválido. Use o formato 3x0.");
        await definirPlacar(+placar, +m[1], +m[2]); await partidasAdmin();
      }
    } catch (err) { alert("Não deu: " + err.message); }
  };
}

// Nome de clube sem dono: prefixo + sobrenome do país, e sigla com as três primeiras letras do sobrenome.
function nomeDeClube(rng, usados, pais = "Brasil") {
  for (;;) {
    const sobrenome = rng.pick(nomes.paises[pais].s), nome = `${rng.pick(pais === "Brasil" ? PREFIXOS : PREFIXOS_DE_FORA)} ${sobrenome}`;
    const sigla = sobrenome.normalize("NFD").replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase();
    if (sigla.length === 3 && !usados.has(nome) && !usados.has(sigla)) { usados.add(nome); usados.add(sigla); return { nome, sigla }; }
  }
}

async function carregar(s) {
  $("quem").textContent = s ? s.user.email : ""; $("sair").hidden = !s;
  clearInterval(relogio);
  if (!s) { $("app").innerHTML = ""; return; }
  try {
    if (!(await ehAdmin())) { $("app").innerHTML = `<div class="card bad">Esta conta não é de administrador.</div>`; return; }
    await tela();
    relogio = setInterval(() => { dirigentes().catch(() => {}); pedidos().catch(() => {}); if ($("auto") && $("auto").checked) processar(true); }, 30000);
  } catch (e) { $("app").innerHTML = `<div class="card bad">Não consegui carregar: ${esc(e.message)}</div>`; }
}

async function tela(aviso = "") {
  const liga = await ligaAtual(), clubes = liga ? await clubesDaLiga(liga.id) : [], partidas = liga ? await partidasDaLiga(liga.id) : [];
  const humanos = clubes.filter(c => c.dono).length, feitas = partidas.filter(p => p.processada).length, auto = $("auto") ? $("auto").checked : true;
  // em ordem de data, com o nome de cada data: rodada da liga, playoff ou fase da copa (rodada 100 + fase)
  const rodadas = [...new Set(partidas.map(p => p.rodada))].map(r => { const l = partidas.filter(p => p.rodada === r); return { r, inicio: l.reduce((m, p) => p.inicio < m ? p.inicio : m, l[0].inicio), feitas: l.filter(p => p.processada).length, total: l.length }; })
    .sort((a, b) => new Date(a.inicio) - new Date(b.inicio) || a.r - b.r);
  const nomeDaData = r => r === 100 ? "Supercopa" : r > 200 ? "Libertadores: " + (FASES_DA_COPA[r - 200] || "").toLowerCase() : r > 100 ? "Copa: " + (FASES_DA_COPA[r - 100] || "fase " + (r - 100)).toLowerCase() : r === 19 ? "Playoff: semifinais" : r === 20 ? "Playoff: final" : r === 21 ? "Final do acesso" : "Rodada " + r;
  const proxima = (rodadas.find(x => x.feitas < x.total) || {}).r;
  const daqui = new Date(Date.now() + 5 * 60000 - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  $("app").innerHTML = `<div class="card"><h2>Liga</h2>${liga
    ? `<div>${esc(liga.nome)} · temporada ${liga.temporada} · ${clubes.length} clubes, ${humanos} com dirigente e ${clubes.length - humanos} do bot.</div>
       ${liga.pausada ? `<div class="aviso" style="margin-top:6px">Liga pausada desde ${dataHora(liga.pausada_em)}: nenhuma partida é calculada. Ao retomar, as partidas que faltam são adiadas pelo tempo da pausa.</div>` : ""}
       <div class="row" style="margin-top:10px"><button id="pausar">${liga.pausada ? "Retomar a liga" : "Pausar a liga"}</button><button class="sec" id="contratos">Definir salários e contratos iniciais</button><button class="sec" id="backupServidor">Fazer backup no servidor agora</button><button class="sec" id="baixarCopia">Baixar uma cópia para este computador</button><button class="sec" id="apagar">Apagar a liga e todos os clubes</button></div>`
    : `<div class="mut" style="margin-bottom:10px">Nenhuma liga criada. A criação gera ${GRUPOS.length * POR_GRUPO} clubes sem dono, em ${GRUPOS.length} grupos de ${POR_GRUPO}, cada um com 22 jogadores de mesmo nível. Leva cerca de um minuto.</div>
       <div class="row"><label style="flex:1;min-width:180px">Nome da liga<input id="nomeLiga" value="Liga de testes"></label><button id="criar">Criar a liga</button></div>`}
    <div id="progresso" class="mut" style="margin-top:8px">${esc(aviso)}</div></div>
    ${liga ? `<div class="card" id="pedidos"></div><div class="card" id="dirigentes"></div>` : ""}
    ${liga ? `<div class="card"><h2>Calendário e rodadas</h2>${partidas.length
      ? `<div>${partidas.length} partidas em ${rodadas.length} datas · ${feitas} já calculadas · ${liga.minutos_transmissao ? `transmissão de ${liga.minutos_transmissao} min` : "relatório instantâneo"} · tática fecha ${liga.prazo_escalacao_seg} s antes do apito.</div>
         <div class="row" style="margin-top:10px">${proxima ? `<button id="antecipar">Jogar agora: ${nomeDaData(proxima).toLowerCase()}</button>` : ""}<button class="sec" id="processar">Calcular as partidas que já deveriam ter começado</button><label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="auto" ${auto ? "checked" : ""}> conferir a cada 30 segundos enquanto esta página estiver aberta</label><button class="sec" id="apagarCal">Apagar o calendário e os resultados</button></div>
         <div class="rolagem" style="margin-top:10px"><table><tr><th>Data</th><th>Início</th><th>Calculadas</th></tr>${rodadas.map(x => `<tr><td>${nomeDaData(x.r)}</td><td>${dataHora(x.inicio)}</td><td class="${x.feitas === x.total ? "ok" : new Date(x.inicio) <= new Date() ? "bad" : "mut"}">${x.feitas} de ${x.total}</td></tr>`).join("")}</table></div>`
      : `<div class="mut" style="margin-bottom:10px">Sem calendário. Cada grupo joga turno e returno: 18 rodadas, 5 partidas por grupo em cada uma.</div>
         <div class="row"><label>Primeira rodada<input type="datetime-local" id="inicio" value="${daqui}"></label><label>Intervalo entre as datas (minutos)<input type="number" id="intervalo" value="1440" min="1" style="width:110px"></label>
         <label>Duração da transmissão (minutos; 0 = relatório instantâneo)<input type="number" id="duracao" value="105" min="0" style="width:110px"></label><label>Tática fecha antes do apito (segundos)<input type="number" id="prazo" value="1" min="0" style="width:110px"></label><label style="flex-direction:row;align-items:center;gap:6px" title="Uma data de copa depois das rodadas 2, 5, 8, 11, 14 e 17 da liga; precisa do SQL 47"><input type="checkbox" id="comCopa" checked> Com a Copa do Brasil</label><button id="gerar">Gerar o calendário</button></div>
         <div class="mut" style="margin-top:6px">Duração 105 = transmissão ao vivo em tempo real (lances minuto a minuto, relatório só no apito final). Um número menor acelera o jogo (15 = partida inteira em 15 minutos); 0 mostra o resultado e o relatório na hora, sem transmissão. A tática fechando 1 segundo antes é valor de teste; na liga de verdade serão 900 segundos. Com o botão de jogar a rodada agora, não é preciso esperar o intervalo.</div>`}</div>` : ""}

    const cPor = Object.fromEntries(clubes.map(c => [c.id, c])), tPor = Object.fromEntries(taticas.map(t => [t.clube_id, t.dados])), elencos = {};
    for (let i = 0; i < ids.length; i += 10) await Promise.all(ids.slice(i, i + 10).map(async id => { elencos[id] = await elencoDoClube(id); }));
    let n = 0;
    for (const p of pendentes) {
      const lado = id => ({ clube: cPor[id], elenco: elencos[id], tatica: tPor[id] || null });
      const { lances, resultado, situacao } = calcularPartida({ partida: p, casa: lado(p.casa), fora: lado(p.fora), minutosTransmissao: liga.minutos_transmissao, semente: Math.floor(Math.random() * 2147483647) });
      await gravarPartida(p.id, lances, resultado);
      await gravarSituacao(situacao); aplicarSituacao(elencos[p.casa], situacao); aplicarSituacao(elencos[p.fora], situacao);
      await lancarRodada(p.id);
      diz(`Calculando: ${++n} de ${pendentes.length}…`);
    }
    ocupado = false; await tela(`Neste navegador (o servidor não respondeu): ${n} ${n === 1 ? "partida calculada" : "partidas calculadas"} às ${new Date().toLocaleTimeString("pt-BR")}.${avisoCopa}`);
  } catch (e) { diz("Erro ao calcular: " + e.message); }
  finally { ocupado = false; }
}

async function criar() {
  $("criar").disabled = true;
  const rng = criarRng(Date.now() % 2147483647), usados = new Set(), perfis = Object.keys(PERFIS);
  try {
    const liga = await criarLiga($("nomeLiga").value.trim() || "Liga");
    let n = 0;
    for (const grupo of GRUPOS) for (let k = 0; k < POR_GRUPO; k++) {
      const { nome, sigla } = nomeDeClube(rng, usados), perfil = rng.pick(perfis), v = visualAleatorio(rng);
      await criarClubeComElenco(liga.id, { grupo, nome, sigla, perfil, escudo: v.escudo, uniforme: v.uniforme }, gerarElenco(rng, { nivel: NIVEL, perfil, nomes }));
      $("progresso").textContent = `Criando clubes: ${++n} de ${GRUPOS.length * POR_GRUPO}…`;
    }
    await tela("Liga criada.");
  } catch (e) { await tela("Erro ao criar a liga: " + e.message + " (se ficou pela metade, apague a liga e crie de novo)"); }
}

$("sair").onclick = () => sair();
await montarLogin($("login"), carregar);
</script>
