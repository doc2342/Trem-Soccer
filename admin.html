<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trem Soccer · Administração</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<main>
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h1 style="margin:0">Administração</h1><a href="jogo.html" style="color:var(--ac)">Ir para o jogo</a><span class="mut" id="quem" style="margin-left:auto"></span><button class="sec" id="sair" hidden>Sair</button></div>
  <div class="card" id="login"></div>
  <div id="app"></div>
</main>

<script type="module">
import { criarRng } from "./src/rng.js";
import { gerarElenco, PERFIS } from "./src/gerador.js";
import { gerarTabela, calcularPartida } from "./src/rodada.js";
import { sair, ehAdmin, ligaAtual, clubesDaLiga, criarLiga, criarClubeComElenco, apagarLiga, atualizarLiga, partidasDaLiga, criarPartidas, apagarPartidas,
  partidasPendentes, taticasDe, clubesPorIds, elencoDoClube, gravarPartida } from "./src/banco.js";
import { montarLogin } from "./src/ui-login.js";
import { svgEscudo, visualAleatorio } from "./src/escudo.js";

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nomes = await (await fetch("./dados/nomes.json")).json();
const GRUPOS = ["A", "B", "C", "D", "E"], POR_GRUPO = 10, NIVEL = 30;
const PREFIXOS = ["Atlético", "Esporte Clube", "União", "Sport", "Grêmio", "Real", "Operário", "Náutico", "Associação", "Sociedade Esportiva", "Clube", "Independente"];
const dataHora = d => new Date(d).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
let relogio = null, ocupado = false;

// Nome de clube sem dono: prefixo + sobrenome brasileiro, e sigla com as três primeiras letras do sobrenome.
function nomeDeClube(rng, usados) {
  for (;;) {
    const sobrenome = rng.pick(nomes.paises.Brasil.s), nome = `${rng.pick(PREFIXOS)} ${sobrenome}`;
    const sigla = sobrenome.normalize("NFD").replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase();
    if (sigla.length === 3 && !usados.has(nome) && !usados.has(sigla)) { usados.add(nome); usados.add(sigla); return { nome, sigla }; }
  }
}

async function carregar(s) {
  $("quem").textContent = s ? s.user.email : ""; $("sair").hidden = !s;
  clearInterval(relogio);
  if (!s) { $("app").innerHTML = ""; return; }
  try {
    if (!(await ehAdmin())) { $("app").innerHTML = `<div class="card bad">Esta conta não é de administrador.</div>`; return; }
    await tela();
    relogio = setInterval(() => { if ($("auto") && $("auto").checked) processar(true); }, 30000);
  } catch (e) { $("app").innerHTML = `<div class="card bad">Não consegui carregar: ${esc(e.message)}</div>`; }
}

async function tela(aviso = "") {
  const liga = await ligaAtual(), clubes = liga ? await clubesDaLiga(liga.id) : [], partidas = liga ? await partidasDaLiga(liga.id) : [];
  const humanos = clubes.filter(c => c.dono).length, feitas = partidas.filter(p => p.processada).length, auto = $("auto") ? $("auto").checked : true;
  const rodadas = [...new Set(partidas.map(p => p.rodada))].map(r => { const l = partidas.filter(p => p.rodada === r); return { r, inicio: l[0].inicio, feitas: l.filter(p => p.processada).length, total: l.length }; });
  const daqui = new Date(Date.now() + 5 * 60000 - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  $("app").innerHTML = `<div class="card"><h2>Liga</h2>${liga
    ? `<div>${esc(liga.nome)} · temporada ${liga.temporada} · ${clubes.length} clubes, ${humanos} com dirigente e ${clubes.length - humanos} do bot.</div>
       <div class="row" style="margin-top:10px"><button class="sec" id="apagar">Apagar a liga e todos os clubes</button></div>`
    : `<div class="mut" style="margin-bottom:10px">Nenhuma liga criada. A criação gera ${GRUPOS.length * POR_GRUPO} clubes sem dono, em ${GRUPOS.length} grupos de ${POR_GRUPO}, cada um com 22 jogadores de mesmo nível. Leva cerca de um minuto.</div>
       <div class="row"><label style="flex:1;min-width:180px">Nome da liga<input id="nomeLiga" value="Liga de testes"></label><button id="criar">Criar a liga</button></div>`}
    <div id="progresso" class="mut" style="margin-top:8px">${esc(aviso)}</div></div>
    ${liga ? `<div class="card"><h2>Calendário e rodadas</h2>${partidas.length
      ? `<div>${partidas.length} partidas em ${rodadas.length} rodadas · ${feitas} já calculadas · transmissão de ${liga.minutos_transmissao} min · tática fecha ${liga.prazo_escalacao_min} min antes.</div>
         <div class="row" style="margin-top:10px"><button id="processar">Calcular as partidas que já deveriam ter começado</button><label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="auto" ${auto ? "checked" : ""}> calcular sozinho enquanto esta página estiver aberta</label><button class="sec" id="apagarCal">Apagar o calendário e os resultados</button></div>
         <div class="rolagem" style="margin-top:10px"><table><tr><th>Rodada</th><th>Início</th><th>Calculadas</th></tr>${rodadas.map(x => `<tr><td>${x.r}</td><td>${dataHora(x.inicio)}</td><td class="${x.feitas === x.total ? "ok" : new Date(x.inicio) <= new Date() ? "bad" : "mut"}">${x.feitas} de ${x.total}</td></tr>`).join("")}</table></div>`
      : `<div class="mut" style="margin-bottom:10px">Sem calendário. Cada grupo joga turno e returno: 18 rodadas, 5 partidas por grupo em cada uma.</div>
         <div class="row"><label>Primeira rodada<input type="datetime-local" id="inicio" value="${daqui}"></label><label>Intervalo entre rodadas (minutos)<input type="number" id="intervalo" value="1440" min="1" style="width:110px"></label>
         <label>Duração da transmissão (minutos)<input type="number" id="duracao" value="105" min="1" style="width:110px"></label><label>Tática fecha antes do apito (minutos)<input type="number" id="prazo" value="15" min="0" style="width:110px"></label><button id="gerar">Gerar o calendário</button></div>
         <div class="mut" style="margin-top:6px">Para um teste rápido: intervalo de 12, duração de 10 e prazo de 1.</div>`}</div>` : ""}
    ${GRUPOS.map(g => { const l = clubes.filter(c => c.grupo === g); return l.length ? `<div class="card"><h2>Grupo ${g}</h2>${l.map(c => `<div class="lance" style="align-items:center">${svgEscudo(c.escudo, c.sigla, 28)}<span>${esc(c.nome)}</span><span class="xg">${c.dono ? "dirigente" : "bot"} · ${esc(PERFIS[c.perfil] ? PERFIS[c.perfil].nome : c.perfil)}</span></div>`).join("")}</div>` : ""; }).join("")}`;
  const em = (id, f) => { if ($(id)) $(id).onclick = f; };
  em("criar", criar);
  em("apagar", async () => {
    if (!confirm(`Apagar a liga "${liga.nome}" com todos os clubes e jogadores? Não dá para desfazer.`)) return;
    try { await apagarLiga(liga.id); await tela("Liga apagada."); } catch (e) { await tela("Erro ao apagar: " + e.message); }
  });
  em("gerar", async () => {
    $("gerar").disabled = true;
    try {
      const inicio = new Date($("inicio").value).getTime(), intervalo = +$("intervalo").value * 60000, duracao = +$("duracao").value;
      await atualizarLiga(liga.id, { minutos_transmissao: duracao, prazo_escalacao_min: +$("prazo").value });
      const linhas = [];
      for (const g of GRUPOS) for (const j of gerarTabela(clubes.filter(c => c.grupo === g).map(c => c.id))) {
        const ini = inicio + (j.rodada - 1) * intervalo;
        linhas.push({ liga_id: liga.id, grupo: g, rodada: j.rodada, casa: j.casa, fora: j.fora, inicio: new Date(ini).toISOString(), fim: new Date(ini + duracao * 60000).toISOString() });
      }
      await criarPartidas(linhas); await tela(`Calendário gerado: ${linhas.length} partidas.`);
    } catch (e) { await tela("Erro ao gerar o calendário: " + e.message); }
  });
  em("apagarCal", async () => {
    if (!confirm("Apagar todas as partidas, lances e resultados desta liga? Não dá para desfazer.")) return;
    try { await apagarPartidas(liga.id); await tela("Calendário apagado."); } catch (e) { await tela("Erro ao apagar: " + e.message); }
  });
  em("processar", () => processar(false));
}

// Calcula as partidas cujo horário já chegou. As táticas dos dirigentes valem; clube sem dono ou inativo joga com o bot.
async function processar(silencioso) {
  if (ocupado) return; ocupado = true;
  const diz = t => { if ($("progresso")) $("progresso").textContent = t; };
  try {
    const liga = await ligaAtual(), pendentes = liga ? await partidasPendentes(liga.id) : [];
    if (!pendentes.length) { if (!silencioso) diz("Nenhuma partida esperando cálculo."); return; }
    const ids = [...new Set(pendentes.flatMap(p => [p.casa, p.fora]))];
    const [clubes, taticas] = await Promise.all([clubesPorIds(ids), taticasDe(ids)]);
    const cPor = Object.fromEntries(clubes.map(c => [c.id, c])), tPor = Object.fromEntries(taticas.map(t => [t.clube_id, t.dados])), elencos = {};
    for (let i = 0; i < ids.length; i += 10) await Promise.all(ids.slice(i, i + 10).map(async id => { elencos[id] = await elencoDoClube(id); }));
    let n = 0;
    for (const p of pendentes) {
      const lado = id => ({ clube: cPor[id], elenco: elencos[id], tatica: tPor[id] || null });
      const { lances, resultado } = calcularPartida({ partida: p, casa: lado(p.casa), fora: lado(p.fora), minutosTransmissao: liga.minutos_transmissao, semente: Math.floor(Math.random() * 2147483647) });
      await gravarPartida(p.id, lances, resultado);
      diz(`Calculando: ${++n} de ${pendentes.length}…`);
    }
    ocupado = false; await tela(`${n} ${n === 1 ? "partida calculada" : "partidas calculadas"} às ${new Date().toLocaleTimeString("pt-BR")}.`);
  } catch (e) { diz("Erro ao calcular: " + e.message); }
  finally { ocupado = false; }
}

async function criar() {
  $("criar").disabled = true;
  const rng = criarRng(Date.now() % 2147483647), usados = new Set(), perfis = Object.keys(PERFIS);
  try {
    const liga = await criarLiga($("nomeLiga").value.trim() || "Liga");
    let n = 0;
    for (const grupo of GRUPOS) for (let k = 0; k < POR_GRUPO; k++) {
      const { nome, sigla } = nomeDeClube(rng, usados), perfil = rng.pick(perfis), v = visualAleatorio(rng);
      await criarClubeComElenco(liga.id, { grupo, nome, sigla, perfil, escudo: v.escudo, uniforme: v.uniforme }, gerarElenco(rng, { nivel: NIVEL, perfil, nomes }));
      $("progresso").textContent = `Criando clubes: ${++n} de ${GRUPOS.length * POR_GRUPO}…`;
    }
    await tela("Liga criada.");
  } catch (e) { await tela("Erro ao criar a liga: " + e.message + " (se ficou pela metade, apague a liga e crie de novo)"); }
}

$("sair").onclick = () => sair();
await montarLogin($("login"), carregar);
</script>
</body>
</html>
