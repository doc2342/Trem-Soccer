<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escalação</title>
<link rel="stylesheet" href="estilo.css">
<script src="atualiza.js"></script>
<style>
  /* cabeçalho e abas iguais aos da página do clube (jogo.html): a tática aparece como mais uma aba */
  .topo { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .aba .ai, .aba .at-c { display:none; }
  .aba[data-aba="config"] .ai { display:inline; } .aba[data-aba="config"] .at-l { display:none; }
  #cabecalho .abas { margin-bottom:14px; }
  @media (max-width:620px) {
    .abas { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:2px; }
    .aba { padding:6px 1px 5px; border-radius:8px 8px 0 0; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0; }
    .aba .ai, .aba[data-aba="config"] .ai { display:block; font-size:17px; line-height:1.1; }
    .aba .at-l { display:none; } .aba .at-c { display:block; font-size:10.5px; font-weight:600; white-space:nowrap; }
  }
</style>
</head>
<body>
<main></main>

<script type="module">
import { montarEscalacao } from "./src/ui-escalacao.js";
// com ?online=1 a tela usa o elenco e a tática do clube no banco; sem isso, é o campo de testes com elenco gerado
window.__teste = await montarEscalacao(document.querySelector("main"), { online: new URLSearchParams(location.search).has("online") });
</script>
</body>
</html>
