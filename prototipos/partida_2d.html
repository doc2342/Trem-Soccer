<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partida em 2D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  /* Protótipo (30/10; deslocamento contínuo em 01/11, prototipos/movimento.js): replay em 2D. O motor joga por zonas; aqui cada jogador vai para o mapa do papel dele
     (com a bola quando o time ataca, sem a bola quando defende), quem leva a bola segue a rota gravada no lance, e o marcador vencido vai junto. */
  :root { --fundo: #f4f2ec; --tinta: #16191d; --mudo: #6b6f76; --campo: #2f6b3f; --campo2: #2a6038; --linha: rgba(255,255,255,.55); --casa: #1f4fa8; --fora: #d8312b; --bola: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fundo: #121417; --tinta: #e9e7e1; --mudo: #9aa0a8; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--tinta); font: 15px/1.45 Barlow, system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font: 700 26px/1.1 "Barlow Condensed", sans-serif; letter-spacing: .02em; text-transform: uppercase; margin: 0 0 4px; }
  .mut { color: var(--mudo); font-size: 13px; }
  .controles { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: end; margin: 14px 0; }
  label { display: grid; gap: 3px; font-size: 12px; color: var(--mudo); text-transform: uppercase; letter-spacing: .06em; }
  select, button { font: 600 14px Barlow, sans-serif; padding: 7px 10px; border: 1px solid #c9c5bb; background: #fff; color: #16191d; border-radius: 0; }
  button { background: var(--tinta); color: var(--fundo); border-color: var(--tinta); cursor: pointer; }
  .placar { display: flex; align-items: center; gap: 14px; font: 700 22px "Barlow Condensed", sans-serif; margin: 6px 0 8px; }
  .placar .c { color: var(--casa); } .placar .f { color: var(--fora); } .placar .min { font-size: 15px; color: var(--mudo); font-weight: 600; }
  svg { width: 100%; height: auto; display: block; background: var(--campo); }
  .texto { min-height: 3.2em; margin-top: 10px; font-size: 15px; }
  .lista { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .lista button { background: transparent; color: var(--tinta); border: 1px solid #c9c5bb; font-weight: 500; padding: 4px 8px; font-size: 13px; }
  .lista button.gol { border-color: var(--tinta); font-weight: 700; }
  .lista button.atual { background: var(--tinta); color: var(--fundo); }
</style>
</head>
<body>
<main>
  <h1>Partida em 2D</h1>
  <div class="mut">Protótipo fora do site. O jogo é o da T1, com a grade; os 22 e a bola andam pela trajetória de prototipos/movimento.js, feita uma vez pelo tempo de partida.</div>
  <div class="controles">
    <label>Casa<select id="fCasa"></select></label>
    <label>Laterais da casa<select id="pCasa"><option value="">Padrão</option><option value="apoiador">Apoiador</option><option value="construtor">Construtor</option><option value="invertido">Invertido</option></select></label>
    <label>Fora<select id="fFora"></select></label>
    <label>Semente<select id="semente"></select></label>
    <button id="jogar">Jogar</button>
    <button id="pausa" type="button">Pausar</button>
    <label>Ver o que cada um faz<input id="ver" type="checkbox"></label>
    <label>Depuração<input id="dep" type="checkbox"></label>
    <label>Velocidade<select id="vel"><option value="1">1×</option><option value="4" selected>4×</option><option value="16">16×</option><option value="60">60×</option></select></label>
  </div>
  <div class="placar"><span class="c" id="nCasa">Casa</span><span id="gols">0 × 0</span><span class="f" id="nFora">Fora</span><span class="min" id="min"></span></div>
  <svg id="campo" viewBox="-3 -3 111 74" role="img" aria-label="Campo com os jogadores"></svg>
  <input id="tempo" type="range" min="0" max="1" step="1" value="0" aria-label="Tempo da partida" style="width:100%">
  <div class="texto" id="texto"></div>
  <pre id="painel" hidden style="font-size:12px;overflow-x:auto;line-height:1.35"></pre>
  <div class="lista" id="lista"></div>
</main>
<script type="module">
import { criarRng } from "../src/rng.js";
import { gerarOnze } from "../src/gerador.js";
import { FORMACOES } from "../src/escalacao.js";
import { prepararTime, simularPartida } from "../src/motor.js";
import { gerarTrajetorias, posicaoEm } from "./movimento.js";

const $ = id => document.getElementById(id);
const nomes = await fetch("../dados/nomes.json").then(r => r.json());
for (const s of ["fCasa", "fFora"]) $(s).innerHTML = Object.keys(FORMACOES).map(f => `<option>${f}</option>`).join("");
$("fFora").value = "4-4-2"; $("fCasa").value = "4-2-3-1";
$("semente").innerHTML = Array.from({ length: 20 }, (_, k) => `<option>${k + 1}</option>`).join("");

let tr = null, els = [], lances = [], t = 0, pausado = false, antes = 0, nomes2 = [];
function montar() {
  const s = +$("semente").value, papel = $("pCasa").value, opc = { nivel: 30, nomes, novos: true };
  const casa = gerarOnze(criarRng(100 + s), FORMACOES[$("fCasa").value], { ...opc, prefixoId: "c" }).map(x => papel && ["DR", "DL", "WBR", "WBL"].includes(x.pos) ? { ...x, papel } : x);
  const fora = gerarOnze(criarRng(900 + s), FORMACOES[$("fFora").value], { ...opc, prefixoId: "f" }), registro = [];
  const p = simularPartida(criarRng(s), prepararTime({ nome: "Casa", escalacao: casa }), prepararTime({ nome: "Fora", escalacao: fora }), { regrasT1: true, registro });
  tr = gerarTrajetorias(p, registro, Object.fromEntries([...casa, ...fora].map(x => [x.j.id, x.j.at])));
  const numero = {}; [...casa, ...fora].forEach((x, k) => { numero[x.j.id] = (k % 11) + 1; });
  desenhar(tr.ids.slice(0, tr.n).map(id => ({ id, ...p.jogadores[id], num: numero[id] || "" })));
  els = tr.ids.map((id, k) => $(k < tr.n ? "j" + k : "bola")); nomes2 = tr.ids.slice(0, tr.n).map(id => p.jogadores[id].nome.split(" ").slice(-1)[0]);
  lances = tr.lances; $("tempo").max = Math.floor(tr.duracao);
  $("lista").innerHTML = lances.map((x, k) => `<button data-k="${k}" class="${x.l.resultado === "gol" ? "gol" : ""}">${x.l.min}' ${x.l.time === 0 ? "Casa" : "Fora"}${x.l.resultado === "gol" ? " · gol" : ""}</button>`).join("");
  t = 0; quadro();
}
function desenhar(js) {
  const L = 'stroke="var(--linha)" stroke-width=".35" fill="none"';
  const faixas = Array.from({ length: 10 }, (_, k) => k % 2 ? "" : `<rect x="${k * 10.5}" y="0" width="10.5" height="68" fill="var(--campo2)"/>`).join("");
  $("campo").innerHTML = `${faixas}<rect x="0" y="0" width="105" height="68" ${L}/><line x1="52.5" y1="0" x2="52.5" y2="68" ${L}/><circle cx="52.5" cy="34" r="9.15" ${L}/>
    <rect x="0" y="13.84" width="16.5" height="40.32" ${L}/><rect x="88.5" y="13.84" width="16.5" height="40.32" ${L}/><rect x="0" y="24.84" width="5.5" height="18.32" ${L}/><rect x="99.5" y="24.84" width="5.5" height="18.32" ${L}/>
    <rect x="-1.5" y="30.34" width="1.5" height="7.32" fill="none" stroke="#fff" stroke-width=".4"/><rect x="105" y="30.34" width="1.5" height="7.32" fill="none" stroke="#fff" stroke-width=".4"/>
    ${js.map((x, k) => `<g class="jog" id="j${k}"><circle r="1.9" fill="${x.time === 0 ? "var(--casa)" : "var(--fora)"}" stroke="#fff" stroke-width=".35"/><text y=".75" text-anchor="middle" font-size="2.1" font-weight="700" fill="#fff" font-family="Barlow Condensed">${x.num}</text><text class="nome" y="4.4" text-anchor="middle" font-size="1.7" fill="#fff" opacity=".85" font-family="Barlow">${x.nome.split(" ").slice(-1)[0]}</text></g>`).join("")}
    <g id="depura"></g><g class="bola" id="bola"><circle r=".9" fill="var(--bola)" stroke="#111" stroke-width=".2"/></g>`;
}
// a tela só lê o tempo: pausar é parar t, acelerar é somar mais, voltar é escolher outro t
function quadro() {
  const ver = $("ver").checked;
  for (let k = 0; k <= tr.n; k++) { const q = posicaoEm(tr, k, t); els[k].setAttribute("transform", `translate(${q.x.toFixed(2)} ${q.y.toFixed(2)})`); els[k].style.display = q.ativo ? "" : "none"; if (k < tr.n) { const n = els[k].querySelector(".nome"), texto = ver ? q.comportamento : nomes2[k]; if (n.textContent !== texto) n.textContent = texto; } }
  rotulos();
  depurar();
  $("min").textContent = Math.floor(t / 60) + "'"; $("tempo").value = Math.floor(t);
  const ja = lances.filter(x => x.t <= t), g = ja.filter(x => x.l.resultado === "gol");
  $("gols").textContent = `${g.filter(x => x.l.time === 0).length} × ${g.filter(x => x.l.time === 1).length}`;
  const u = ja[ja.length - 1]; $("texto").textContent = u ? (u.l.texto || "").replace(/\{\d:([^}]+)\}/g, "$1") : "";
  document.querySelectorAll(".lista button").forEach(b => b.classList.toggle("atual", +b.dataset.k === ja.length - 1));
}
// os rótulos desviam uns dos outros; o círculo fica na posição real. Só desenho: a coordenada do jogador não muda
const LUGARES = [[0, 4.4], [0, -2.9], [6, 0.6], [-6, 0.6]];
function rotulos() {
  const caixas = [];
  for (let k = 0; k < tr.n; k++) {
    const q = posicaoEm(tr, k, t); if (!q.ativo) continue;
    const n = els[k].querySelector(".nome"), m = (n.textContent.length * 0.45 + 0.5), ordem = [n.lugar || 0, 0, 1, 2, 3];
    const livre = i => { const x = q.x + LUGARES[i][0], y = q.y + LUGARES[i][1] - 0.6; return !caixas.some(c => Math.abs(c.x - x) < c.m + m && Math.abs(c.y - y) < 1.9); };
    const l = ordem.find(livre) ?? ordem[0]; n.lugar = l; n.setAttribute("x", LUGARES[l][0]); n.setAttribute("y", LUGARES[l][1]);
    caixas.push({ x: q.x + LUGARES[l][0], y: q.y + LUGARES[l][1] - 0.6, m });
  }
}
// modo de depuração: referência (anel), destino (traço), zona (círculo fino), quem pressiona e cobre, e a tabela. Só lê o que foi gravado
function depurar() {
  const dep = $("dep").checked, g = $("depura"), P = $("painel"); P.hidden = !dep;
  if (!dep) { if (g.innerHTML) g.innerHTML = ""; return; }
  const s = Math.round(t / tr.amostra), bola = posicaoEm(tr, tr.n, t), l = []; let svg = "";
  for (let k = 0; k < tr.n; k++) {
    const q = posicaoEm(tr, k, t); if (!q.ativo) continue;
    const i = (s * tr.n + k) * 4, ax = tr.alvos[i], ay = tr.alvos[i + 1], rx = tr.alvos[i + 2], ry = tr.alvos[i + 3], c = q.comportamento === "pressionar" ? "#ff4040" : q.comportamento === "cobertura" ? "#ffd23f" : q.comportamento === "cobrirEspaco" ? "#6fe3ff" : "rgba(255,255,255,.45)";
    svg += `<circle cx="${rx}" cy="${ry}" r="9" fill="none" stroke="rgba(255,255,255,.12)" stroke-width=".15"/><circle cx="${rx}" cy="${ry}" r=".9" fill="none" stroke="${c}" stroke-width=".25"/><line x1="${q.x}" y1="${q.y}" x2="${ax}" y2="${ay}" stroke="${c}" stroke-width=".25" stroke-dasharray=".8 .6"/>`;
    let viz = 99; for (let m = 0; m < tr.n; m++) if (m !== k && tr.idTime[m] === tr.idTime[k]) { const o = posicaoEm(tr, m, t); if (o.ativo) viz = Math.min(viz, Math.hypot(q.x - o.x, q.y - o.y)); }
    l.push(`${tr.idTime[k] ? "F" : "C"} ${nomes2[k].padEnd(12)} ${tr.pos[k].padEnd(4)} ${q.comportamento.padEnd(18)} bola ${Math.hypot(q.x - bola.x, q.y - bola.y).toFixed(0).padStart(3)} m  colega ${viz.toFixed(0).padStart(3)} m  referência ${Math.hypot(q.x - rx, q.y - ry).toFixed(0).padStart(3)} m  ${q.v.toFixed(1)} m/s`);
  }
  g.innerHTML = svg; P.textContent = l.join("\n");
}
function rodar(agora) {
  const dt = Math.min(0.1, (agora - antes) / 1000); antes = agora;
  if (tr && !pausado && t < tr.duracao) { t = Math.min(tr.duracao, t + dt * +$("vel").value); quadro(); }
  requestAnimationFrame(rodar);
}
$("lista").onclick = e => { const b = e.target.closest("[data-k]"); if (b) { t = Math.max(0, lances[+b.dataset.k].t - 12); quadro(); } };
$("tempo").oninput = e => { t = +e.target.value; quadro(); };
$("jogar").onclick = montar;
$("ver").onchange = () => { if (tr) quadro(); };
$("dep").onchange = () => { if (tr) quadro(); };
$("pausa").onclick = () => { pausado = !pausado; $("pausa").textContent = pausado ? "Continuar" : "Pausar"; };
const busca = new URLSearchParams(location.search), teste = busca.get("t"); // ?t=segundos: abre parado ali; ?dep=1: com a depuração
$("dep").checked = busca.has("dep");
montar();
if (teste) { pausado = true; t = +teste; quadro(); }
requestAnimationFrame(rodar);
</script>
</body>
</html>
