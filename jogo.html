<body>
<main>
  <div class="topo"><h1 style="margin:0">Trem Soccer</h1><span class="relogio" title="Hora deste aparelho"></span><span class="mut" id="quem" style="margin-left:auto"></span><button class="sec" id="sair" hidden>Sair</button></div>
  <div class="card" id="login"></div>
  <div id="app"></div>
  <!-- aba Tática: fica fora de #app para não ser desmontada quando a tela do clube é redesenhada -->

</main>

<script type="module">
import { criarRng } from "./src/rng.js";
import { ATRIBUTOS, POSICOES, LISTA_POSICOES, PESOS, notaNaPosicao, notaBruta, NOME_DO_PE, peNaPosicao } from "./src/modelo.js";
import { experienciaDe, nivelDoAnalista, FUNCOES_DE_SAUDE, saudeDoClube, reducaoDeLesao, reducaoDoMedico, atendidosPeloMedico, ganhoDeForma, atendidosNaForma, corteDoPsicologo } from "./src/saude.js";
import { CONFIG_BASE, faixaDeJovens } from "./src/base.js";
import { AREA_DO_ATRIBUTO } from "./src/treino.js";
import { FOCOS, CONFIG_TREINO, AREAS, focoAutomatico, focoDoJogador, pontosDaSessao, partilha, treinavel, qualidadeDoTreino, multDoAtributo } from "./src/treino.js";
import { PREMIOS as PREMIOS_DA_LIGA } from "./src/virada.js";
import { sair, ligaAtual, resumoDoFundo, divisoesDaLiga, cotacaoDoAgente, periodoDePreAcordo, meusPreContratos, proporPreContrato, venderPeloAgente, relatorioDoElenco, meusRelatorios, comprarRelatorio, dispensarJogador, fazerPeneira, rodadasCompletas, definirTreino, treinadoresDoClube, candidatosATreinador, contratarTreinador, dispensarTreinador, designarTreinador, clubesDaLiga, meuClube, pedirClube, meuPedido, registrarAcesso, elencoDoClube, partidasDoGrupo, resultadosDe, minhaTatica, ehAdmin, ajustarContrato, nomeDoGrupo, valoresDaDivisao, historicoDoGrupo, definirCarne, venderAoBanco, anteciparPremio, janelaDoMercado, jogadoresDoMercado, transferenciasDaLiga, protegerJogador, comprarPelaMulta, definirDirigente, clubePorId, jogadoresDoClube, minhasPropostas, listarJogador, taxaDaVenda, fazerProposta, responderProposta, decidirContraproposta, resolverLeiloes, livresDaLiga, lancesDosLivres, ofertasDaLiga, darLanceLivre, oferecerALiga, comprarOfertaDaLiga, extratoDoClube, caixaDoClube, obraAtiva, iniciarObra, partidasDaCopa, resultadosDaCopa, partidasDoClube, finalistasDaCopa, trofeusDaLiga, editarVisual, enviarEscudo, tirarEscudoEnviado, pedirTrocaDeEscudo, FASES_DA_COPA, PREMIOS_DA_COPA } from "./src/banco.js";
import { classificacao, taticaDoDirigente } from "./src/rodada.js";
import { salarioDeMercado, clausula, dinheiro, MAXIMO_INDIVIDUAL, PREMIO_MINIMO, LIMITE_DA_DIVIDA, RODADAS_DE_PRAZO, valorNoBanco, valorNoAgente, VENDAS_PELO_AGENTE, faixaDaNegociacao, minimoPelaDuracao } from "./src/economia.js";
// Contrato mais longo pede mais: ao trocar a duração, o salário mínimo do campo ao lado sobe (salário de mercado + 10% por temporada extra).
// Os formulários são desenhados em vários momentos; um observador acerta o campo sempre que um deles aparece.
function acertarSalarioPelaDuracao() {
  document.querySelectorAll("select[data-prog]").forEach(sel => {
    const campo = document.getElementById(sel.dataset.prog); if (!campo) return;
    if (campo.dataset.base == null) campo.dataset.base = campo.min || "0";
    const minimo = Math.max(+campo.dataset.base, minimoPelaDuracao(+sel.dataset.mercado, +sel.value));
    if (+campo.min !== minimo) campo.min = minimo;
    if (sel.dataset.visto !== sel.value) { sel.dataset.visto = sel.value; if (+campo.value < minimo) campo.value = minimo; }
  });
}
document.addEventListener("change", e => { if (e.target && e.target.matches && e.target.matches("select[data-prog]")) acertarSalarioPelaDuracao(); });
new MutationObserver(acertarSalarioPelaDuracao).observe(document.documentElement, { childList: true, subtree: true });
import { prepararTime, simularPartida } from "./src/motor.js";
import { taticaBot, ESTILO_DO_PERFIL } from "./src/bot.js";
import { montarRelatorio } from "./src/relatorio.js";
import { htmlRelatorio } from "./src/ui-relatorio.js";
import { montarLogin } from "./src/ui-login.js";
import { sg, pp, formatoDasSiglas, definirSiglas, SIGLAS_PT } from "./src/siglas.js";
import { svgEscudo, svgUniforme, visualAleatorio } from "./src/escudo.js";
import { editorVisual, reduzirImagem } from "./src/ui-visual.js";

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f1 = v => v.toFixed(1).replace(".", ",");
const corAtr = v => "a" + (v < 10 ? 0 : v < 20 ? 1 : v < 30 ? 2 : v < 40 ? 3 : 4);
let usuario = null, versao = 0;
// O que sobrevive quando a tela é redesenhada depois de uma ação (lance, proposta, compra): recado a mostrar, filtros da busca do mercado e clube aberto.
let recado = "", verClube = null, carregadoEm = 0;
// Aba Tática: a tela de escalação é montada uma vez em #taticaFora e só é refeita quando os dados do clube mudaram e não há alteração sem salvar.
let telaTatica = null, taticaVelha = true, taticaDe = null, montandoTatica = false;
async function mostrarTatica(sim) {
  const fora = $("taticaFora");
  fora.hidden = !sim || !usuario;
  if (fora.hidden) { document.body.classList.remove("escolhendo"); return; }
  if (montandoTatica || (telaTatica && taticaDe === usuario.id && (!taticaVelha || telaTatica.sujo()))) return;
  taticaVelha = false; taticaDe = usuario.id; telaTatica = null; montandoTatica = true;
  fora.innerHTML = `<div class="card mut">Carregando a tática…</div>`;
  try { const { montarEscalacao } = await import("./src/ui-escalacao.js"); const eu = usuario; const t = await montarEscalacao(fora, { online: true, sessao: { user: eu }, cabecalho: false }); if (usuario && usuario.id === eu.id) telaTatica = t; }
  catch (e) { fora.innerHTML = `<div class="card bad">Não consegui abrir a tática: ${esc(e.message)}</div>`; taticaVelha = true; }
  montandoTatica = false;
}
const filtrosDoMercado = {};
const IDS_DOS_FILTROS = ["mGrupo", "mIdadeMin", "mIdade", "mNota", "mMulta", "mNome", "mSoMulta", "mSoVenda"];

async function carregar(s) {
  const minha = ++versao; // evita desenhar duas vezes quando a sessão muda rápido
  usuario = s ? s.user : null;
  $("quem").textContent = usuario ? usuario.email : "";
  $("sair").hidden = !usuario;
  if (!usuario) { $("app").innerHTML = ""; $("taticaFora").hidden = true; $("taticaFora").innerHTML = ""; telaTatica = null; return; }
  taticaVelha = true; // os dados do clube vão ser lidos de novo: a tática é refeita na próxima vez que a aba abrir, se não houver mudança sem salvar
  const redesenho = !!$("abas"), rolagem = scrollY; // a tela do clube já está aberta: troca o conteúdo sem piscar e fica onde estava
  if (!redesenho) $("app").innerHTML = `<div class="card mut">Carregando…</div>`;
  try {
    const [liga, clube] = await Promise.all([ligaAtual(), meuClube(usuario.id)]);
    if (minha !== versao) return;
    if (!liga) { $("app").innerHTML = `<div class="card">Ainda não há liga aberta. Avise o administrador.</div>`; return; }
    if (clube) { registrarAcesso().catch(() => {}); Object.assign(liga, await valoresDaDivisao(liga.id, clube.divisao) || {});
      // paraquedas: na temporada seguinte ao rebaixamento, teto da divisão de cima e metade da diferença de TV
      if (clube.paraquedas != null && clube.paraquedas === liga.temporada && clube.divisao > 1) { const acima = await valoresDaDivisao(liga.id, clube.divisao - 1); if (acima) { liga.teto_folha = acima.teto_folha; liga.receita_tv += Math.round((acima.receita_tv - liga.receita_tv) / 2); liga.paraquedas = true; } } await telaClube(liga, clube); carregadoEm = Date.now(); if (redesenho) scrollTo(0, rolagem); return; }
    const pedido = await meuPedido(usuario.id);
    if (minha !== versao) return;
    if (pedido && pedido.estado === "pendente") telaEspera(pedido);
    else await telaCriar(liga, pedido && pedido.estado === "recusado" ? pedido : null);
  } catch (e) { $("app").innerHTML = `<div class="card bad">Não consegui carregar: ${esc(e.message)}</div>`; }
}

// Atualização discreta dos dados (resultados, leilões, propostas): não mexe na tela se o dirigente está com um painel aberto ou digitando.
function talvezAtualizar(idade) {
  if (document.hidden || !usuario || !$("abas") || Date.now() - carregadoEm < idade) return;
  const foco = document.activeElement;
  if (foco && /INPUT|SELECT|TEXTAREA/.test(foco.tagName)) return;
  if (!$("taticaFora").hidden) return; // escalando: não mexe na tela
  if ($("cfgSalvarVisual") && !$("cfgSalvarVisual").disabled) return; // escudo ou uniforme mudado sem salvar
  if (document.querySelector('#app [id$="Painel"]:not(:empty)') || ($("quadroAtr") && !$("quadroAtr").hidden)) return;
  carregar({ user: usuario });
}
document.addEventListener("visibilitychange", () => talvezAtualizar(60000));
setInterval(() => talvezAtualizar(180000), 30000);

// ---------- pedido esperando aprovação ----------
function telaEspera(p) {
  $("app").onclick = $("app").onchange = null;
  $("app").innerHTML = `<div class="card"><h2>Pedido enviado</h2>
    <div class="previa" style="margin-bottom:10px">${svgEscudo(p.escudo, p.sigla, 110)}${svgUniforme(p.uniforme, 90)}</div>
    <div><b>${esc(p.nome)}</b> (${esc(p.sigla)}) está esperando a aprovação do administrador da liga. Assim que ele aprovar, o seu clube aparece aqui, já com 22 jogadores.</div>
    <div class="row" style="margin-top:10px"><button id="verDeNovo">Ver se já foi aprovado</button><span class="mut">Esta página também confere sozinha a cada minuto.</span></div></div>`;
  $("verDeNovo").onclick = () => carregar({ user: usuario });
  const v = versao; setTimeout(() => { if (v === versao) carregar({ user: usuario }); }, 60000);
}

// ---------- criar o clube ----------
async function telaCriar(liga, recusado) {
  const clubes = await clubesDaLiga(liga.id), vagas = clubes.filter(c => !c.dono).length;
  const v = visualAleatorio(criarRng(Date.now() % 1e9)), F = { nome: "", sigla: "", escudo: v.escudo, uniforme: v.uniforme };
  const desenhar = (aviso = "") => {
    $("app").innerHTML = `<div class="card"><h2>Criar o seu clube</h2>
      <div class="mut" style="margin-bottom:10px">${esc(liga.nome)} · ${vagas} ${vagas === 1 ? "vaga livre" : "vagas livres"} de ${clubes.length}. Você escolhe nome, sigla e cores; quando o administrador aprovar o pedido, você assume um dos clubes sem dono, já com 22 jogadores.</div>
      ${recusado ? `<div class="aviso" style="margin-bottom:10px">O pedido anterior (${esc(recusado.nome)}) foi recusado${recusado.motivo ? `: ${esc(recusado.motivo)}` : "."} Você pode enviar outro.</div>` : ""}
      ${vagas ? `<div class="duas"><div>
        <div class="row"><label style="flex:1;min-width:160px">Nome do clube<input id="cNome" maxlength="30" value="${esc(F.nome)}"></label><label>Sigla (3 letras)<input id="cSigla" maxlength="3" style="width:90px;text-transform:uppercase" value="${esc(F.sigla)}"></label></div>
        <div class="mut" style="margin-top:8px;font-size:12.5px">Depois que o clube for aprovado, dá para mudar tudo nas Configurações e também enviar uma imagem própria para o escudo.</div>
      </div><div><div id="cVisual"></div>
        <button id="cCriar" style="margin-top:12px;width:100%">Enviar o pedido</button>${aviso ? `<div class="bad" style="margin-top:8px">${esc(aviso)}</div>` : ""}</div></div>` : `<div class="bad">Todas as vagas estão ocupadas.</div>`}</div>`;
    if (!vagas) return;
    $("cNome").oninput = e => { F.nome = e.target.value; };
    const ed = editorVisual($("cVisual"), F, { sigla: () => F.sigla });
    $("cSigla").oninput = e => { F.sigla = e.target.value.toUpperCase(); ed.atualizarPrevia(); };
    $("cCriar").onclick = async () => {
      $("cCriar").disabled = true; $("cCriar").textContent = "Enviando…";
      try { await pedirClube(F.nome, F.sigla, F.escudo, F.uniforme); await carregar({ user: usuario }); }
      catch (e) { desenhar(e.message); }
    };
  };
  $("app").onclick = $("app").onchange = null;
  desenhar();
}

  if (clubeAberto && paginaDoClube) paginaDoClube(clubeAberto);

  // classificação e jogos do grupo escolhido
  async function grupo(g) {
    if (g === "COPA") return telaDaCopa();
    if (g === "TROFEUS") return telaDosCampeoes();
    if (g === "FEDERACAO") return telaDaFederacao();
    const partidas = await partidasDoGrupo(liga.id, g), resultados = await resultadosDe(partidas.map(p => p.id));
    const res = Object.fromEntries(resultados.map(r => [r.partida_id, r])), agora = Date.now(), doGrupo = clubes.filter(c => c.grupo === g);
    const rodadas = [...new Set(partidas.map(p => p.rodada))];
    const atual = rodadas.find(r => partidas.some(p => p.rodada === r && !res[p.id])) || rodadas[rodadas.length - 1]; // primeira rodada ainda sem todos os resultados
    $("tituloTabela").innerHTML = `${esc(nomeDoGrupo(g))} · classificação`;
    $("tabela").className = "";
    const serieG = g === "A" ? 1 : g === "B" || g === "C" ? 2 : 3, tabG = classificacao(doGrupo, partidas, resultados);
    const faixaG = i => serieG === 1 ? (i >= tabG.length - 4 ? "cai" : "") : i === 0 ? "sobe" : i <= 4 ? "playoff" : serieG === 2 && i >= tabG.length - 2 ? "cai" : "";
    $("tabela").innerHTML = `<table class="mini classif" style="width:100%"><tr><th></th><th class="esq">Clube</th><th title="Pontos">P</th><th title="Jogos">J</th><th title="Vitórias">V</th><th title="Empates">E</th><th title="Derrotas">D</th><th class="c-gols" title="Gols pró">GP</th><th class="c-gols" title="Gols contra">GC</th><th title="Saldo de gols">SG</th><th class="c-pe" title="Pontos esperados pelas chances criadas">PE</th></tr>
      ${tabG.map((t, i) => `<tr class="${faixaG(i)}"><td>${i + 1}</td><td class="esq cl-nome ${t.clube.id === clube.id ? "nota" : ""}">${lk(t.clube.id)}${t.clube.dono ? ` <span class="cl-hum" title="Clube com dirigente">●</span>` : ""}</td><td><b>${t.pts}</b></td><td>${t.j}</td><td>${t.v}</td><td>${t.e}</td><td>${t.d}</td><td class="c-gols">${t.gp}</td><td class="c-gols">${t.gc}</td><td>${t.gp - t.gc > 0 ? "+" : ""}${t.gp - t.gc}</td><td class="mut c-pe">${f1(t.esp)}</td></tr>`).join("")}</table>
      <div class="mut" style="margin-top:6px;font-size:12px"><span class="cl-hum">●</span> clube com dirigente · ${serieG === 1 ? `<span class="bad">▌</span> rebaixamento` : `<span class="ok">▌</span> acesso direto · <span class="casa">▌</span> playoff${serieG === 2 ? ` · <span class="bad">▌</span> rebaixamento` : ""}`}</div>`;
    $("tituloJogos").textContent = `${nomeDoGrupo(g)} · jogos`;
    $("rodadas").className = "";
    $("rodadas").innerHTML = rodadas.length ? `<label>Rodada<select id="rodada">${rodadas.map(r => `<option value="${r}" ${r === atual ? "selected" : ""}>${r === 19 ? "Playoff: semifinais" : r === 20 ? "Playoff: final" : "Rodada " + r}</option>`).join("")}</select></label><div id="jogos" style="margin-top:8px"></div>` : `<div class="mut">O calendário ainda não foi gerado.</div>`;
    // temporadas anteriores deste grupo, guardadas na virada
    historicoDoGrupo(liga.id, g).then(h => {
      if (!h.length || !$("rodadas")) return;
      const nome = Object.fromEntries(clubes.map(c => [c.id, c.nome])), temporadas = [...new Set(h.map(x => x.temporada))];
      $("rodadas").insertAdjacentHTML("beforeend", `<h2 style="margin-top:16px">Temporadas anteriores</h2>` + temporadas.map(t => `<details ${t === temporadas[0] ? "open" : ""}><summary>Temporada ${t}</summary><div class="rolagem"><table><tr><th></th><th class="esq">Clube</th><th>P</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>Prêmio</th></tr>
        ${h.filter(x => x.temporada === t).map(x => `<tr><td>${x.posicao}</td><td class="esq ${x.clube_id === clube.id ? "nota" : ""}">${esc(nome[x.clube_id] || "—")}${x.copa === "campeão" ? ` <span class="mut" title="Campeão da Copa do Brasil">🥇 copa</span>` : x.copa === "vice" ? ` <span class="mut" title="Vice-campeão da Copa do Brasil">vice copa</span>` : ""}</td><td><b>${x.pontos}</b></td><td>${x.vitorias}</td><td>${x.empates}</td><td>${x.derrotas}</td><td>${x.gols_pro}</td><td>${x.gols_contra}</td><td>${dinheiro(x.premio)}${x.destino === "subiu" ? ` <span class="ok">▲</span>` : x.destino === "caiu" ? ` <span class="bad">▼</span>` : x.destino === "campeão" ? " 🏆" : ""}</td></tr>`).join("")}</table></div></details>`).join(""));
    }).catch(() => {});
    const mostrar = () => { if ($("rodada")) $("jogos").innerHTML = partidas.filter(p => p.rodada === +$("rodada").value).map(p => jogo(p, res, agora)).join(""); };
    if ($("rodada")) $("rodada").onchange = mostrar;
    mostrar();
    if (g === clube.grupo) {
      // jogos de liga e de copa juntos, pela data
      Object.assign(res, copaRes);
      const meus = [...partidas, ...copaJogos].filter(p => p.casa === clube.id || p.fora === clube.id).sort((a, b) => new Date(a.inicio) - new Date(b.inicio) || a.id - b.id);
      const proximos = meus.filter(p => !res[p.id]).slice(0, 5), proximo = proximos[0];
      const rival = proximo ? cPor[proximo.casa === clube.id ? proximo.fora : proximo.casa] : null, ultimo = meus.filter(p => res[p.id]).pop();
      $("proximos").innerHTML = proximos.length ? proximos.map((p, k) => { const casa = p.casa === clube.id, adv = cPor[casa ? p.fora : p.casa], aoVivo = new Date(p.inicio).getTime() <= agora;
        return `<a class="tile ${k ? "" : "prox"}" href="aovivo.html?id=${p.id}"><div class="tl">${p.fase === "copa" ? `🏆 ${FASES_DA_COPA[p.copa_fase]} da copa` : `${p.rodada === 19 ? "Semifinal" : p.rodada === 20 ? "Final" : "Rodada " + p.rodada} · ${casa ? "casa" : "fora"}`}</div>${svgEscudo(adv.escudo, adv.sigla, 40)}<div class="tn">${esc(adv.nome)}</div><div class="td">${aoVivo ? `<b class="aviso">ao vivo</b>` : quando(p.inicio)}</div></a>`; }).join("")
        : `<div class="mut" style="grid-column:1/-1">${partidas.length ? "Não há mais jogos nesta temporada." : "O calendário ainda não foi gerado."}</div>`;
      $("proximo").innerHTML = (ultimo ? `Último jogo: <a class="lk" href="aovivo.html?id=${ultimo.id}">${esc(cPor[ultimo.casa].nome)} ${res[ultimo.id].gols_casa} x ${res[ultimo.id].gols_fora} ${esc(cPor[ultimo.fora].nome)}${penais(res[ultimo.id])}</a>${ultimo.fase === "copa" ? ` (${FASES_DA_COPA[ultimo.copa_fase].toLowerCase()} da copa)` : ""}. ` : "")
        + (rival ? (rival.dono ? `Próximo adversário: ${lk(rival.id)} tem dirigente, e a tática dele é segredo.` : `Próximo adversário: ${lk(rival.id)} é comandado pelo bot e joga com ${estiloDe(rival)}.`) : "");
      // tabela resumida, com as faixas de acesso, playoff e descenso
      const serie = g === "A" ? 1 : g === "B" || g === "C" ? 2 : 3, tab = classificacao(doGrupo, partidas, resultados);
      const faixa = i => serie === 1 ? (i >= tab.length - 4 ? "cai" : "") : i === 0 ? "sobe" : i <= 4 ? "playoff" : serie === 2 && i >= tab.length - 2 ? "cai" : "";
      $("miniTabela").className = "";
      $("miniTabela").innerHTML = `<table class="mini" style="width:100%"><tr><th></th><th class="esq">${esc(nomeDoGrupo(g))}</th><th>J</th><th>SG</th><th>PTS</th></tr>
        ${tab.map((t, i) => `<tr class="${faixa(i)}"><td>${i + 1}</td><td class="esq ${t.clube.id === clube.id ? "nota" : ""}">${lk(t.clube.id)}</td><td>${t.j}</td><td>${t.gp - t.gc}</td><td><b>${t.pts}</b></td></tr>`).join("")}</table>
        <div class="mut" style="margin-top:6px;font-size:12px">${serie === 1 ? `<span class="bad">▌</span> rebaixamento` : `<span class="ok">▌</span> acesso direto · <span class="casa">▌</span> playoff${serie === 2 ? ` · <span class="bad">▌</span> rebaixamento` : ""}`}</div>`;
    }
  }
  $("verGrupo").onchange = () => grupo($("verGrupo").value).catch(e => { $("tabela").innerHTML = `<span class="bad">${esc(e.message)}</span>`; });
  await grupo(clube.grupo);

  // contrato: clicar num jogador abre o painel para aumentar o salário ou renovar
  $("app").onclick = e => {
    const qual = e.target.dataset.obra;
    if (qual) {
      const nome = (ESTRUTURAS.find(x => x[0] === qual) || [])[1];
      if (!confirm(`Começar a obra: ${nome}? O valor sai do caixa agora e não dá para cancelar.`)) return;
      e.target.disabled = true;
      iniciarObra(qual).then(() => carregar({ user: usuario })).catch(err => { $("obraAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; e.target.disabled = false; });
      return;
    }
    if (e.target.closest("[data-info]")) return; // o botão de atributos tem o seu próprio quadro
    const tr = e.target.closest("tr[data-jog]"); if (!tr || !temContratos) return;
    const j = elenco.find(x => x.id === tr.dataset.jog), protegido = j.protegidoAte != null && j.protegidoAte >= liga.temporada;
    const maximo = Math.floor(teto * MAXIMO_INDIVIDUAL), sobra = teto - folha;
    const bloco = (titulo, corpo) => `<div style="border:1px solid var(--line);border-radius:8px;padding:10px"><div style="font-weight:700;margin-bottom:6px">${titulo}</div>${corpo}</div>`;
    const nProtegidos = elenco.filter(x => x.protegido).length;
    $("contratoPainel").innerHTML = `<div class="card" style="margin:0 0 10px;border-color:var(--ac)">
      <div class="row" style="align-items:center"><div><b style="font-size:16px">${esc(j.nome)}</b> <span class="mut">· ${sg(j.pos)} · ${j.idade} anos</span></div><button class="sec" id="ctFechar" style="margin-left:auto">Fechar</button></div>
      <div class="row" style="gap:18px;margin:8px 0 10px">
        <div><div class="mut">Salário</div><b>${dinheiro(j.salario)}</b></div>
        <div><div class="mut">Contrato</div><b>até a temporada ${j.contratoAte}</b></div>
        <div><div class="mut">Multa rescisória</div><b>${j.protegido ? "não tem (protegido)" : dinheiro(clausula(j.salario))}</b>${!j.protegido && protegido ? ` <span class="mut">só vale a partir da próxima temporada</span>` : ""}</div>
        ${j.aVenda ? `<div><div class="mut">À venda por</div><b>${dinheiro(j.precoPedido)}</b></div>` : ""}</div>
      <div class="duas">
        ${bloco("Contrato", `<div class="row"><label>Novo salário (em milhares)<input id="ctSalario" type="number" step="5" min="${j.salario}" max="${maximo}" value="${Math.max(j.salario, j.mercado)}" style="width:120px"></label>
            <label>Renovar por<select id="ctTemporadas" data-prog="ctSalario" data-mercado="${j.mercado || 0}"><option value="1">1 temporada</option><option value="2">2 temporadas (+10%)</option><option value="3">3 temporadas (+20%)</option></select></label></div>
          <div class="row" style="margin-top:8px"><button id="ctRenovar">Renovar o contrato</button><button class="sec" id="ctAumentar">Só aumentar o salário</button></div>
          <div class="mut" style="margin-top:6px"><span id="ctClausula"></span> · na renovação ele pede pelo menos ${dinheiro(j.mercado)} · máximo por jogador ${dinheiro(maximo)} · sobram ${dinheiro(sobra)} até o teto. O salário só sobe; a multa é 5 vezes o salário.</div>`)}
        ${janela === undefined ? "" : bloco(`Lista de protegidos <span class="tag">${nProtegidos} de 7</span>`, `<button class="sec" id="ctProteger">${j.protegido ? "Tirar da lista de protegidos" : "Pôr na lista de protegidos"}</button>
          <div class="mut" style="margin-top:6px">Protegido não tem multa rescisória: só sai se você vender. Para tirar alguém da lista, só com a janela fechada.</div>`)}
        ${propostas == null ? "" : bloco("Lista de transferência", `<div class="row"><label>Preço pedido (em milhares) <span class="mut">· sugerido: ${dinheiro(clausula(j.salario))}, o valor da multa</span><input id="ctPreco" type="number" step="50" min="0" value="${j.precoPedido || clausula(j.salario)}" style="width:120px"></label>
            <button class="sec" id="ctListar">${j.aVenda ? "Mudar o preço" : "Pôr à venda"}</button>${j.aVenda ? `<button class="sec" id="ctTirar">Tirar da lista</button>` : ""}</div>
          <div class="mut" style="margin-top:6px">A venda negociada só fecha entre ${dinheiro(faixaDaNegociacao(j.salario).minimo)} e ${dinheiro(faixaDaNegociacao(j.salario).maximo)} (60% a 150% da multa).</div>
          <div class="mut" style="margin-top:6px" id="ctTaxa">Na venda negociada você paga taxa sobre o valor.</div>`)}
        ${propostas == null || (caixa != null && caixa < 0) ? "" : bloco(`Vender pelo agente <span class="tag">${vendasPeloAgente} de ${VENDAS_PELO_AGENTE} nesta temporada</span>`, `<button class="sec" data-agente="1" ${!janela || vendasPeloAgente >= VENDAS_PELO_AGENTE || elenco.length <= 16 ? "disabled" : ""}>Vender por ${dinheiro(valorNoAgente(j.mercado ?? j.salario, false, cotacao))}</button>
          <div class="mut" style="margin-top:6px">Venda garantida, na hora: o agente coloca o jogador num clube sem dono. Quem paga são os clubes sem dono: com o caixa deles folgado, o preço é 2,5 vezes o salário de mercado (que hoje é ${dinheiro(j.mercado ?? j.salario)}); quando aperta, cai até 1 vez. Hoje o agente paga ${String(Math.round((1 + 1.5 * cotacao) * 100) / 100).replace(".", ",")} vezes. Aumentar o salário do contrato não muda esse preço. Só com a janela aberta${janela ? "" : ", e ela está fechada"}.</div>`)}
        ${clube.peneira_temporada === undefined || (j.idade > 21 && j.idade < 31) ? "" : bloco("Dispensar", `<button class="sec" id="ctDispensar" ${elenco.length <= 16 ? "disabled" : ""}>Dispensar sem custo</button>
          <div class="mut" style="margin-top:6px">Vale para quem tem até 21 anos ou 31 ou mais. Ele fica livre e pode ser contratado por qualquer clube. O elenco não pode ficar com menos de 16.</div>`)}
        ${caixa != null && caixa < 0 ? bloco(`<span class="bad">Clube no vermelho</span>`, `<button class="sec" data-agente="1" ${elenco.length <= 16 ? "disabled" : ""}>Vender pelo agente por ${dinheiro(valorNoAgente(j.mercado ?? j.salario, true, cotacao))}</button>
          <div class="mut" style="margin-top:6px">No vermelho o agente paga até 3 vezes o salário de mercado (hoje ${String(Math.round((1 + 2 * cotacao) * 100) / 100).replace(".", ",")} vezes, conforme o caixa dos clubes sem dono), na hora, mesmo com a janela fechada e sem gastar as vendas da temporada. O jogador vai para um clube sem dono. O elenco não pode ficar com menos de 16.</div>
          ${livres == null ? "" : j.ofertaLigaAte ? `<div class="aviso" style="margin-top:8px">Oferecido à liga por ${dinheiro(Math.round(3.75 * j.salario))} até ${ateQuando(j.ofertaLigaAte)}. Se ninguém levar, o agente vende.</div>`
            : `<button class="sec" id="ctOferecer" style="margin-top:8px" ${elenco.length <= 16 ? "disabled" : ""}>Oferecer à liga por ${dinheiro(Math.round(3.75 * j.salario))}</button>
               <div class="mut" style="margin-top:6px">75% da multa: qualquer clube pode levar durante ${Math.round((liga.horas_oferta || 168) / 24)} dias, mesmo com a janela fechada. Se ninguém levar, o agente o vende pelo preço do dia (até 3 vezes o salário de mercado).</div>`}`) : ""}
      </div>
      <div id="ctAviso" style="margin-top:6px"></div></div>`;
    const mostra = () => { $("ctClausula").textContent = `Com esse salário a multa fica em ${dinheiro(clausula(+$("ctSalario").value || 0))}`; };
    $("ctSalario").oninput = mostra; mostra();
    const enviar = async temporadas => {
      try { await ajustarContrato(j.id, Math.round(+$("ctSalario").value), temporadas); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    $("ctAumentar").onclick = () => enviar(0);
    $("ctRenovar").onclick = () => enviar(+$("ctTemporadas").value);
    $("ctFechar").onclick = () => { $("contratoPainel").innerHTML = ""; };
    if ($("ctListar")) {
      const listar = async preco => { try { await listarJogador(j.id, preco); await carregar({ user: usuario }); } catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; } };
      $("ctListar").onclick = () => listar(Math.round(+$("ctPreco").value) || 0);
      if ($("ctTirar")) $("ctTirar").onclick = () => listar(0);
      taxaDaVenda(j.id).then(t => { if (t != null && $("ctTaxa")) $("ctTaxa").textContent = `Se vender agora, a taxa é de ${Math.round(t * 100)}% do valor. (30% para quem acabou de chegar, 20% na janela seguinte, 10% depois.)`; });
    }
    if ($("ctProteger")) $("ctProteger").onclick = async () => {
      try { await protegerJogador(j.id, !j.protegido); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    if ($("ctOferecer")) $("ctOferecer").onclick = async () => {
      if (!confirm(`Oferecer ${j.nome} à liga? Qualquer clube poderá levá-lo por ${dinheiro(Math.round(3.75 * j.salario))}; se ninguém levar no prazo, o agente o vende a um clube sem dono.`)) return;
      try { await oferecerALiga(j.id); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    $("contratoPainel").querySelectorAll("[data-agente]").forEach(bt => { bt.onclick = async () => {
      const vermelho = caixa != null && caixa < 0;
      if (!confirm(`Vender ${j.nome} pelo agente por ${dinheiro(valorNoAgente(j.mercado ?? j.salario, vermelho, cotacao))}? Ele vai para um clube sem dono. Não dá para desfazer.`)) return;
      bt.disabled = true;
      try { alert(await venderPeloAgente(j.id)); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; bt.disabled = false; }
    }; });
    if ($("ctDispensar")) $("ctDispensar").onclick = async () => {
      if (!confirm(`Dispensar ${j.nome}? Ele sai do clube agora e fica livre para qualquer um contratar. Não dá para desfazer.`)) return;
      try { await dispensarJogador(j.id); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    if ($("ctBanco")) $("ctBanco").onclick = async () => {
      if (!confirm(`Vender ${j.nome} ao banco do jogo por ${dinheiro(valorNoBanco(j.salario))}? Ele sai do clube e não volta.`)) return;
      try { await venderAoBanco(j.id); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    $("contratoPainel").scrollIntoView({ behavior: "smooth", block: "nearest" });
  };

  // amistoso: tática salva contra a tática de bot do adversário; nada é gravado
  const guardados = {};
  $("amJogar").onclick = async () => {
    $("amJogar").disabled = true;
    try {
      const id = +$("amAdv").value, adv = cPor[id], casa = $("amMando").value === "casa";
      guardados[id] = guardados[id] || await elencoDoClube(id);
      const todos = e => e.map(j => ({ ...j, fora: 0 })); // em amistoso ninguém está lesionado nem suspenso
      const meuElenco = todos(elenco), minha = taticaDoDirigente(tatica && tatica.dados, meuElenco) || taticaBot(meuElenco, { mandante: casa });
      const forca = minha.escalacao.reduce((s, x) => s + notaNaPosicao(x.j, x.pos), 0) / minha.escalacao.length;
      const dele = taticaBot(todos(guardados[id]), { mandante: !casa, forcaAdversario: forca, perfil: adv.perfil });
      const meu = prepararTime({ nome: clube.nome, escalacao: minha.escalacao, banco: minha.banco, instrucoes: minha.instrucoes, mandante: casa });
      const outro = prepararTime({ nome: adv.nome, escalacao: dele.escalacao, banco: dele.banco, instrucoes: dele.instrucoes, mandante: !casa });
      const partida = casa ? simularPartida(criarRng(Math.floor(Math.random() * 2147483647)), meu, outro) : simularPartida(criarRng(Math.floor(Math.random() * 2147483647)), outro, meu);
      $("amInfo").textContent = `${adv.nome} (tática de bot, ${estiloDe(adv)}): ${dele.formacao}, nota média ${f1(dele.forca)}. ${clube.nome}: nota média ${f1(forca)}.`;
      $("amRel").innerHTML = htmlRelatorio(montarRelatorio(partida, [3, 3]), { nomes: casa ? [clube.nome, adv.nome] : [adv.nome, clube.nome], analistas: [casa ? 0 : 1] });
      $("amRel").scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) { $("amInfo").innerHTML = `<span class="bad">Não deu para jogar: ${esc(e.message)}</span>`; }
    $("amJogar").disabled = false;
  };
}

$("sair").onclick = () => sair();
await montarLogin($("login"), carregar);
window.__teste = { carregar };
</script>
</body>
</html>
