<style>
  .topo { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  /* patrocinador master no cabeçalho: a arte sem fundo das camisas; a de uma cor só, escura no tema claro e clara no escuro */
  .patro-topo { margin-left:auto; text-align:center; } .patro-topo .mut { display:none; font-family:var(--display); text-transform:uppercase; letter-spacing:.08em; font-size:10px; margin-bottom:2px; } .patro-topo img { display:block; width:56px; height:56px; object-fit:contain; margin:0 auto; } .patro-topo:empty { display:none; }
  :root[data-tema=claro] .patro-topo .so-escuro, :root:not([data-tema=claro]) .patro-topo .so-claro { display:none; } .topo-conta #quem { display:none; }
  .card.topo h2 { font-size:34px !important; line-height:1; font-weight:700; } /* a barra da conta (nome do jogo, relógio, e-mail, Sair) entra no cabeçalho do clube: uma linha a menos em toda tela */
  .topo-jogo { flex-basis:100%; display:flex; justify-content:center; align-items:baseline; gap:10px; margin:-6px 0 -2px; } .topo-jogo h1 { font-size:16px !important; }
  /* no PC (tela larga), tudo numa linha: escudo e nome, Trem Soccer com o relógio, o master, e Sair/Admin na ponta direita */
  @media (min-width:901px), (pointer:fine) {
    /* o meio do cabeçalho em duas metades iguais: Trem Soccer e relógio numa, o master na outra, cada um centrado na sua */
    .card.topo > .topo-jogo { order:1; flex:1 1 0; flex-direction:column; align-items:center; gap:4px; margin:0; }
    .card.topo .topo-jogo h1 { font-size:24px !important; line-height:1; } .card.topo .topo-jogo .relogio { font-size:22px; line-height:1; }
    .card.topo > .patro-topo { order:2; flex:1 1 0; margin-left:0; } .card.topo > div:last-child, .card.topo > #cvVoltar { order:3; } .patro-topo .mut { display:block; }
  }
  .topo-conta { display:flex; gap:8px; align-items:center; } .topo h1 { font-family:var(--display); text-transform:uppercase; letter-spacing:.05em; font-size:20px; color:var(--mut); }
  /* seletor de clubes (quem tem mais de um): o ativo com borda e sigla, ponto vermelho no outro quando há pendência lá */
  .meus-clubes { display:flex; gap:6px; align-items:center; } .meus-clubes:empty { display:none; }
  .meus-clubes button { display:inline-flex; align-items:center; gap:4px; padding:2px 6px; position:relative; }
  .meus-clubes button.ativo { border-color:var(--ac); } .meus-clubes .ponto { position:absolute; top:-3px; right:-3px; width:10px; height:10px; border-radius:50%; background:var(--bad); }
  /* celular: escudo, uniforme e nome numa linha só; os botões da direita descem; torcida em três colunas */
  @media (max-width:620px) and (pointer:coarse) {
    /* cabeçalho do clube no celular, em duas linhas: (1) Trem Soccer e relógio à esquerda, Sair, Guia e Admin à direita (sem o e-mail);

    .card.topo > * { order:3; } .card.topo > .topo-jogo { order:0; flex:1 1 auto; justify-content:flex-start; margin:-4px 0 8px; gap:8px; font-size:14px; } .card.topo .topo-jogo h1 { font-size:14px !important; }
    .card.topo > #cvVoltar { order:0; margin:-4px auto 8px 0; } /* página de outro clube: o Voltar sobe para a 1ª linha, à esquerda, e o selo do patrocinador vai à direita dele */
    .card.topo-cv > .patro-topo { order:1; margin:-4px 0 8px; } .card.topo-cv > .patro-topo img { width:32px; height:32px; }
    .card.topo.topo-cv > div:not([class]):not(:last-child) > div { white-space:normal; } /* dirigente, último acesso e divisão quebram a linha em vez de cortar */
    .card.topo > div:last-child { order:1; margin:-4px 0 8px auto !important; flex-direction:row !important; align-items:center !important; gap:10px !important; font-size:14px; }

    .card.topo > :is(svg, img) { width:44px; height:44px; } .card.topo > :is(svg, img) + svg { width:34px; height:34px; }
    .card.topo > div:not([class]):not(:last-child) { flex:1 1 0; min-width:0; } .card.topo > div:not([class]):not(:last-child) > div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13px; }
    .card.topo h2 { font-size:22px !important; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; } /* nome comprido desce para a 2ª linha em vez de ser cortado */
    .patro-topo { margin-left:0; } .patro-topo img { width:40px; height:40px; }

    document.body.append(f); }
  const hora = new Date(alvo).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }), d2 = n => String(n).padStart(2, "0");

// Só aparece para quem tem mais de um clube. Trocar grava o clube ativo no banco (toda ação vale para ele) e recarrega a página;

// Os clubes do dirigente saem da lista da liga que a tela do clube já leu; as pendências só são lidas com dois clubes ou mais.

    return `<button class="sec${ativo ? " ativo" : ""}" data-clube="${c.id}" title="${esc(c.nome)} (${esc(c.pais)})${ativo ? " · clube ativo" : p ? " · tem pendência" : " · trocar para este clube"}">${svgEscudo(c.escudo, c.sigla, 26)}${ativo ? `<b>${esc(c.sigla)}</b>` : ""}${p ? `<i class="ponto"></i>` : ""}</button>`; }).join("");
  el.onclick = async e => {
    const b = e.target.closest("[data-clube]");

          <div class="mut" style="margin-top:6px" id="ctTaxa">Na venda negociada você paga taxa sobre o valor.</div>`)}
        ${propostas == null || (caixa != null && caixa < 0) ? "" : bloco(`Vender pelo agente <span class="tag">${janelaDeSaidas ? `${vendasDeSaida} de ${SAIDAS} na janela de saídas` : `${vendasPeloAgente} de ${VENDAS_PELO_AGENTE} nesta temporada`}</span>`, `<button class="sec" data-agente="1" ${(janelaDeSaidas ? vendasDeSaida >= SAIDAS : !janela || vendasPeloAgente >= VENDAS_PELO_AGENTE) || contratados <= 16 ? "disabled" : ""}>Vender por ${dinheiro(valorNoAgente(j.mercado ?? j.salario, false, cotacao, doAgente.length))}</button>
          <div class="mut" style="margin-top:6px">Venda garantida, na hora: o agente coloca o jogador num clube sem dono. Quem paga é o fundo da liga: com ele folgado, o preço é 2,5 vezes o salário de mercado (que hoje é ${dinheiro(j.mercado ?? j.salario)}); quando aperta, cai até 1 vez. O preço também cai com as vendas pelo agente da temporada: a 3ª e a 4ª saem por até 2 vezes, a 5ª e a 6ª por até 1,5. Hoje o agente paga ${String(Math.round((1 + extraDoAgente(doAgente.length) * cotacao) * 100) / 100).replace(".", ",")} vezes. Aumentar o salário do contrato não muda esse preço. ${janelaDeSaidas ? `Janela de saídas: da última rodada até a virada dá para vender ${SAIDAS} jogadores pelo agente, para abrir espaço na folha antes de renovar.` : `Só com a janela aberta${janela ? "" : ", e ela está fechada"}.`}</div>`)}
        ${clube.peneira_temporada === undefined ? "" : bloco("Dispensar", `<button class="sec" id="ctDispensar" ${contratados <= 16 ? "disabled" : ""}>${j.idade > 21 && j.idade < 31 ? "Dispensar pagando a rescisão" : "Dispensar sem custo"}</button>
          <div class="mut" style="margin-top:6px">Até 21 anos ou com 31 ou mais, sai de graça. De 22 a 30, o clube paga a rescisão: 50% do salário que falta até o fim do contrato${j.idade > 21 && j.idade < 31 ? ` (<b id="ctMulta">calculando…</b>)` : ""}. Ele fica livre e pode ser contratado por qualquer clube. O elenco não pode ficar com menos de 16.</div>`)}
        ${caixa != null && caixa < 0 ? bloco(`<span class="bad">Clube no vermelho</span>`, `<button class="sec" data-agente="1" ${contratados <= 16 ? "disabled" : ""}>Vender pelo agente por ${dinheiro(valorNoAgente(j.mercado ?? j.salario, true, cotacao))}</button>
          <div class="mut" style="margin-top:6px">No vermelho o agente paga até 3 vezes o salário de mercado (hoje ${String(Math.round((1 + 2 * cotacao) * 100) / 100).replace(".", ",")} vezes, conforme o saldo do fundo da liga), na hora, mesmo com a janela fechada e sem gastar as vendas da temporada. O jogador vai para um clube sem dono. O elenco não pode ficar com menos de 16.</div>
          ${livres == null ? "" : j.ofertaLigaAte ? `<div class="aviso" style="margin-top:8px">Oferecido à liga por ${dinheiro(Math.round(3.75 * j.salario))} até ${ateQuando(j.ofertaLigaAte)}. Se ninguém levar, o agente vende.</div>`
            : `<button class="sec" id="ctOferecer" style="margin-top:8px" ${contratados <= 16 ? "disabled" : ""}>Oferecer à liga por ${dinheiro(Math.round(3.75 * j.salario))}</button>
               <div class="mut" style="margin-top:6px">75% da multa: qualquer clube pode levar durante ${prazoEmTexto(+liga.horas_oferta || 168)}, mesmo com a janela fechada. Se ninguém levar, o agente o vende pelo preço do dia (até 3 vezes o salário de mercado).</div>`}`) : ""}
      </div>
      <div id="ctAviso" style="margin-top:6px"></div></div>`;
    // luvas da renovação: quanto custa o salário abaixo do pedido para a duração escolhida
    const luvasAgora = () => { const t = +$("ctTemporadas").value, pede = minimoPelaDuracao(j.mercado || 0, t), s = Math.round(+$("ctSalario").value || 0);
      return { t, pede, s, valor: s < pede ? luvasDaRenovacao(pede, s, t) : 0, abaixo: s < salarioMinimoComLuvas(pede) }; };
    const mostra = () => {
      $("ctClausula").textContent = `Com esse salário a multa fica em ${dinheiro(clausula(Math.max(+$("ctSalario").value || 0, salarioDeMercado(j))))}`; // a multa nunca fica abaixo do valor de hoje
      const L = luvasAgora();
      $("ctLuvas").innerHTML = !L.valor ? "" : L.abaixo ? `<span class="bad">Abaixo de ${Math.round(LUVAS.piso * 100)}% do pedido (${dinheiro(L.pede)}), nem com luvas.</span>`
        : `<span class="aviso">Renovar por ${L.t} ${L.t === 1 ? "temporada" : "temporadas"} com ${dinheiro(L.s)} (o pedido é ${dinheiro(L.pede)}) custa <b>${dinheiro(L.valor)} de luvas</b>, pagas agora do caixa e fora da folha.${caixa != null && caixa < L.valor ? " O caixa não cobre." : ""}</span>`;
    };
    $("ctSalario").oninput = mostra; $("ctTemporadas").addEventListener("change", mostra); mostra();
    const enviar = async temporadas => {
      const L = luvasAgora(), comLuvas = temporadas > 0 && L.valor > 0;
      if (comLuvas && !confirm(`Pagar ${dinheiro(L.valor)} de luvas para renovar ${j.nome} por ${dinheiro(L.s)} por temporada?`)) return;
      try { await ajustarContrato(j.id, Math.round(+$("ctSalario").value), temporadas, comLuvas); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    if ($("ctNaoRenovar")) $("ctNaoRenovar").onchange = async e => {
      try { await marcarNaoRenovar(j.id, e.target.checked); await carregar({ user: usuario }); }
      catch (err) { e.target.checked = !e.target.checked; $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    $("ctAumentar").onclick = () => enviar(0);
    $("ctRenovar").onclick = () => enviar(+$("ctTemporadas").value);
    $("ctFechar").onclick = () => { $("contratoPainel").innerHTML = ""; };
    if ($("ctEmprestar")) $("ctEmprestar").onclick = async () => {
      const alvo = cPor[$("ctEmpClube").value]; if (!alvo || !confirm(`Emprestar ${j.nome} ao ${alvo.nome} até a virada da temporada? Não dá para desfazer.`)) return;
      try { recado = await emprestarABot(j.id, alvo.id); await carregar({ user: usuario }); } catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    if ($("ctListar")) {
      const listar = async preco => { try { await listarJogador(j.id, preco); await carregar({ user: usuario }); } catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; } };
      $("ctListar").onclick = () => listar(Math.round(+$("ctPreco").value) || 0);
      if ($("ctTirar")) $("ctTirar").onclick = () => listar(0);
      taxaDaVenda(j.id).then(t => { if (t != null && $("ctTaxa")) $("ctTaxa").textContent = `Se vender agora, a taxa é de ${Math.round(t * 100)}% do valor. (30% para quem acabou de chegar, 20% na janela seguinte, 10% depois.)`; });
    }
    if ($("ctProteger")) $("ctProteger").onclick = async () => {
      try { await protegerJogador(j.id, !j.protegido); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    if ($("ctOferecer")) $("ctOferecer").onclick = async () => {
      if (!confirm(`Oferecer ${j.nome} à liga? Qualquer clube poderá levá-lo por ${dinheiro(Math.round(3.75 * j.salario))}; se ninguém levar no prazo, o agente o vende a um clube sem dono.`)) return;
      try { await oferecerALiga(j.id); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    $("contratoPainel").querySelectorAll("[data-agente]").forEach(bt => { bt.onclick = async () => {
      const vermelho = caixa != null && caixa < 0;
      if (!confirm(`Vender ${j.nome} pelo agente por ${dinheiro(valorNoAgente(j.mercado ?? j.salario, vermelho, cotacao, doAgente.length))}? Ele vai para um clube sem dono. Não dá para desfazer.`)) return;
      bt.disabled = true;
      try { alert(await venderPeloAgente(j.id)); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; bt.disabled = false; }
    }; });
    const multaP = j.idade > 21 && j.idade < 31 && $("ctMulta") ? multaDaDispensa(j.id) : Promise.resolve(0);
    multaP.then(m => { if ($("ctMulta")) $("ctMulta").textContent = m == null ? "rode o SQL 133" : dinheiro(m); });
    if ($("ctDispensar")) $("ctDispensar").onclick = async () => {
      const multa = await multaP;
      if (!confirm(`Dispensar ${j.nome}?${multa > 0 ? ` A rescisão custa ${dinheiro(multa)}, que saem do caixa agora.` : ""} Ele sai do clube agora e fica livre para os outros clubes. O seu não pode contratá-lo de novo nesta temporada nem na próxima. Não dá para desfazer.`)) return;
      try { await dispensarJogador(j.id); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    if ($("ctBanco")) $("ctBanco").onclick = async () => {
      if (!confirm(`Vender ${j.nome} ao banco do jogo por ${dinheiro(valorNoBanco(j.salario))}? Ele sai do clube e não volta.`)) return;
      try { await venderAoBanco(j.id); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    $("contratoPainel").scrollIntoView({ behavior: "smooth", block: "nearest" });
  };

  // amistoso: tática salva contra a tática de bot do adversário; nada é gravado
  const guardados = {};
  if ($("pedirExtra")) $("pedirExtra").onclick = () => telaPedidoExtra();
  $("amJogar").onclick = async () => {
    $("amJogar").disabled = true; marcarChegada("amistoso");
    try {
      const id = +$("amAdv").value, adv = cPor[id], casa = $("amMando").value === "casa";
      guardados[id] = guardados[id] || await elencoDoClube(id);
      const todos = e => e.map(j => ({ ...j, fora: 0 })); // em amistoso ninguém está lesionado nem suspenso
      const meuElenco = todos(elenco), minha = taticaDoDirigente(tatica && tatica.dados, meuElenco) || taticaBot(meuElenco, { mandante: casa });
      const forca = minha.escalacao.reduce((s, x) => s + notaNaPosicao(x.j, x.pos), 0) / minha.escalacao.length;
      const dele = taticaBot(todos(guardados[id]), { mandante: !casa, forcaAdversario: forca, perfil: adv.perfil });
      const meu = prepararTime({ nome: clube.nome, escalacao: minha.escalacao, banco: minha.banco, instrucoes: minha.instrucoes, mandante: casa });
      const outro = prepararTime({ nome: adv.nome, escalacao: dele.escalacao, banco: dele.banco, instrucoes: dele.instrucoes, mandante: !casa });
      const partida = casa ? simularPartida(criarRng(Math.floor(Math.random() * 2147483647)), meu, outro) : simularPartida(criarRng(Math.floor(Math.random() * 2147483647)), outro, meu);
      $("amInfo").textContent = `${adv.nome} (tática de bot, ${estiloDe(adv)}): ${dele.formacao}, nota média ${f1(dele.forca)}. ${clube.nome}: nota média ${f1(forca)}.`;
      $("amRel").innerHTML = htmlRelatorio(montarRelatorio(partida, [3, 3]), { nomes: casa ? [clube.nome, adv.nome] : [adv.nome, clube.nome], analistas: [casa ? 0 : 1], ordens: partida.ordens, clubes: casa ? [clube, adv] : [adv, clube] });
      ligarGraficos($("amRel"));
      if ($("popAmistoso") && $("popAmistoso").showPopover) $("popAmistoso").showPopover(); else $("amRel").scrollIntoView({ behavior: "smooth", block: "start" }); // visual novo: o relatório abre por cima
    } catch (e) { $("amInfo").innerHTML = `<span class="bad">Não deu para jogar: ${esc(e.message)}</span>`; }
    $("amJogar").disabled = false;
  };
}

$("sair").onclick = () => sair();
await montarLogin($("login"), carregar);
window.__teste = { carregar, talvezAtualizar };
</script>
</body>
</html>
