<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trem Soccer</title>
<link rel="stylesheet" href="estilo.css">
<script src="atualiza.js"></script>
<style>
  .topo { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .cores { display:flex; flex-wrap:wrap; gap:4px; max-width:230px; }
  .cores span { width:24px; height:24px; border-radius:6px; border:2px solid var(--line); cursor:pointer; }
  .cores span.sel { border-color:var(--ac); }
  .previa { display:flex; gap:16px; align-items:center; justify-content:center; padding:12px; background:#0f1720; border-radius:10px; border:1px solid var(--line); }
  .a0 { color:#5d6b7c; } .a1 { color:#9fb0c3; } .a3 { color:#7fd4a6; font-weight:600; } .a4 { color:#3fe08f; font-weight:700; }
  tr.sep td { border-top:2px solid var(--line); }
</style>
</head>
<body>
<main>
  <div class="topo"><h1 style="margin:0">Trem Soccer</h1><span class="relogio" title="Hora deste aparelho"></span><span class="mut" id="quem" style="margin-left:auto"></span><button class="sec" id="sair" hidden>Sair</button></div>
  <div class="card" id="login"></div>
  <div id="app"></div>
</main>

<script type="module">
import { criarRng } from "./src/rng.js";
import { ATRIBUTOS, POSICOES, PESOS, notaNaPosicao } from "./src/modelo.js";
import { sair, ligaAtual, clubesDaLiga, meuClube, pedirClube, meuPedido, registrarAcesso, elencoDoClube, partidasDoGrupo, resultadosDe, minhaTatica, ehAdmin, ajustarContrato, extratoDoClube, caixaDoClube } from "./src/banco.js";
import { classificacao, taticaDoDirigente } from "./src/rodada.js";
import { salarioDeMercado, clausula, dinheiro, MAXIMO_INDIVIDUAL } from "./src/economia.js";
import { prepararTime, simularPartida } from "./src/motor.js";
import { taticaBot, ESTILO_DO_PERFIL } from "./src/bot.js";
import { montarRelatorio } from "./src/relatorio.js";
import { htmlRelatorio } from "./src/ui-relatorio.js";
import { montarLogin } from "./src/ui-login.js";
import { svgEscudo, svgUniforme, visualAleatorio, FORMAS, PADROES, CORES } from "./src/escudo.js";

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f1 = v => v.toFixed(1).replace(".", ",");
const corAtr = v => "a" + (v < 10 ? 0 : v < 20 ? 1 : v < 30 ? 2 : v < 40 ? 3 : 4);
let usuario = null, versao = 0;

async function carregar(s) {
  const minha = ++versao; // evita desenhar duas vezes quando a sessão muda rápido
  usuario = s ? s.user : null;
  $("quem").textContent = usuario ? usuario.email : "";
  $("sair").hidden = !usuario;
  if (!usuario) { $("app").innerHTML = ""; return; }
  $("app").innerHTML = `<div class="card mut">Carregando…</div>`;
  try {
    const [liga, clube] = await Promise.all([ligaAtual(), meuClube(usuario.id)]);
    if (minha !== versao) return;
    if (!liga) { $("app").innerHTML = `<div class="card">Ainda não há liga aberta. Avise o administrador.</div>`; return; }
    if (clube) { registrarAcesso().catch(() => {}); await telaClube(liga, clube); return; }
    const pedido = await meuPedido(usuario.id);
    if (minha !== versao) return;
    if (pedido && pedido.estado === "pendente") telaEspera(pedido);
    else await telaCriar(liga, pedido && pedido.estado === "recusado" ? pedido : null);
  } catch (e) { $("app").innerHTML = `<div class="card bad">Não consegui carregar: ${esc(e.message)}</div>`; }
}

// ---------- pedido esperando aprovação ----------
function telaEspera(p) {
  $("app").onclick = $("app").onchange = null;
  $("app").innerHTML = `<div class="card"><h2>Pedido enviado</h2>
    <div class="previa" style="margin-bottom:10px">${svgEscudo(p.escudo, p.sigla, 110)}${svgUniforme(p.uniforme, 90)}</div>
    <div><b>${esc(p.nome)}</b> (${esc(p.sigla)}) está esperando a aprovação do administrador da liga. Assim que ele aprovar, o seu clube aparece aqui, já com 22 jogadores.</div>
    <div class="row" style="margin-top:10px"><button id="verDeNovo">Ver se já foi aprovado</button><span class="mut">Esta página também confere sozinha a cada minuto.</span></div></div>`;
  $("verDeNovo").onclick = () => carregar({ user: usuario });
  const v = versao; setTimeout(() => { if (v === versao) carregar({ user: usuario }); }, 60000);
}

// ---------- criar o clube ----------
async function telaCriar(liga, recusado) {
  const clubes = await clubesDaLiga(liga.id), vagas = clubes.filter(c => !c.dono).length;
  const v = visualAleatorio(criarRng(Date.now() % 1e9)), F = { nome: "", sigla: "", escudo: v.escudo, uniforme: v.uniforme };
  const paleta = (alvo, campo) => `<div class="cores">${CORES.map(c => `<span data-cor="${c}" data-alvo="${alvo}" data-campo="${campo}" class="${F[alvo][campo] === c ? "sel" : ""}" style="background:${c}"></span>`).join("")}</div>`;
  const opcoes = (obj, atual) => Object.entries(obj).map(([k, n]) => `<option value="${k}" ${k === atual ? "selected" : ""}>${n}</option>`).join("");
  const desenhar = (aviso = "") => {
    $("app").innerHTML = `<div class="card"><h2>Criar o seu clube</h2>
      <div class="mut" style="margin-bottom:10px">${esc(liga.nome)} · ${vagas} ${vagas === 1 ? "vaga livre" : "vagas livres"} de ${clubes.length}. Você escolhe nome, sigla e cores; quando o administrador aprovar o pedido, você assume um dos clubes sem dono, já com 22 jogadores.</div>
      ${recusado ? `<div class="aviso" style="margin-bottom:10px">O pedido anterior (${esc(recusado.nome)}) foi recusado${recusado.motivo ? `: ${esc(recusado.motivo)}` : "."} Você pode enviar outro.</div>` : ""}
      ${vagas ? `<div class="duas"><div>
        <div class="row"><label style="flex:1;min-width:160px">Nome do clube<input id="cNome" maxlength="30" value="${esc(F.nome)}"></label><label>Sigla (3 letras)<input id="cSigla" maxlength="3" style="width:90px;text-transform:uppercase" value="${esc(F.sigla)}"></label></div>
        <div class="row" style="margin-top:10px"><label>Forma do escudo<select data-alvo="escudo" data-campo="forma">${opcoes(FORMAS, F.escudo.forma)}</select></label><label>Desenho do escudo<select data-alvo="escudo" data-campo="padrao">${opcoes(PADROES, F.escudo.padrao)}</select></label></div>
        <div class="row" style="margin-top:10px"><label>Cor principal do escudo${paleta("escudo", "cor1")}</label><label>Segunda cor do escudo${paleta("escudo", "cor2")}</label></div>
        <div class="row" style="margin-top:10px"><label>Desenho da camisa<select data-alvo="uniforme" data-campo="padrao">${opcoes(PADROES, F.uniforme.padrao)}</select></label></div>
        <div class="row" style="margin-top:10px"><label>Cor principal da camisa${paleta("uniforme", "cor1")}</label><label>Segunda cor da camisa${paleta("uniforme", "cor2")}</label><label>Calção${paleta("uniforme", "calcao")}</label></div>
      </div><div><div class="previa">${svgEscudo(F.escudo, F.sigla || "ABC", 110)}${svgUniforme(F.uniforme, 90)}</div>
        <button id="cCriar" style="margin-top:12px;width:100%">Enviar o pedido</button>${aviso ? `<div class="bad" style="margin-top:8px">${esc(aviso)}</div>` : ""}</div></div>` : `<div class="bad">Todas as vagas estão ocupadas.</div>`}</div>`;
    if (!vagas) return;
    $("cNome").oninput = e => { F.nome = e.target.value; };
    $("cSigla").oninput = e => { F.sigla = e.target.value.toUpperCase(); document.querySelector(".previa").innerHTML = svgEscudo(F.escudo, F.sigla || "ABC", 110) + svgUniforme(F.uniforme, 90); };
    $("cCriar").onclick = async () => {
      $("cCriar").disabled = true; $("cCriar").textContent = "Enviando…";
      try { await pedirClube(F.nome, F.sigla, F.escudo, F.uniforme); await carregar({ user: usuario }); }
      catch (e) { desenhar(e.message); }
    };
  };
  $("app").onclick = e => { const d = e.target.dataset; if (d.cor) { F[d.alvo][d.campo] = d.cor; desenhar(); } };
  $("app").onchange = e => { const d = e.target.dataset; if (d.alvo && e.target.tagName === "SELECT") { F[d.alvo][d.campo] = e.target.value; desenhar(); } };
  desenhar();
}

// ---------- meu clube ----------
async function telaClube(liga, clube) {
  $("app").onclick = $("app").onchange = null;
  const [elenco, clubes, tatica, admin, extrato] = await Promise.all([elencoDoClube(clube.id), clubesDaLiga(liga.id), minhaTatica(clube.id), ehAdmin().catch(() => false), extratoDoClube(clube.id)]);
  const caixa = await caixaDoClube(clube.id);
  const cPor = Object.fromEntries(clubes.map(c => [c.id, c])), humanos = clubes.filter(c => c.dono).length;
  const grupos = [...new Set(clubes.map(c => c.grupo))].sort();
  const quando = d => new Date(d).toLocaleString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const jogo = (p, res, agora) => { const r = res[p.id], aoVivo = !r && new Date(p.inicio).getTime() <= agora, meu = p.casa === clube.id || p.fora === clube.id;
    return `<a class="lance" style="align-items:center;text-decoration:none;color:inherit" href="aovivo.html?id=${p.id}">${svgEscudo(cPor[p.casa].escudo, cPor[p.casa].sigla, 24)}<span ${meu ? `class="nota"` : ""}>${esc(cPor[p.casa].nome)} <b>${r ? `${r.gols_casa} x ${r.gols_fora}` : "x"}</b> ${esc(cPor[p.fora].nome)}</span>${svgEscudo(cPor[p.fora].escudo, cPor[p.fora].sigla, 24)}<span class="xg">${r ? "encerrado" : aoVivo ? `<b class="aviso">ao vivo</b>` : quando(p.inicio)}</span></a>`; };
  const situacao = j => (j.fora > 0 ? ` <span class="bad">${j.motivo || "fora"} · ${j.fora} ${j.fora === 1 ? "jogo" : "jogos"}</span>` : "") + (j.amarelos ? ` <span class="aviso" title="Amarelos acumulados: o terceiro suspende por um jogo">${"🟨".repeat(j.amarelos)}</span>` : "");
  const temContratos = elenco.some(j => j.salario != null), folha = elenco.reduce((s, j) => s + (j.salario || 0), 0), teto = liga.teto_folha || 0;
  const contrato = j => j.salario == null ? `<td>—</td><td>—</td><td>—</td>` : `<td>${dinheiro(j.salario)}</td><td title="${j.protegidoAte != null && j.protegidoAte >= liga.temporada ? "Protegido: a cláusula só vale depois desta temporada" : "Valor para outro clube levar o jogador"}">${dinheiro(clausula(j.salario))}${j.protegidoAte != null && j.protegidoAte >= liga.temporada ? " 🔒" : ""}</td><td class="${j.contratoAte <= liga.temporada ? "aviso" : ""}">até a ${j.contratoAte}</td>`;
  const linha = j => `<tr class="clk" data-jog="${j.id}"><td><span class="pp">${j.pos}</span></td><td class="esq">${esc(j.nome)}${situacao(j)}</td><td>${j.idade}</td><td class="nota">${f1(notaNaPosicao(j, j.pos))}</td>${contrato(j)}
    <td class="esq">${Object.entries(j.fam).filter(([p]) => p !== j.pos).map(([p, f]) => `${p}<span class="tag"> ${f}</span>`).join(" · ") || "—"}</td>
    ${j.at.map((v, k) => `<td class="${corAtr(v)}" title="${ATRIBUTOS[k].nome}${PESOS[POSICOES[j.pos].papel][ATRIBUTOS[k].k] ? " · conta para a posição" : ""}">${v}</td>`).join("")}</tr>`;
  const outros = clubes.filter(c => c.id !== clube.id);
  const nomeDoHumor = h => h < 3 ? "Revoltada" : h < 6 ? "Nervosa" : h < 10 ? "Calma" : h < 13 ? "Animada" : "Eufórica";
  // finanças: caixa, previsão por rodada e extrato agrupado por rodada
  const financas = () => {
    const n = liga.rodadas_por_temporada || 18, tv = Math.round((liga.receita_tv || 0) / n), pat = Math.round((liga.receita_patrocinio || 0) / n), sal = Math.round(folha / n);
    // bilheteria: só nos jogos em casa (metade das rodadas); público limitado pelos lugares do estádio
    const temTorcida = clube.torcida != null, lugares = 5000 + 5000 * (clube.estadio_nivel || 1);
    const publico = temTorcida ? Math.min(lugares, Math.round(clube.torcida * (0.85 + 0.3 * clube.humor / 16) + 0.1 * (liga.torcida_base || clube.torcida))) : 0;
    const porJogo = Math.round(publico * (liga.preco_ingresso || 0) / 1000), bil = Math.round(porJogo / 2);
    const humor = clube.humor < 3 ? "revoltada" : clube.humor < 6 ? "nervosa" : clube.humor < 10 ? "calma" : clube.humor < 13 ? "animada" : "eufórica";
    const saldo = tv + pat + bil - sal, cor = v => v < 0 ? "bad" : "ok", sinal = v => (v > 0 ? "+" : "") + dinheiro(v);
    const grupos = [];
    for (const l of extrato) { const k = l.temporada + "-" + l.rodada; let g = grupos.find(x => x.k === k); if (!g) grupos.push(g = { k, temporada: l.temporada, rodada: l.rodada, itens: [], total: 0 }); g.itens.push(l); g.total += l.valor; }
    return `<div class="row" style="align-items:center"><div><div class="mut">Caixa</div><div style="font-size:24px;font-weight:800" class="${cor(caixa)}">${dinheiro(caixa)}</div></div>
      <div class="mut">A cada rodada: TV ${sinal(tv)} · patrocínio ${sinal(pat)}${temTorcida ? ` · bilheteria ${sinal(bil)} em média` : ""} · salários ${sinal(-sal)} · <b class="${cor(saldo)}">saldo ${sinal(saldo)}</b>
        ${temTorcida ? `<br>Estádio nível ${clube.estadio_nivel}: ${lugares.toLocaleString("pt-BR")} lugares · torcida de ${clube.torcida.toLocaleString("pt-BR")}, ${humor} · cerca de ${publico.toLocaleString("pt-BR")} pagantes e ${dinheiro(porJogo)} por jogo em casa${publico >= lugares ? ` · <span class="aviso">o estádio lota: há torcida para mais lugares</span>` : ""}` : ""}
        <br>Prêmios, equipe técnica e obras entram nos próximos passos.</div></div>
      ${grupos.length ? `<div class="rolagem" style="margin-top:8px;max-height:260px;overflow:auto"><table><tr><th class="esq">Rodada</th><th class="esq">Lançamentos</th><th>Saldo</th></tr>${grupos.map(g => `<tr><td class="esq">Temporada ${g.temporada} · rodada ${g.rodada == null ? "—" : g.rodada}</td><td class="esq">${g.itens.map(i => `${esc(i.descricao || i.tipo)} <span class="${cor(i.valor)}">${sinal(i.valor)}</span>`).join(" · ")}</td><td class="${cor(g.total)}"><b>${sinal(g.total)}</b></td></tr>`).join("")}</table></div>` : `<div class="mut" style="margin-top:8px">Ainda não há lançamentos: eles aparecem a cada rodada de liga calculada.</div>`}`;
  };
  const estiloDe = c => (ESTILO_DO_PERFIL[c.perfil] || ESTILO_DO_PERFIL.equilibrado).nome;

  $("app").innerHTML = `<div class="card topo">${svgEscudo(clube.escudo, clube.sigla, 72)}${svgUniforme(clube.uniforme, 52)}
      <div><h2 style="margin:0;font-size:20px">${esc(clube.nome)}</h2><div class="mut">${esc(liga.nome)} · temporada ${liga.temporada} · grupo ${esc(clube.grupo)}</div></div>
      ${admin ? `<a href="admin.html" style="color:var(--ac);margin-left:auto">Administração</a>` : ""}</div>
    <div class="abas" id="abas">${[["inicio", "Início"], ["classificacao", "Classificação"], ["elenco", "Elenco"], ["financas", "Finanças"]].map(([k, n]) => `<button class="aba" data-aba="${k}">${n}</button>`).join("")}</div>
    <section data-secao="inicio">
    <div class="card"><h2>Próximo jogo</h2><div id="proximo" class="mut">Carregando…</div>
      <div class="row" style="margin-top:10px"><a href="escalacao.html?online=1"><button>Escalação e tática</button></a><span class="${tatica ? "mut" : "aviso"}">${tatica ? `Tática salva em ${new Date(tatica.atualizada_em).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" })}.` : "Você ainda não salvou uma tática: até salvar, o bot escala o seu time."}</span></div></div>
    ${clube.torcida == null ? "" : `<div class="card"><h2>Torcida</h2><div class="row" style="gap:28px;align-items:center">
      <div><div class="mut">Número de torcedores</div><div style="font-size:22px;font-weight:800">${clube.torcida.toLocaleString("pt-BR")}</div></div>
      <div><div class="mut">Humor da torcida</div><div style="font-size:22px;font-weight:800" class="${clube.humor < 6 ? "bad" : clube.humor >= 10 ? "ok" : ""}">${nomeDoHumor(clube.humor)} <span class="mut" style="font-size:14px;font-weight:400">(${String(clube.humor).replace(".", ",")} de 16)</span></div></div>
      <div><div class="mut">Estádio</div><div style="font-size:22px;font-weight:800">${(5000 + 5000 * clube.estadio_nivel).toLocaleString("pt-BR")} <span class="mut" style="font-size:14px;font-weight:400">lugares · nível ${clube.estadio_nivel}</span></div></div></div>
      <div class="mut" style="margin-top:6px">A torcida cresce com as vitórias e encolhe com as derrotas. Torcida animada vai mais ao estádio.</div></div>`}
    <div class="card"><h2>Amistoso <span class="tag">quantos quiser · não vale para a tabela · relatório na hora</span></h2>
      <div class="row"><label style="flex:1;min-width:200px">Adversário<select id="amAdv">${outros.map(c => `<option value="${c.id}" ${c.grupo === clube.grupo && !outros.slice(0, outros.indexOf(c)).some(x => x.grupo === clube.grupo) ? "selected" : ""}>Grupo ${esc(c.grupo)} · ${esc(c.nome)}${c.dono ? " (dirigente)" : ""}</option>`).join("")}</select></label>
        <label>Mando<select id="amMando"><option value="casa">Em casa</option><option value="fora">Fora</option></select></label><button id="amJogar">Jogar amistoso</button></div>
      <div class="mut" style="margin-top:6px">Você joga com a tática salva${tatica ? "" : " (como ainda não salvou, o bot escala)"}; o adversário joga com a tática de bot. Lesões, suspensões e cartões não contam em amistoso: todos os jogadores ficam disponíveis e nada do que acontece aqui vale depois.</div>
      <div id="amInfo" class="mut" style="margin-top:6px"></div></div>
    <div id="amRel"></div>
    </section>
    <section data-secao="classificacao">
    <div class="card row"><label>Ver o grupo<select id="verGrupo">${grupos.map(g => `<option value="${esc(g)}" ${g === clube.grupo ? "selected" : ""}>Grupo ${esc(g)}${g === clube.grupo ? " (o seu)" : ""}</option>`).join("")}</select></label>
      <span class="mut">${humanos} ${humanos === 1 ? "dirigente" : "dirigentes"} na liga; os demais clubes são do bot.</span></div>
    <div class="duas">
      <div class="card"><h2 id="tituloTabela">Classificação</h2><div id="tabela" class="mut">Carregando…</div></div>
      <div class="card"><h2 id="tituloJogos">Jogos</h2><div id="rodadas" class="mut">Carregando…</div></div>
    </div>
    </section>
    <section data-secao="financas">
    ${caixa == null ? `<div class="card mut">As finanças aparecem aqui quando o caixa da liga for ligado pelo administrador.</div>` : `<div class="card"><h2>Finanças <span class="tag">valores por rodada de liga, enquanto o calendário é de teste</span></h2>${financas()}</div>`}
    </section>
    <section data-secao="elenco">
    <div class="card"><h2>Elenco <span class="tag">${elenco.length} jogadores${temContratos ? ` · folha ${dinheiro(folha)} de ${dinheiro(teto)} por temporada (${Math.round(folha / teto * 100)}% do teto) · clique num jogador para mexer no contrato` : ""}</span></h2>
      <div id="contratoPainel"></div><div class="rolagem"><table><tr><th>Pos</th><th class="esq">Jogador</th><th>Id.</th><th>Nota</th><th>Salário</th><th>Cláusula</th><th>Contrato</th><th class="esq">Também joga</th>${ATRIBUTOS.map(a => `<th title="${a.nome}">${a.k}</th>`).join("")}</tr>
      ${elenco.filter(j => j.titular).map(linha).join("")}${elenco.filter(j => !j.titular).map((j, i) => linha(j).replace(`<tr class="clk"`, i ? `<tr class="clk"` : `<tr class="clk sep"`)).join("")}</table></div></div>
    </section>`;

  // abas: mostra uma seção por vez e lembra a última aberta
  const abrir = k => {
    document.querySelectorAll("[data-secao]").forEach(x => { x.hidden = x.dataset.secao !== k; });
    document.querySelectorAll(".aba").forEach(b => b.classList.toggle("ativa", b.dataset.aba === k));
    try { localStorage.setItem("mo_aba", k); } catch (e) {}
  };
  $("abas").onclick = e => { if (e.target.dataset.aba) abrir(e.target.dataset.aba); };
  let inicial = "inicio"; try { inicial = localStorage.getItem("mo_aba") || "inicio"; } catch (e) {}
  abrir(document.querySelector(`[data-secao="${inicial}"]`) ? inicial : "inicio");

  // classificação e jogos do grupo escolhido
  async function grupo(g) {
    const partidas = await partidasDoGrupo(liga.id, g), resultados = await resultadosDe(partidas.map(p => p.id));
    const res = Object.fromEntries(resultados.map(r => [r.partida_id, r])), agora = Date.now(), doGrupo = clubes.filter(c => c.grupo === g);
    const rodadas = [...new Set(partidas.map(p => p.rodada))];
    const atual = rodadas.find(r => partidas.some(p => p.rodada === r && !res[p.id])) || rodadas[rodadas.length - 1]; // primeira rodada ainda sem todos os resultados
    $("tituloTabela").innerHTML = `Classificação do grupo ${esc(g)} <span class="tag">PE: pontos esperados pelas chances criadas</span>`;
    $("tabela").className = "rolagem";
    $("tabela").innerHTML = `<table><tr><th></th><th class="esq">Clube</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th><th>PE</th></tr>
      ${classificacao(doGrupo, partidas, resultados).map((t, i) => `<tr><td>${i + 1}</td><td class="esq ${t.clube.id === clube.id ? "nota" : ""}">${esc(t.clube.nome)}${t.clube.dono ? "" : ` <span class="tag">bot</span>`}</td><td><b>${t.pts}</b></td><td>${t.j}</td><td>${t.v}</td><td>${t.e}</td><td>${t.d}</td><td>${t.gp}</td><td>${t.gc}</td><td>${t.gp - t.gc}</td><td class="mut">${f1(t.esp)}</td></tr>`).join("")}</table>`;
    $("tituloJogos").textContent = `Jogos do grupo ${g}`;
    $("rodadas").className = "";
    $("rodadas").innerHTML = rodadas.length ? `<label>Rodada<select id="rodada">${rodadas.map(r => `<option value="${r}" ${r === atual ? "selected" : ""}>Rodada ${r}</option>`).join("")}</select></label><div id="jogos" style="margin-top:8px"></div>` : `<div class="mut">O calendário ainda não foi gerado.</div>`;
    const mostrar = () => { if ($("rodada")) $("jogos").innerHTML = partidas.filter(p => p.rodada === +$("rodada").value).map(p => jogo(p, res, agora)).join(""); };
    if ($("rodada")) $("rodada").onchange = mostrar;
    mostrar();
    if (g === clube.grupo) {
      const proximo = partidas.filter(p => p.casa === clube.id || p.fora === clube.id).find(p => !res[p.id]);
      const rival = proximo ? cPor[proximo.casa === clube.id ? proximo.fora : proximo.casa] : null;
      $("proximo").className = ""; $("proximo").innerHTML = proximo ? jogo(proximo, res, agora) + `<div class="mut" style="margin-top:6px">${rival.dono ? `${esc(rival.nome)} tem dirigente: a tática dele é segredo.` : `${esc(rival.nome)} é comandado pelo bot e joga com ${estiloDe(rival)}.`}</div>` : `<div class="mut">${partidas.length ? "Não há mais jogos nesta temporada." : "O calendário ainda não foi gerado."}</div>`;
    }
  }
  $("verGrupo").onchange = () => grupo($("verGrupo").value).catch(e => { $("tabela").innerHTML = `<span class="bad">${esc(e.message)}</span>`; });
  await grupo(clube.grupo);

  // contrato: clicar num jogador abre o painel para aumentar o salário ou renovar
  $("app").onclick = e => {
    const tr = e.target.closest("tr[data-jog]"); if (!tr || !temContratos) return;
    const j = elenco.find(x => x.id === tr.dataset.jog), protegido = j.protegidoAte != null && j.protegidoAte >= liga.temporada;
    const maximo = Math.floor(teto * MAXIMO_INDIVIDUAL), sobra = teto - folha;
    $("contratoPainel").innerHTML = `<div class="card" style="margin:0 0 10px;border-color:var(--ac)"><b>${esc(j.nome)}</b> · ${j.pos} · ${j.idade} anos
      <div class="mut" style="margin:4px 0">Salário atual ${dinheiro(j.salario)} por temporada · mínimo que ele aceita na renovação ${dinheiro(j.mercado)} · cláusula ${dinheiro(clausula(j.salario))}${protegido ? " (protegido até o fim desta temporada)" : ""} · contrato até o fim da temporada ${j.contratoAte}.</div>
      <div class="mut" style="margin:4px 0">O salário só pode subir. A cláusula é 5 vezes o salário. Um jogador pode ganhar até ${dinheiro(maximo)}; sobram ${dinheiro(sobra)} até o teto de folha.</div>
      <div class="row"><label>Novo salário (em milhares por temporada)<input id="ctSalario" type="number" step="5" min="${j.salario}" max="${maximo}" value="${Math.max(j.salario, j.mercado)}" style="width:150px"></label>
        <span class="mut" id="ctClausula"></span>
        <button class="sec" id="ctAumentar">Só aumentar o salário</button>
        <label>Renovar por<select id="ctTemporadas"><option value="1">1 temporada</option><option value="2">2 temporadas</option><option value="3">3 temporadas</option></select></label>
        <button id="ctRenovar">Renovar o contrato</button><button class="sec" id="ctFechar">Fechar</button></div>
      <div id="ctAviso" style="margin-top:6px"></div></div>`;
    const mostra = () => { $("ctClausula").textContent = `cláusula nova: ${dinheiro(clausula(+$("ctSalario").value || 0))}`; };
    $("ctSalario").oninput = mostra; mostra();
    const enviar = async temporadas => {
      try { await ajustarContrato(j.id, Math.round(+$("ctSalario").value), temporadas); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    $("ctAumentar").onclick = () => enviar(0);
    $("ctRenovar").onclick = () => enviar(+$("ctTemporadas").value);
    $("ctFechar").onclick = () => { $("contratoPainel").innerHTML = ""; };
    $("contratoPainel").scrollIntoView({ behavior: "smooth", block: "nearest" });
  };

  // amistoso: tática salva contra a tática de bot do adversário; nada é gravado
  const guardados = {};
  $("amJogar").onclick = async () => {
    $("amJogar").disabled = true;
    try {
      const id = +$("amAdv").value, adv = cPor[id], casa = $("amMando").value === "casa";
      guardados[id] = guardados[id] || await elencoDoClube(id);
      const todos = e => e.map(j => ({ ...j, fora: 0 })); // em amistoso ninguém está lesionado nem suspenso
      const meuElenco = todos(elenco), minha = taticaDoDirigente(tatica && tatica.dados, meuElenco) || taticaBot(meuElenco, { mandante: casa });
      const forca = minha.escalacao.reduce((s, x) => s + notaNaPosicao(x.j, x.pos), 0) / minha.escalacao.length;
      const dele = taticaBot(todos(guardados[id]), { mandante: !casa, forcaAdversario: forca, perfil: adv.perfil });
      const meu = prepararTime({ nome: clube.nome, escalacao: minha.escalacao, banco: minha.banco, instrucoes: minha.instrucoes, mandante: casa });
      const outro = prepararTime({ nome: adv.nome, escalacao: dele.escalacao, banco: dele.banco, instrucoes: dele.instrucoes, mandante: !casa });
      const partida = casa ? simularPartida(criarRng(Math.floor(Math.random() * 2147483647)), meu, outro) : simularPartida(criarRng(Math.floor(Math.random() * 2147483647)), outro, meu);
      $("amInfo").textContent = `${adv.nome} (tática de bot, ${estiloDe(adv)}): ${dele.formacao}, nota média ${f1(dele.forca)}. ${clube.nome}: nota média ${f1(forca)}.`;
      $("amRel").innerHTML = htmlRelatorio(montarRelatorio(partida, [3, 3]), { nomes: casa ? [clube.nome, adv.nome] : [adv.nome, clube.nome], analistas: [casa ? 0 : 1] });
      $("amRel").scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) { $("amInfo").innerHTML = `<span class="bad">Não deu para jogar: ${esc(e.message)}</span>`; }
    $("amJogar").disabled = false;
  };
}

$("sair").onclick = () => sair();
await montarLogin($("login"), carregar);
window.__teste = { carregar };
</script>
</body>
</html>
