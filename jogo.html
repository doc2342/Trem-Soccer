<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trem Soccer</title>
<link rel="stylesheet" href="estilo.css">
<script src="atualiza.js"></script>
<style>
  .topo { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  /* abas: no computador, texto (e só o ícone nas configurações); no celular, uma linha só, com ícone em cima e nome curto embaixo */
  .aba .ai, .aba .at-c { display:none; }
  .aba[data-aba="config"] .ai { display:inline; } .aba[data-aba="config"] .at-l { display:none; }
  @media (max-width:620px) {
    .abas { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:2px; }
    .aba { padding:6px 1px 5px; border-radius:8px 8px 0 0; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0; }
    .aba .ai, .aba[data-aba="config"] .ai { display:block; font-size:17px; line-height:1.1; }
    .aba .at-l { display:none; } .aba .at-c { display:block; font-size:10.5px; font-weight:600; white-space:nowrap; }
  }
  /* Central: blocos lado a lado, no espírito do modo carreira */
  .central { display:grid; grid-template-columns:repeat(12, minmax(0, 1fr)); gap:12px; }
  .central > .card { margin:0; }
  .central h2 { text-transform:uppercase; letter-spacing:.04em; font-size:15px; }
  .c-jogos { grid-column:span 7; } .c-destaque { grid-column:span 5; } .c-mural, .c-liga, .c-tabela { grid-column:span 4; }
  @media (max-width:980px) { .c-jogos, .c-destaque, .c-mural, .c-liga, .c-tabela { grid-column:span 12; } }
  .faixa { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:8px; }
  @media (max-width:620px) { .faixa { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
  .tile { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 6px; border:1px solid var(--line); border-radius:8px; text-decoration:none; color:inherit; text-align:center; min-width:0; }
  .tile.prox { border-color:var(--ac); background:rgba(242,193,78,.08); }
  .tile .tl { font-size:11px; text-transform:uppercase; color:var(--mut); letter-spacing:.04em; }
  .tile .tn { font-size:12.5px; font-weight:600; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tile .td { font-size:11.5px; color:var(--mut); }
  .mural { display:flex; flex-direction:column; }
  .mural > div { display:flex; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .mural > div:last-child { border-bottom:0; }
  .mural .ic { flex:none; width:20px; text-align:center; }
  .mini td, .mini th { padding:4px 6px; }
  .mini tr.sobe td:first-child { box-shadow:inset 3px 0 0 var(--ok); } .mini tr.playoff td:first-child { box-shadow:inset 3px 0 0 var(--casa); } .mini tr.cai td:first-child { box-shadow:inset 3px 0 0 var(--bad); }
  .classif td, .classif th { padding:6px 5px; white-space:nowrap; }
  .classif .cl-nome { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:240px; }
  .cl-hum { color:var(--ac); font-size:10px; vertical-align:middle; }
  @media (max-width:620px) {
    .classif { font-size:13px; } .classif td, .classif th { padding:5px 3px; }
    .classif .c-gols, .classif .c-pe { display:none; }
    .classif .cl-nome { max-width:44vw; }
    .mini .lk { text-decoration:none; }
    #mLista .c-sal, #cvLista .c-sal { display:none; }
    #mLista table { font-size:12.5px; } #mLista td, #mLista th { padding:4px 3px; }
    #mLista td.esq { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:30vw; }
  }
  .lk { color:inherit; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px; cursor:pointer; }
  .lk:hover { text-decoration-color:var(--ac); }
  .cores { display:flex; flex-wrap:wrap; gap:4px; max-width:230px; }
  .cores span { width:24px; height:24px; border-radius:6px; border:2px solid var(--line); cursor:pointer; }
  .cores span.sel { border-color:var(--ac); }
  .previa { display:flex; gap:16px; align-items:center; justify-content:center; padding:12px; background:#0f1720; border-radius:10px; border:1px solid var(--line); }
  .a0 { color:#5d6b7c; } .a1 { color:#9fb0c3; } .a3 { color:#7fd4a6; font-weight:600; } .a4 { color:#3fe08f; font-weight:700; }
  tr.sep td { border-top:2px solid var(--line); }
  /* elenco por zonas */
  .elenco2 { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px; align-items:start; }
  @media (max-width:1000px) { .elenco2 { grid-template-columns:1fr; } }
  .zona { margin-bottom:14px; } .zona h3 { margin:0 0 6px; font-size:14px; text-transform:uppercase; letter-spacing:.04em; }
  .zona table { width:100%; font-size:13px; } .zona td, .zona th { padding:5px 4px; white-space:nowrap; } .zona td.esq { white-space:normal; }
  .zona .pp, .zona .act { min-width:34px; padding:1px 4px; }
  /* celular: só o essencial (posição colorida pela tática, atributos, nome, idade, nota e contrato); o resto está no botão i */
  @media (max-width:620px) {
    .zona .c-tat, .zona .c-pais, .zona .c-sal { display:none; }
    .zona table { font-size:12.5px; } .zona td, .zona th { padding:3px 3px; }
    .zona td.esq { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:46vw; }
    .zona tr.e-tit .pp { background:#2c6b4a; color:#eafff3; } .zona tr.e-res .pp { background:#5a4a1e; color:#ffe9a8; }
    .zona .info { width:20px; height:20px; }
    .zona { margin-bottom:10px; }
  }
  .act { display:inline-block; min-width:38px; padding:1px 6px; border-radius:6px; font-size:11.5px; font-weight:700; text-align:center; }
  .act.tit { background:#2c6b4a; color:#eafff3; } .act.res { background:#5a4a1e; color:#ffe9a8; }
  .info { position:relative; width:22px; height:22px; padding:0; border-radius:50%; font-size:12px; font-weight:700; font-style:italic; line-height:1; background:#2a4a7a; color:#fff; border:0; cursor:pointer; }
  .info::after { content:""; position:absolute; inset:-6px -12px; } /* aumenta a área de toque sem mudar o desenho */
  .quadro-atr { position:fixed; z-index:50; max-height:calc(100vh - 16px); overflow:auto; width:min(520px, calc(100vw - 16px)); background:var(--card); border:1px solid var(--ac); border-radius:10px; padding:12px; box-shadow:0 10px 30px rgba(0,0,0,.55); }
  .qa-topo { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
  .qa-topo .qa-nome { font-weight:700; font-size:15px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qa-sub { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:6px; }
  /* os grupos se distribuem em colunas e nenhum se parte ao meio; nome do atributo numa linha só, valor sempre à direita */
  .qa-grade { columns:3; column-gap:16px; }
  .qa-grade > div { break-inside:avoid; margin-bottom:8px; }
  .qa-grupo { font-size:11px; text-transform:uppercase; color:var(--mut); letter-spacing:.04em; border-bottom:1px solid var(--line); margin-bottom:2px; }
  .qa-linha { display:flex; justify-content:space-between; gap:8px; font-size:12.5px; padding:1px 0; color:var(--mut); }
  .qa-linha > span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qa-linha > span:last-child { flex:none; font-variant-numeric:tabular-nums; }
  @media (max-width:620px) { .qa-grade { columns:2; } .qa-linha { font-size:13px; padding:2px 0; } }
  .qa-linha.qa-conta { color:var(--tx); font-weight:600; }
</style>
</head>
<body>
<main>
  <div class="topo"><h1 style="margin:0">Trem Soccer</h1><span class="relogio" title="Hora deste aparelho"></span><span class="mut" id="quem" style="margin-left:auto"></span><button class="sec" id="sair" hidden>Sair</button></div>
  <div class="card" id="login"></div>
  <div id="app"></div>
</main>

<script type="module">
import { criarRng } from "./src/rng.js";
import { ATRIBUTOS, POSICOES, LISTA_POSICOES, PESOS, notaNaPosicao } from "./src/modelo.js";
import { sair, ligaAtual, clubesDaLiga, meuClube, pedirClube, meuPedido, registrarAcesso, elencoDoClube, partidasDoGrupo, resultadosDe, minhaTatica, ehAdmin, ajustarContrato, nomeDoGrupo, valoresDaDivisao, historicoDoGrupo, definirCarne, venderAoBanco, anteciparPremio, janelaDoMercado, jogadoresDoMercado, transferenciasDaLiga, protegerJogador, comprarPelaMulta, definirDirigente, clubePorId, jogadoresDoClube, minhasPropostas, listarJogador, taxaDaVenda, fazerProposta, responderProposta, decidirContraproposta, resolverLeiloes, livresDaLiga, lancesDosLivres, ofertasDaLiga, darLanceLivre, oferecerALiga, comprarOfertaDaLiga, extratoDoClube, caixaDoClube, obraAtiva, iniciarObra } from "./src/banco.js";
import { classificacao, taticaDoDirigente } from "./src/rodada.js";
import { salarioDeMercado, clausula, dinheiro, MAXIMO_INDIVIDUAL, PREMIO_MINIMO, LIMITE_DA_DIVIDA, RODADAS_DE_PRAZO, valorNoBanco, faixaDaNegociacao } from "./src/economia.js";
import { prepararTime, simularPartida } from "./src/motor.js";
import { taticaBot, ESTILO_DO_PERFIL } from "./src/bot.js";
import { montarRelatorio } from "./src/relatorio.js";
import { htmlRelatorio } from "./src/ui-relatorio.js";
import { montarLogin } from "./src/ui-login.js";
import { sg, pp, formatoDasSiglas, definirSiglas, SIGLAS_PT } from "./src/siglas.js";
import { svgEscudo, svgUniforme, visualAleatorio, FORMAS, PADROES, CORES } from "./src/escudo.js";

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f1 = v => v.toFixed(1).replace(".", ",");
const corAtr = v => "a" + (v < 10 ? 0 : v < 20 ? 1 : v < 30 ? 2 : v < 40 ? 3 : 4);
let usuario = null, versao = 0;

async function carregar(s) {
  const minha = ++versao; // evita desenhar duas vezes quando a sessão muda rápido
  usuario = s ? s.user : null;
  $("quem").textContent = usuario ? usuario.email : "";
  $("sair").hidden = !usuario;
  if (!usuario) { $("app").innerHTML = ""; return; }
  $("app").innerHTML = `<div class="card mut">Carregando…</div>`;
  try {
    const [liga, clube] = await Promise.all([ligaAtual(), meuClube(usuario.id)]);
    if (minha !== versao) return;
    if (!liga) { $("app").innerHTML = `<div class="card">Ainda não há liga aberta. Avise o administrador.</div>`; return; }
    if (clube) { registrarAcesso().catch(() => {}); Object.assign(liga, await valoresDaDivisao(liga.id, clube.divisao) || {});
      // paraquedas: na temporada seguinte ao rebaixamento, teto da divisão de cima e metade da diferença de TV
      if (clube.paraquedas != null && clube.paraquedas === liga.temporada && clube.divisao > 1) { const acima = await valoresDaDivisao(liga.id, clube.divisao - 1); if (acima) { liga.teto_folha = acima.teto_folha; liga.receita_tv += Math.round((acima.receita_tv - liga.receita_tv) / 2); liga.paraquedas = true; } } await telaClube(liga, clube); return; }
    const pedido = await meuPedido(usuario.id);
    if (minha !== versao) return;
    if (pedido && pedido.estado === "pendente") telaEspera(pedido);
    else await telaCriar(liga, pedido && pedido.estado === "recusado" ? pedido : null);
  } catch (e) { $("app").innerHTML = `<div class="card bad">Não consegui carregar: ${esc(e.message)}</div>`; }
}

// ---------- pedido esperando aprovação ----------
function telaEspera(p) {
  $("app").onclick = $("app").onchange = null;
  $("app").innerHTML = `<div class="card"><h2>Pedido enviado</h2>
    <div class="previa" style="margin-bottom:10px">${svgEscudo(p.escudo, p.sigla, 110)}${svgUniforme(p.uniforme, 90)}</div>
    <div><b>${esc(p.nome)}</b> (${esc(p.sigla)}) está esperando a aprovação do administrador da liga. Assim que ele aprovar, o seu clube aparece aqui, já com 22 jogadores.</div>
    <div class="row" style="margin-top:10px"><button id="verDeNovo">Ver se já foi aprovado</button><span class="mut">Esta página também confere sozinha a cada minuto.</span></div></div>`;
  $("verDeNovo").onclick = () => carregar({ user: usuario });
  const v = versao; setTimeout(() => { if (v === versao) carregar({ user: usuario }); }, 60000);
}

// ---------- criar o clube ----------
async function telaCriar(liga, recusado) {
  const clubes = await clubesDaLiga(liga.id), vagas = clubes.filter(c => !c.dono).length;
  const v = visualAleatorio(criarRng(Date.now() % 1e9)), F = { nome: "", sigla: "", escudo: v.escudo, uniforme: v.uniforme };
  const paleta = (alvo, campo) => `<div class="cores">${CORES.map(c => `<span data-cor="${c}" data-alvo="${alvo}" data-campo="${campo}" class="${F[alvo][campo] === c ? "sel" : ""}" style="background:${c}"></span>`).join("")}</div>`;
  const opcoes = (obj, atual) => Object.entries(obj).map(([k, n]) => `<option value="${k}" ${k === atual ? "selected" : ""}>${n}</option>`).join("");
  const desenhar = (aviso = "") => {
    $("app").innerHTML = `<div class="card"><h2>Criar o seu clube</h2>
      <div class="mut" style="margin-bottom:10px">${esc(liga.nome)} · ${vagas} ${vagas === 1 ? "vaga livre" : "vagas livres"} de ${clubes.length}. Você escolhe nome, sigla e cores; quando o administrador aprovar o pedido, você assume um dos clubes sem dono, já com 22 jogadores.</div>
      ${recusado ? `<div class="aviso" style="margin-bottom:10px">O pedido anterior (${esc(recusado.nome)}) foi recusado${recusado.motivo ? `: ${esc(recusado.motivo)}` : "."} Você pode enviar outro.</div>` : ""}
      ${vagas ? `<div class="duas"><div>
        <div class="row"><label style="flex:1;min-width:160px">Nome do clube<input id="cNome" maxlength="30" value="${esc(F.nome)}"></label><label>Sigla (3 letras)<input id="cSigla" maxlength="3" style="width:90px;text-transform:uppercase" value="${esc(F.sigla)}"></label></div>
        <div class="row" style="margin-top:10px"><label>Forma do escudo<select data-alvo="escudo" data-campo="forma">${opcoes(FORMAS, F.escudo.forma)}</select></label><label>Desenho do escudo<select data-alvo="escudo" data-campo="padrao">${opcoes(PADROES, F.escudo.padrao)}</select></label></div>
        <div class="row" style="margin-top:10px"><label>Cor principal do escudo${paleta("escudo", "cor1")}</label><label>Segunda cor do escudo${paleta("escudo", "cor2")}</label></div>
        <div class="row" style="margin-top:10px"><label>Desenho da camisa<select data-alvo="uniforme" data-campo="padrao">${opcoes(PADROES, F.uniforme.padrao)}</select></label></div>
        <div class="row" style="margin-top:10px"><label>Cor principal da camisa${paleta("uniforme", "cor1")}</label><label>Segunda cor da camisa${paleta("uniforme", "cor2")}</label><label>Calção${paleta("uniforme", "calcao")}</label></div>
      </div><div><div class="previa">${svgEscudo(F.escudo, F.sigla || "ABC", 110)}${svgUniforme(F.uniforme, 90)}</div>
        <button id="cCriar" style="margin-top:12px;width:100%">Enviar o pedido</button>${aviso ? `<div class="bad" style="margin-top:8px">${esc(aviso)}</div>` : ""}</div></div>` : `<div class="bad">Todas as vagas estão ocupadas.</div>`}</div>`;
    if (!vagas) return;
    $("cNome").oninput = e => { F.nome = e.target.value; };
    $("cSigla").oninput = e => { F.sigla = e.target.value.toUpperCase(); document.querySelector(".previa").innerHTML = svgEscudo(F.escudo, F.sigla || "ABC", 110) + svgUniforme(F.uniforme, 90); };
    $("cCriar").onclick = async () => {
      $("cCriar").disabled = true; $("cCriar").textContent = "Enviando…";
      try { await pedirClube(F.nome, F.sigla, F.escudo, F.uniforme); await carregar({ user: usuario }); }
      catch (e) { desenhar(e.message); }
    };
  };
  $("app").onclick = e => { const d = e.target.dataset; if (d.cor) { F[d.alvo][d.campo] = d.cor; desenhar(); } };
  $("app").onchange = e => { const d = e.target.dataset; if (d.alvo && e.target.tagName === "SELECT") { F[d.alvo][d.campo] = e.target.value; desenhar(); } };
  desenhar();
}

// ---------- meu clube ----------
async function telaClube(liga, clube) {
  $("app").onclick = $("app").onchange = null;
  const [elenco, clubes, tatica, admin, extrato] = await Promise.all([elencoDoClube(clube.id), clubesDaLiga(liga.id), minhaTatica(clube.id), ehAdmin().catch(() => false), extratoDoClube(clube.id)]);
  const [caixa, obra] = await Promise.all([caixaDoClube(clube.id), obraAtiva(clube.id)]);
  await resolverLeiloes(liga.id); // fecha leilões e ofertas que já venceram
  const [janela, transferencias, propostas, livres, ofertas] = await Promise.all([janelaDoMercado(liga.id), transferenciasDaLiga(liga.id), minhasPropostas(clube.id), livresDaLiga(liga.id), ofertasDaLiga()]);
  const lancesLivres = livres ? await lancesDosLivres(livres.map(j => j.id)) : [];
  const ateQuando = d => new Date(d).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const cPor = Object.fromEntries(clubes.map(c => [c.id, c])), humanos = clubes.filter(c => c.dono).length;
  const grupos = [...new Set(clubes.map(c => c.grupo))].sort();
  const quando = d => new Date(d).toLocaleString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const jogo = (p, res, agora) => { const r = res[p.id], aoVivo = !r && new Date(p.inicio).getTime() <= agora, meu = p.casa === clube.id || p.fora === clube.id;
    return `<a class="lance" style="align-items:center;text-decoration:none;color:inherit" href="aovivo.html?id=${p.id}">${svgEscudo(cPor[p.casa].escudo, cPor[p.casa].sigla, 24)}<span ${meu ? `class="nota"` : ""}>${esc(cPor[p.casa].nome)} <b>${r ? `${r.gols_casa} x ${r.gols_fora}` : "x"}</b> ${esc(cPor[p.fora].nome)}</span>${svgEscudo(cPor[p.fora].escudo, cPor[p.fora].sigla, 24)}<span class="xg">${r ? "encerrado" : aoVivo ? `<b class="aviso">ao vivo</b>` : quando(p.inicio)}</span></a>`; };
  const situacao = j => (j.fora > 0 ? ` <span class="bad" title="${j.motivo === "lesão" ? "Lesionado" : "Suspenso"}: fora por ${j.fora} ${j.fora === 1 ? "jogo" : "jogos"}">${j.motivo === "lesão" ? "🩹" : "⛔"}${j.fora}</span>` : "") + (j.amarelos ? ` <span class="aviso" title="Amarelos acumulados: o terceiro suspende por um jogo">${"🟨".repeat(j.amarelos)}</span>` : "");
  const temContratos = elenco.some(j => j.salario != null), folha = elenco.reduce((s, j) => s + (j.salario || 0), 0), teto = liga.teto_folha || 0;
  const contrato = j => j.salario == null ? `<td>—</td><td>—</td><td>—</td>` : `<td>${dinheiro(j.salario)}</td><td title="${j.protegidoAte != null && j.protegidoAte >= liga.temporada ? "Primeira temporada de contrato: a multa só vale a partir da próxima" : "Valor para outro clube levar o jogador"}">${j.protegido ? `<span title="Na lista de protegidos: sem multa rescisória">🛡️ sem multa</span>` : dinheiro(clausula(j.salario)) + (j.protegidoAte != null && j.protegidoAte >= liga.temporada ? " 🔒" : "")}</td><td class="${j.contratoAte <= liga.temporada ? "aviso" : ""}">até a ${j.contratoAte}</td>`;
  // elenco por zonas, como no Dugout: situação na tática salva, posição, botão de atributos, nome, idade, país, nota e contrato
  const ZONAS_DO_ELENCO = [["Goleiros", ["gol"]], ["Defensores", ["defesa", "ala"]], ["Meio-campistas", ["volante", "meio", "meia"]], ["Atacantes", ["ataque"]]];
  const naTatica = {};
  if (tatica && tatica.dados && Array.isArray(tatica.dados.jog)) {
    tatica.dados.jog.forEach((id, i) => { naTatica[id] = { titular: true, pos: (tatica.dados.vagas || [])[i] || "" }; });
    (tatica.dados.banco || []).forEach(id => { if (!naTatica[id]) naTatica[id] = { titular: false }; });
  }
  const ordemNaTatica = j => naTatica[j.id] ? (naTatica[j.id].titular ? 0 : 1) : 2;
  const selo = j => !naTatica[j.id] ? "" : naTatica[j.id].titular ? `<span class="act tit" title="Titular na tática salva, jogando de ${sg(naTatica[j.id].pos)}">${sg(naTatica[j.id].pos)}</span>` : `<span class="act res" title="No banco, na tática salva">RES</span>`;
  const linha = j => `<tr class="clk ${naTatica[j.id] ? (naTatica[j.id].titular ? "e-tit" : "e-res") : ""}" data-jog="${j.id}"><td class="c-tat">${selo(j)}</td><td>${pp(j.pos)}</td><td><button class="info" data-info="${j.id}" title="Atributos">i</button></td>
    <td class="esq">${esc(j.nome)}${situacao(j)}${j.aVenda ? ` <span class="tag" title="Na lista de transferência">à venda por ${dinheiro(j.precoPedido)}</span>` : ""}</td>

      if (!h.length || !$("rodadas")) return;
      const nome = Object.fromEntries(clubes.map(c => [c.id, c.nome])), temporadas = [...new Set(h.map(x => x.temporada))];
      $("rodadas").insertAdjacentHTML("beforeend", `<h2 style="margin-top:16px">Temporadas anteriores</h2>` + temporadas.map(t => `<details ${t === temporadas[0] ? "open" : ""}><summary>Temporada ${t}</summary><div class="rolagem"><table><tr><th></th><th class="esq">Clube</th><th>P</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>Prêmio</th></tr>
        ${h.filter(x => x.temporada === t).map(x => `<tr><td>${x.posicao}</td><td class="esq ${x.clube_id === clube.id ? "nota" : ""}">${esc(nome[x.clube_id] || "—")}</td><td><b>${x.pontos}</b></td><td>${x.vitorias}</td><td>${x.empates}</td><td>${x.derrotas}</td><td>${x.gols_pro}</td><td>${x.gols_contra}</td><td>${dinheiro(x.premio)}${x.destino === "subiu" ? ` <span class="ok">▲</span>` : x.destino === "caiu" ? ` <span class="bad">▼</span>` : x.destino === "campeão" ? " 🏆" : ""}</td></tr>`).join("")}</table></div></details>`).join(""));
    }).catch(() => {});
    const mostrar = () => { if ($("rodada")) $("jogos").innerHTML = partidas.filter(p => p.rodada === +$("rodada").value).map(p => jogo(p, res, agora)).join(""); };
    if ($("rodada")) $("rodada").onchange = mostrar;
    mostrar();
    if (g === clube.grupo) {
      const meus = partidas.filter(p => p.casa === clube.id || p.fora === clube.id), proximos = meus.filter(p => !res[p.id]).slice(0, 5), proximo = proximos[0];
      const rival = proximo ? cPor[proximo.casa === clube.id ? proximo.fora : proximo.casa] : null, ultimo = meus.filter(p => res[p.id]).pop();
      $("proximos").innerHTML = proximos.length ? proximos.map((p, k) => { const casa = p.casa === clube.id, adv = cPor[casa ? p.fora : p.casa], aoVivo = new Date(p.inicio).getTime() <= agora;
        return `<a class="tile ${k ? "" : "prox"}" href="aovivo.html?id=${p.id}"><div class="tl">${p.rodada === 19 ? "Semifinal" : p.rodada === 20 ? "Final" : "Rodada " + p.rodada} · ${casa ? "casa" : "fora"}</div>${svgEscudo(adv.escudo, adv.sigla, 40)}<div class="tn">${esc(adv.nome)}</div><div class="td">${aoVivo ? `<b class="aviso">ao vivo</b>` : quando(p.inicio)}</div></a>`; }).join("")
        : `<div class="mut" style="grid-column:1/-1">${partidas.length ? "Não há mais jogos nesta temporada." : "O calendário ainda não foi gerado."}</div>`;
      $("proximo").innerHTML = (ultimo ? `Último jogo: <a class="lk" href="aovivo.html?id=${ultimo.id}">${esc(cPor[ultimo.casa].nome)} ${res[ultimo.id].gols_casa} x ${res[ultimo.id].gols_fora} ${esc(cPor[ultimo.fora].nome)}</a>. ` : "")
        + (rival ? (rival.dono ? `Próximo adversário: ${lk(rival.id)} tem dirigente, e a tática dele é segredo.` : `Próximo adversário: ${lk(rival.id)} é comandado pelo bot e joga com ${estiloDe(rival)}.`) : "");
      // tabela resumida, com as faixas de acesso, playoff e descenso
      const serie = g === "A" ? 1 : g === "B" || g === "C" ? 2 : 3, tab = classificacao(doGrupo, partidas, resultados);
      const faixa = i => serie === 1 ? (i >= tab.length - 4 ? "cai" : "") : i === 0 ? "sobe" : i <= 4 ? "playoff" : serie === 2 && i >= tab.length - 2 ? "cai" : "";
      $("miniTabela").className = "";
      $("miniTabela").innerHTML = `<table class="mini" style="width:100%"><tr><th></th><th class="esq">${esc(nomeDoGrupo(g))}</th><th>J</th><th>SG</th><th>PTS</th></tr>
        ${tab.map((t, i) => `<tr class="${faixa(i)}"><td>${i + 1}</td><td class="esq ${t.clube.id === clube.id ? "nota" : ""}">${lk(t.clube.id)}</td><td>${t.j}</td><td>${t.gp - t.gc}</td><td><b>${t.pts}</b></td></tr>`).join("")}</table>
        <div class="mut" style="margin-top:6px;font-size:12px">${serie === 1 ? `<span class="bad">▌</span> rebaixamento` : `<span class="ok">▌</span> acesso direto · <span class="casa">▌</span> playoff${serie === 2 ? ` · <span class="bad">▌</span> rebaixamento` : ""}`}</div>`;
    }
  }
  $("verGrupo").onchange = () => grupo($("verGrupo").value).catch(e => { $("tabela").innerHTML = `<span class="bad">${esc(e.message)}</span>`; });
  await grupo(clube.grupo);

  // contrato: clicar num jogador abre o painel para aumentar o salário ou renovar
  $("app").onclick = e => {
    const qual = e.target.dataset.obra;
    if (qual) {
      const nome = (ESTRUTURAS.find(x => x[0] === qual) || [])[1];
      if (!confirm(`Começar a obra: ${nome}? O valor sai do caixa agora e não dá para cancelar.`)) return;
      e.target.disabled = true;
      iniciarObra(qual).then(() => carregar({ user: usuario })).catch(err => { $("obraAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; e.target.disabled = false; });
      return;
    }
    if (e.target.closest("[data-info]")) return; // o botão de atributos tem o seu próprio quadro
    const tr = e.target.closest("tr[data-jog]"); if (!tr || !temContratos) return;
    const j = elenco.find(x => x.id === tr.dataset.jog), protegido = j.protegidoAte != null && j.protegidoAte >= liga.temporada;
    const maximo = Math.floor(teto * MAXIMO_INDIVIDUAL), sobra = teto - folha;
    const bloco = (titulo, corpo) => `<div style="border:1px solid var(--line);border-radius:8px;padding:10px"><div style="font-weight:700;margin-bottom:6px">${titulo}</div>${corpo}</div>`;
    const nProtegidos = elenco.filter(x => x.protegido).length;
    $("contratoPainel").innerHTML = `<div class="card" style="margin:0 0 10px;border-color:var(--ac)">
      <div class="row" style="align-items:center"><div><b style="font-size:16px">${esc(j.nome)}</b> <span class="mut">· ${sg(j.pos)} · ${j.idade} anos</span></div><button class="sec" id="ctFechar" style="margin-left:auto">Fechar</button></div>
      <div class="row" style="gap:18px;margin:8px 0 10px">
        <div><div class="mut">Salário</div><b>${dinheiro(j.salario)}</b></div>
        <div><div class="mut">Contrato</div><b>até a temporada ${j.contratoAte}</b></div>
        <div><div class="mut">Multa rescisória</div><b>${j.protegido ? "não tem (protegido)" : dinheiro(clausula(j.salario))}</b>${!j.protegido && protegido ? ` <span class="mut">só vale a partir da próxima temporada</span>` : ""}</div>
        ${j.aVenda ? `<div><div class="mut">À venda por</div><b>${dinheiro(j.precoPedido)}</b></div>` : ""}</div>
      <div class="duas">
        ${bloco("Contrato", `<div class="row"><label>Novo salário (em milhares)<input id="ctSalario" type="number" step="5" min="${j.salario}" max="${maximo}" value="${Math.max(j.salario, j.mercado)}" style="width:120px"></label>
            <label>Renovar por<select id="ctTemporadas"><option value="1">1 temporada</option><option value="2">2 temporadas</option><option value="3">3 temporadas</option></select></label></div>
          <div class="row" style="margin-top:8px"><button id="ctRenovar">Renovar o contrato</button><button class="sec" id="ctAumentar">Só aumentar o salário</button></div>
          <div class="mut" style="margin-top:6px"><span id="ctClausula"></span> · na renovação ele pede pelo menos ${dinheiro(j.mercado)} · máximo por jogador ${dinheiro(maximo)} · sobram ${dinheiro(sobra)} até o teto. O salário só sobe; a multa é 5 vezes o salário.</div>`)}
        ${janela === undefined ? "" : bloco(`Lista de protegidos <span class="tag">${nProtegidos} de 5</span>`, `<button class="sec" id="ctProteger">${j.protegido ? "Tirar da lista de protegidos" : "Pôr na lista de protegidos"}</button>
          <div class="mut" style="margin-top:6px">Protegido não tem multa rescisória: só sai se você vender. Para tirar alguém da lista, só com a janela fechada.</div>`)}
        ${propostas == null ? "" : bloco("Lista de transferência", `<div class="row"><label>Preço pedido (em milhares)<input id="ctPreco" type="number" step="50" min="0" value="${j.precoPedido || clausula(j.salario)}" style="width:120px"></label>
            <button class="sec" id="ctListar">${j.aVenda ? "Mudar o preço" : "Pôr à venda"}</button>${j.aVenda ? `<button class="sec" id="ctTirar">Tirar da lista</button>` : ""}</div>
          <div class="mut" style="margin-top:6px">A venda negociada só fecha entre ${dinheiro(faixaDaNegociacao(j.salario).minimo)} e ${dinheiro(faixaDaNegociacao(j.salario).maximo)} (60% a 150% da multa).</div>
          <div class="mut" style="margin-top:6px" id="ctTaxa">Na venda negociada você paga taxa sobre o valor.</div>`)}
        ${caixa != null && caixa < 0 ? bloco(`<span class="bad">Clube no vermelho</span>`, `<button class="sec" id="ctBanco" ${elenco.length <= 16 ? "disabled" : ""}>Vender ao banco por ${dinheiro(valorNoBanco(j.salario))}</button>
          <div class="mut" style="margin-top:6px">60% da multa rescisória, na hora. O elenco não pode ficar com menos de 16.</div>
          ${livres == null ? "" : j.ofertaLigaAte ? `<div class="aviso" style="margin-top:8px">Oferecido à liga por ${dinheiro(Math.round(3.75 * j.salario))} até ${ateQuando(j.ofertaLigaAte)}. Se ninguém levar, vai ao banco.</div>`
            : `<button class="sec" id="ctOferecer" style="margin-top:8px" ${elenco.length <= 16 ? "disabled" : ""}>Oferecer à liga por ${dinheiro(Math.round(3.75 * j.salario))}</button>
               <div class="mut" style="margin-top:6px">75% da multa: qualquer clube pode levar durante ${Math.round((liga.horas_oferta || 168) / 24)} dias, mesmo com a janela fechada. Se ninguém levar, ele vai ao banco por 60%.</div>`}`) : ""}
      </div>
      <div id="ctAviso" style="margin-top:6px"></div></div>`;
    const mostra = () => { $("ctClausula").textContent = `Com esse salário a multa fica em ${dinheiro(clausula(+$("ctSalario").value || 0))}`; };
    $("ctSalario").oninput = mostra; mostra();
    const enviar = async temporadas => {
      try { await ajustarContrato(j.id, Math.round(+$("ctSalario").value), temporadas); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    $("ctAumentar").onclick = () => enviar(0);
    $("ctRenovar").onclick = () => enviar(+$("ctTemporadas").value);
    $("ctFechar").onclick = () => { $("contratoPainel").innerHTML = ""; };
    if ($("ctListar")) {
      const listar = async preco => { try { await listarJogador(j.id, preco); await carregar({ user: usuario }); } catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; } };
      $("ctListar").onclick = () => listar(Math.round(+$("ctPreco").value) || 0);
      if ($("ctTirar")) $("ctTirar").onclick = () => listar(0);
      taxaDaVenda(j.id).then(t => { if (t != null && $("ctTaxa")) $("ctTaxa").textContent = `Se vender agora, a taxa é de ${Math.round(t * 100)}% do valor. (30% para quem acabou de chegar, 20% na janela seguinte, 10% depois.)`; });
    }
    if ($("ctProteger")) $("ctProteger").onclick = async () => {
      try { await protegerJogador(j.id, !j.protegido); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    if ($("ctOferecer")) $("ctOferecer").onclick = async () => {
      if (!confirm(`Oferecer ${j.nome} à liga? Qualquer clube poderá levá-lo por ${dinheiro(Math.round(3.75 * j.salario))}; se ninguém levar no prazo, ele vai ao banco.`)) return;
      try { await oferecerALiga(j.id); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    if ($("ctBanco")) $("ctBanco").onclick = async () => {
      if (!confirm(`Vender ${j.nome} ao banco do jogo por ${dinheiro(valorNoBanco(j.salario))}? Ele sai do clube e não volta.`)) return;
      try { await venderAoBanco(j.id); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    $("contratoPainel").scrollIntoView({ behavior: "smooth", block: "nearest" });
  };

  // amistoso: tática salva contra a tática de bot do adversário; nada é gravado
  const guardados = {};
  $("amJogar").onclick = async () => {
    $("amJogar").disabled = true;
    try {
      const id = +$("amAdv").value, adv = cPor[id], casa = $("amMando").value === "casa";
      guardados[id] = guardados[id] || await elencoDoClube(id);
      const todos = e => e.map(j => ({ ...j, fora: 0 })); // em amistoso ninguém está lesionado nem suspenso
      const meuElenco = todos(elenco), minha = taticaDoDirigente(tatica && tatica.dados, meuElenco) || taticaBot(meuElenco, { mandante: casa });
      const forca = minha.escalacao.reduce((s, x) => s + notaNaPosicao(x.j, x.pos), 0) / minha.escalacao.length;
      const dele = taticaBot(todos(guardados[id]), { mandante: !casa, forcaAdversario: forca, perfil: adv.perfil });
      const meu = prepararTime({ nome: clube.nome, escalacao: minha.escalacao, banco: minha.banco, instrucoes: minha.instrucoes, mandante: casa });
      const outro = prepararTime({ nome: adv.nome, escalacao: dele.escalacao, banco: dele.banco, instrucoes: dele.instrucoes, mandante: !casa });
      const partida = casa ? simularPartida(criarRng(Math.floor(Math.random() * 2147483647)), meu, outro) : simularPartida(criarRng(Math.floor(Math.random() * 2147483647)), outro, meu);
      $("amInfo").textContent = `${adv.nome} (tática de bot, ${estiloDe(adv)}): ${dele.formacao}, nota média ${f1(dele.forca)}. ${clube.nome}: nota média ${f1(forca)}.`;
      $("amRel").innerHTML = htmlRelatorio(montarRelatorio(partida, [3, 3]), { nomes: casa ? [clube.nome, adv.nome] : [adv.nome, clube.nome], analistas: [casa ? 0 : 1] });
      $("amRel").scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) { $("amInfo").innerHTML = `<span class="bad">Não deu para jogar: ${esc(e.message)}</span>`; }
    $("amJogar").disabled = false;
  };
}

$("sair").onclick = () => sair();
await montarLogin($("login"), carregar);
window.__teste = { carregar };
</script>
</body>
</html>
