<style>

    .ttab th:nth-child(1) { width:40px; } .ttab th:nth-child(4) { width:104px; } .ttab th:nth-child(5) { width:36px; } .ttab td:nth-child(2) { white-space:nowrap; }

<body>
<main>
  <div class="topo"><h1 style="margin:0">Trem Soccer</h1><span class="relogio" title="Hora deste aparelho"></span><span class="mut" id="quem" style="margin-left:auto"></span><span id="meusClubes" class="meus-clubes"></span><button class="sec" id="sair" hidden>Sair</button></div>
  <div class="card" id="login"></div>
  <div id="app"></div>

</main>

<script type="module">
import { criarRng } from "./src/rng.js";

// Só aparece para quem tem mais de um clube. Trocar grava o clube ativo no banco (toda ação vale para ele) e recarrega a página;

      <div class="row" style="gap:18px;margin:8px 0 10px">
        <div><div class="mut">Salário</div><b>${dinheiro(j.salario)}</b></div>
        <div><div class="mut">Contrato</div><b>até a temporada ${j.contratoAte}</b></div>
        <div><div class="mut">Multa rescisória</div><b>${j.protegido ? "não tem (protegido)" : dinheiro(multaDe(j))}</b>${!j.protegido && protegido ? ` <span class="mut">só vale a partir da próxima temporada</span>` : ""}</div>
        ${j.aVenda ? `<div><div class="mut">À venda por</div><b>${dinheiro(j.precoPedido)}</b></div>` : ""}</div>
      <div class="duas">
        ${bloco("Contrato", `<div class="row"><label>Novo salário (em milhares)<input id="ctSalario" type="number" step="5" min="${j.salario}" max="${maximo}" value="${Math.max(j.salario, j.mercado)}" style="width:120px"></label>
            <label>Renovar por<select id="ctTemporadas" data-prog="ctSalario" data-luvas="1" data-mercado="${j.mercado || 0}"><option value="1">1 temporada</option><option value="2">2 temporadas (+10%)</option><option value="3">3 temporadas (+20%)</option></select></label></div>
          ${(trava => `<div class="row" style="margin-top:8px"><button id="ctRenovar" ${trava ? "disabled" : ""}>Renovar o contrato</button><button class="sec" id="ctAumentar" ${trava ? "disabled" : ""}>Só aumentar o salário</button></div>${trava ? `<div class="aviso" style="margin-top:6px">${trava}</div>` : ""}`)(j.aposentaEm != null ? "Anunciou a aposentadoria: joga até o fim da temporada e para. Não dá para renovar nem aumentar o salário." : j.preContrato === liga.temporada ? "Recebeu proposta de pré-contrato de outro clube: não dá mais para renovar." : "")}
          ${j.contratoAte != null && j.contratoAte <= liga.temporada && j.emprestadoDe == null && j.aposentaEm == null ? `<label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="ctNaoRenovar" ${j.naoRenovar ? "checked" : ""} style="width:auto"> Não renovar: na virada ele fica livre e vai a leilão</label><div class="mut">Sem a marcação, ele renova sozinho na virada por uma temporada, por ${dinheiro(Math.max(j.salario, j.mercado || 0))} (se couber no teto).</div>` : ""}
          <div id="ctLuvas" style="margin-top:6px"></div>
          <div class="mut" style="margin-top:6px"><span id="ctClausula"></span> · na renovação ele pede pelo menos ${dinheiro(j.mercado)} · máximo por jogador ${dinheiro(maximo)} · sobram ${dinheiro(sobra)} até o teto. O salário só sobe; a multa é 5 vezes o maior entre o salário e o valor de hoje do jogador.
            <b>Luvas:</b> na renovação dá para pôr um salário abaixo do pedido (até ${Math.round(LUVAS.piso * 100)}% dele) pagando a diferença de uma vez, fora da folha: cada mil a menos por temporada custa ${String(LUVAS.fator).replace(".", ",")} mil por temporada de contrato. A multa continua pelo valor de hoje.</div>`)}
        ${janela === undefined ? "" : bloco(`Lista de protegidos <span class="tag">${nProtegidos} de 7</span>`, `<button class="sec" id="ctProteger">${j.protegido ? "Tirar da lista de protegidos" : "Pôr na lista de protegidos"}</button>
          <div class="mut" style="margin-top:6px">Protegido não tem multa rescisória: só sai se você vender. Para tirar alguém da lista, só com a janela fechada.</div>`)}
        ${!temEmprestimo || j.idade > 23 ? "" : bloco(`Empréstimo <span class="tag">${emprestados.length} de 2 emprestados</span>`, `<div class="row"><label>Para um clube sem dirigente<select id="ctEmpClube">${Object.values(cPor).filter(c => !c.dono && c.id !== clube.id && c.grupo !== "X").sort((a, b) => !!PAISES[a.grupo] - !!PAISES[b.grupo] || String(a.grupo).localeCompare(String(b.grupo)) || a.nome.localeCompare(b.nome)).map(c => `<option value="${c.id}">${esc(nomeDoGrupo(c.grupo))} · ${esc(c.nome)}</option>`).join("")}</select></label>
            <button class="sec" id="ctEmprestar" ${janela ? "" : "disabled"} title="${janela ? "" : "A janela está fechada"}">Oferecer por empréstimo</button></div>
          <div class="mut" style="margin-top:6px">Ele fica lá até a virada da temporada e volta. O salário fica meio a meio: ${dinheiro(Math.round((j.salario || 0) / 2))} para cada clube, e metade em cada folha. Clube sem dirigente responde na hora e só aceita quem chega para ser titular na posição. Com outro dirigente, é ele quem pede: no Mercado, na página do jogador. Vale para quem tem até 23 anos e contrato que passe desta temporada; cada clube empresta 2 e recebe 2 por temporada.</div>`)}
        ${propostas == null ? "" : bloco("Lista de transferência", `<div class="row"><label>Preço pedido (em milhares) <span class="mut">· sugerido: ${dinheiro(multaDe(j))}, o valor da multa</span><input id="ctPreco" type="number" step="50" min="0" value="${j.precoPedido || multaDe(j)}" style="width:120px"></label>
            <button class="sec" id="ctListar">${j.aVenda ? "Mudar o preço" : "Pôr à venda"}</button>${j.aVenda ? `<button class="sec" id="ctTirar">Tirar da lista</button>` : ""}</div>
          <div class="mut" style="margin-top:6px">A venda negociada só fecha entre ${dinheiro(faixaDaNegociacao(j.salario).minimo)} e ${dinheiro(faixaDaNegociacao(j.salario).maximo)} (60% a 150% da multa).</div>
          ${liga.bots_espera_horas == null ? "" : `<div class="mut" style="margin-top:6px"><b>Clubes sem dirigente</b> também compram da lista, pelo preço pedido e sem pechincha: depois de ${liga.bots_espera_horas >= 1 ? Math.round(liga.bots_espera_horas) + " h" : Math.round(liga.bots_espera_horas * 60) + " min"} na lista sem proposta de dirigente, com a janela aberta, se o preço for de até <b>${dinheiro(CONFIG_MERCADO_BOTS.precoEmSalarios * salarioDeMercado(j))}</b> (${CONFIG_MERCADO_BOTS.precoEmSalarios} vezes o salário de mercado dele)${j.idade > CONFIG_MERCADO_BOTS.idadeMaxima ? `, mas <b>não</b> compram quem tem mais de ${CONFIG_MERCADO_BOTS.idadeMaxima} anos` : ""} e se ele reforçar o time titular de algum deles. Um por clube por janela.</div>`}
          <div class="mut" style="margin-top:6px" id="ctTaxa">Na venda negociada você paga taxa sobre o valor.</div>`)}
        ${propostas == null || (caixa != null && caixa < 0) ? "" : bloco(`Vender pelo agente <span class="tag">${janelaDeSaidas ? `${vendasDeSaida} de ${SAIDAS} na janela de saídas` : `${vendasPeloAgente} de ${VENDAS_PELO_AGENTE} nesta temporada`}</span>`, `<button class="sec" data-agente="1" ${(janelaDeSaidas ? vendasDeSaida >= SAIDAS : !janela || vendasPeloAgente >= VENDAS_PELO_AGENTE) || contratados <= 16 ? "disabled" : ""}>Vender por ${dinheiro(valorNoAgente(j.mercado ?? j.salario, false, cotacao, doAgente.length))}</button>
          <div class="mut" style="margin-top:6px">Venda garantida, na hora: o agente coloca o jogador num clube sem dono. Quem paga são os clubes sem dono: com o caixa deles folgado, o preço é 2,5 vezes o salário de mercado (que hoje é ${dinheiro(j.mercado ?? j.salario)}); quando aperta, cai até 1 vez. O preço também cai com as vendas pelo agente da temporada: a 3ª e a 4ª saem por até 2 vezes, a 5ª e a 6ª por até 1,5. Hoje o agente paga ${String(Math.round((1 + extraDoAgente(doAgente.length) * cotacao) * 100) / 100).replace(".", ",")} vezes. Aumentar o salário do contrato não muda esse preço. ${janelaDeSaidas ? `Janela de saídas: da última rodada até a virada dá para vender ${SAIDAS} jogadores pelo agente, para abrir espaço na folha antes de renovar.` : `Só com a janela aberta${janela ? "" : ", e ela está fechada"}.`}</div>`)}
        ${clube.peneira_temporada === undefined || (j.idade > 21 && j.idade < 31) ? "" : bloco("Dispensar", `<button class="sec" id="ctDispensar" ${contratados <= 16 ? "disabled" : ""}>Dispensar sem custo</button>
          <div class="mut" style="margin-top:6px">Vale para quem tem até 21 anos ou 31 ou mais. Ele fica livre e pode ser contratado por qualquer clube. O elenco não pode ficar com menos de 16.</div>`)}
        ${caixa != null && caixa < 0 ? bloco(`<span class="bad">Clube no vermelho</span>`, `<button class="sec" data-agente="1" ${contratados <= 16 ? "disabled" : ""}>Vender pelo agente por ${dinheiro(valorNoAgente(j.mercado ?? j.salario, true, cotacao))}</button>
          <div class="mut" style="margin-top:6px">No vermelho o agente paga até 3 vezes o salário de mercado (hoje ${String(Math.round((1 + 2 * cotacao) * 100) / 100).replace(".", ",")} vezes, conforme o caixa dos clubes sem dono), na hora, mesmo com a janela fechada e sem gastar as vendas da temporada. O jogador vai para um clube sem dono. O elenco não pode ficar com menos de 16.</div>
          ${livres == null ? "" : j.ofertaLigaAte ? `<div class="aviso" style="margin-top:8px">Oferecido à liga por ${dinheiro(Math.round(3.75 * j.salario))} até ${ateQuando(j.ofertaLigaAte)}. Se ninguém levar, o agente vende.</div>`
            : `<button class="sec" id="ctOferecer" style="margin-top:8px" ${contratados <= 16 ? "disabled" : ""}>Oferecer à liga por ${dinheiro(Math.round(3.75 * j.salario))}</button>
               <div class="mut" style="margin-top:6px">75% da multa: qualquer clube pode levar durante ${prazoEmTexto(+liga.horas_oferta || 168)}, mesmo com a janela fechada. Se ninguém levar, o agente o vende pelo preço do dia (até 3 vezes o salário de mercado).</div>`}`) : ""}
      </div>
      <div id="ctAviso" style="margin-top:6px"></div></div>`;
    // luvas da renovação: quanto custa o salário abaixo do pedido para a duração escolhida
    const luvasAgora = () => { const t = +$("ctTemporadas").value, pede = minimoPelaDuracao(j.mercado || 0, t), s = Math.round(+$("ctSalario").value || 0);
      return { t, pede, s, valor: s < pede ? luvasDaRenovacao(pede, s, t) : 0, abaixo: s < salarioMinimoComLuvas(pede) }; };
    const mostra = () => {
      $("ctClausula").textContent = `Com esse salário a multa fica em ${dinheiro(clausula(Math.max(+$("ctSalario").value || 0, salarioDeMercado(j))))}`; // a multa nunca fica abaixo do valor de hoje
      const L = luvasAgora();
      $("ctLuvas").innerHTML = !L.valor ? "" : L.abaixo ? `<span class="bad">Abaixo de ${Math.round(LUVAS.piso * 100)}% do pedido (${dinheiro(L.pede)}), nem com luvas.</span>`
        : `<span class="aviso">Renovar por ${L.t} ${L.t === 1 ? "temporada" : "temporadas"} com ${dinheiro(L.s)} (o pedido é ${dinheiro(L.pede)}) custa <b>${dinheiro(L.valor)} de luvas</b>, pagas agora do caixa e fora da folha.${caixa != null && caixa < L.valor ? " O caixa não cobre." : ""}</span>`;
    };
    $("ctSalario").oninput = mostra; $("ctTemporadas").addEventListener("change", mostra); mostra();
    const enviar = async temporadas => {
      const L = luvasAgora(), comLuvas = temporadas > 0 && L.valor > 0;
      if (comLuvas && !confirm(`Pagar ${dinheiro(L.valor)} de luvas para renovar ${j.nome} por ${dinheiro(L.s)} por temporada?`)) return;
      try { await ajustarContrato(j.id, Math.round(+$("ctSalario").value), temporadas, comLuvas); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    if ($("ctNaoRenovar")) $("ctNaoRenovar").onchange = async e => {
      try { await marcarNaoRenovar(j.id, e.target.checked); await carregar({ user: usuario }); }
      catch (err) { e.target.checked = !e.target.checked; $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    $("ctAumentar").onclick = () => enviar(0);
    $("ctRenovar").onclick = () => enviar(+$("ctTemporadas").value);
    $("ctFechar").onclick = () => { $("contratoPainel").innerHTML = ""; };
    if ($("ctEmprestar")) $("ctEmprestar").onclick = async () => {
      const alvo = cPor[$("ctEmpClube").value]; if (!alvo || !confirm(`Emprestar ${j.nome} ao ${alvo.nome} até a virada da temporada? Não dá para desfazer.`)) return;
      try { recado = await emprestarABot(j.id, alvo.id); await carregar({ user: usuario }); } catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    if ($("ctListar")) {
      const listar = async preco => { try { await listarJogador(j.id, preco); await carregar({ user: usuario }); } catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; } };
      $("ctListar").onclick = () => listar(Math.round(+$("ctPreco").value) || 0);
      if ($("ctTirar")) $("ctTirar").onclick = () => listar(0);
      taxaDaVenda(j.id).then(t => { if (t != null && $("ctTaxa")) $("ctTaxa").textContent = `Se vender agora, a taxa é de ${Math.round(t * 100)}% do valor. (30% para quem acabou de chegar, 20% na janela seguinte, 10% depois.)`; });
    }
    if ($("ctProteger")) $("ctProteger").onclick = async () => {
      try { await protegerJogador(j.id, !j.protegido); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    if ($("ctOferecer")) $("ctOferecer").onclick = async () => {
      if (!confirm(`Oferecer ${j.nome} à liga? Qualquer clube poderá levá-lo por ${dinheiro(Math.round(3.75 * j.salario))}; se ninguém levar no prazo, o agente o vende a um clube sem dono.`)) return;
      try { await oferecerALiga(j.id); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    $("contratoPainel").querySelectorAll("[data-agente]").forEach(bt => { bt.onclick = async () => {
      const vermelho = caixa != null && caixa < 0;
      if (!confirm(`Vender ${j.nome} pelo agente por ${dinheiro(valorNoAgente(j.mercado ?? j.salario, vermelho, cotacao, doAgente.length))}? Ele vai para um clube sem dono. Não dá para desfazer.`)) return;
      bt.disabled = true;
      try { alert(await venderPeloAgente(j.id)); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; bt.disabled = false; }
    }; });
    if ($("ctDispensar")) $("ctDispensar").onclick = async () => {
      if (!confirm(`Dispensar ${j.nome}? Ele sai do clube agora e fica livre para os outros clubes. O seu não pode contratá-lo de novo nesta temporada nem na próxima. Não dá para desfazer.`)) return;
      try { await dispensarJogador(j.id); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    if ($("ctBanco")) $("ctBanco").onclick = async () => {
      if (!confirm(`Vender ${j.nome} ao banco do jogo por ${dinheiro(valorNoBanco(j.salario))}? Ele sai do clube e não volta.`)) return;
      try { await venderAoBanco(j.id); await carregar({ user: usuario }); }
      catch (err) { $("ctAviso").innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
    $("contratoPainel").scrollIntoView({ behavior: "smooth", block: "nearest" });
  };

  // amistoso: tática salva contra a tática de bot do adversário; nada é gravado
  const guardados = {};
  if ($("pedirExtra")) $("pedirExtra").onclick = () => telaPedidoExtra();
  $("amJogar").onclick = async () => {
    $("amJogar").disabled = true; marcarChegada("amistoso");
    try {
      const id = +$("amAdv").value, adv = cPor[id], casa = $("amMando").value === "casa";
      guardados[id] = guardados[id] || await elencoDoClube(id);
      const todos = e => e.map(j => ({ ...j, fora: 0 })); // em amistoso ninguém está lesionado nem suspenso
      const meuElenco = todos(elenco), minha = taticaDoDirigente(tatica && tatica.dados, meuElenco) || taticaBot(meuElenco, { mandante: casa });
      const forca = minha.escalacao.reduce((s, x) => s + notaNaPosicao(x.j, x.pos), 0) / minha.escalacao.length;
      const dele = taticaBot(todos(guardados[id]), { mandante: !casa, forcaAdversario: forca, perfil: adv.perfil });
      const meu = prepararTime({ nome: clube.nome, escalacao: minha.escalacao, banco: minha.banco, instrucoes: minha.instrucoes, mandante: casa });
      const outro = prepararTime({ nome: adv.nome, escalacao: dele.escalacao, banco: dele.banco, instrucoes: dele.instrucoes, mandante: !casa });
      const partida = casa ? simularPartida(criarRng(Math.floor(Math.random() * 2147483647)), meu, outro) : simularPartida(criarRng(Math.floor(Math.random() * 2147483647)), outro, meu);
      $("amInfo").textContent = `${adv.nome} (tática de bot, ${estiloDe(adv)}): ${dele.formacao}, nota média ${f1(dele.forca)}. ${clube.nome}: nota média ${f1(forca)}.`;
      $("amRel").innerHTML = htmlRelatorio(montarRelatorio(partida, [3, 3]), { nomes: casa ? [clube.nome, adv.nome] : [adv.nome, clube.nome], analistas: [casa ? 0 : 1], ordens: partida.ordens });
      $("amRel").scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) { $("amInfo").innerHTML = `<span class="bad">Não deu para jogar: ${esc(e.message)}</span>`; }
    $("amJogar").disabled = false;
  };
}

$("sair").onclick = () => sair();
await montarLogin($("login"), carregar);
window.__teste = { carregar, talvezAtualizar };
</script>
</body>
</html>
