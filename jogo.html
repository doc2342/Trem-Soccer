<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trem Soccer</title>
<link rel="stylesheet" href="estilo.css">
<style>
  .topo { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .cores { display:flex; flex-wrap:wrap; gap:4px; max-width:230px; }
  .cores span { width:24px; height:24px; border-radius:6px; border:2px solid var(--line); cursor:pointer; }
  .cores span.sel { border-color:var(--ac); }
  .previa { display:flex; gap:16px; align-items:center; justify-content:center; padding:12px; background:#0f1720; border-radius:10px; border:1px solid var(--line); }
  .a0 { color:#5d6b7c; } .a1 { color:#9fb0c3; } .a3 { color:#7fd4a6; font-weight:600; } .a4 { color:#3fe08f; font-weight:700; }
  tr.sep td { border-top:2px solid var(--line); }
</style>
</head>
<body>
<main>
  <div class="topo"><h1 style="margin:0">Trem Soccer</h1><span class="mut" id="quem" style="margin-left:auto"></span><button class="sec" id="sair" hidden>Sair</button></div>
  <div class="card" id="login"></div>
  <div id="app"></div>
</main>

<script type="module">
import { criarRng } from "./src/rng.js";
import { ATRIBUTOS, POSICOES, PESOS, notaNaPosicao } from "./src/modelo.js";
import { sair, ligaAtual, clubesDaLiga, meuClube, assumirClube, registrarAcesso, elencoDoClube, partidasDoGrupo, resultadosDe, minhaTatica, ehAdmin } from "./src/banco.js";
import { classificacao } from "./src/rodada.js";
import { montarLogin } from "./src/ui-login.js";
import { svgEscudo, svgUniforme, visualAleatorio, FORMAS, PADROES, CORES } from "./src/escudo.js";

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f1 = v => v.toFixed(1).replace(".", ",");
const corAtr = v => "a" + (v < 10 ? 0 : v < 20 ? 1 : v < 30 ? 2 : v < 40 ? 3 : 4);
let usuario = null, versao = 0;

async function carregar(s) {
  const minha = ++versao; // evita desenhar duas vezes quando a sessão muda rápido
  usuario = s ? s.user : null;
  $("quem").textContent = usuario ? usuario.email : "";
  $("sair").hidden = !usuario;
  if (!usuario) { $("app").innerHTML = ""; return; }
  $("app").innerHTML = `<div class="card mut">Carregando…</div>`;
  try {
    const [liga, clube] = await Promise.all([ligaAtual(), meuClube(usuario.id)]);
    if (minha !== versao) return;
    if (!liga) { $("app").innerHTML = `<div class="card">Ainda não há liga aberta. Avise o administrador.</div>`; return; }
    if (clube) { registrarAcesso().catch(() => {}); await telaClube(liga, clube); }
    else await telaCriar(liga);
  } catch (e) { $("app").innerHTML = `<div class="card bad">Não consegui carregar: ${esc(e.message)}</div>`; }
}

// ---------- criar o clube ----------
async function telaCriar(liga) {
  const clubes = await clubesDaLiga(liga.id), vagas = clubes.filter(c => !c.dono).length;
  const v = visualAleatorio(criarRng(Date.now() % 1e9)), F = { nome: "", sigla: "", escudo: v.escudo, uniforme: v.uniforme };
  const paleta = (alvo, campo) => `<div class="cores">${CORES.map(c => `<span data-cor="${c}" data-alvo="${alvo}" data-campo="${campo}" class="${F[alvo][campo] === c ? "sel" : ""}" style="background:${c}"></span>`).join("")}</div>`;
  const opcoes = (obj, atual) => Object.entries(obj).map(([k, n]) => `<option value="${k}" ${k === atual ? "selected" : ""}>${n}</option>`).join("");
  const desenhar = (aviso = "") => {
    $("app").innerHTML = `<div class="card"><h2>Criar o seu clube</h2>
      <div class="mut" style="margin-bottom:10px">${esc(liga.nome)} · ${vagas} ${vagas === 1 ? "vaga livre" : "vagas livres"} de ${clubes.length}. Você assume um dos clubes sem dono, já com 22 jogadores, e dá a ele o seu nome e as suas cores.</div>
      ${vagas ? `<div class="duas"><div>
        <div class="row"><label style="flex:1;min-width:160px">Nome do clube<input id="cNome" maxlength="30" value="${esc(F.nome)}"></label><label>Sigla (3 letras)<input id="cSigla" maxlength="3" style="width:90px;text-transform:uppercase" value="${esc(F.sigla)}"></label></div>
        <div class="row" style="margin-top:10px"><label>Forma do escudo<select data-alvo="escudo" data-campo="forma">${opcoes(FORMAS, F.escudo.forma)}</select></label><label>Desenho do escudo<select data-alvo="escudo" data-campo="padrao">${opcoes(PADROES, F.escudo.padrao)}</select></label></div>
        <div class="row" style="margin-top:10px"><label>Cor principal do escudo${paleta("escudo", "cor1")}</label><label>Segunda cor do escudo${paleta("escudo", "cor2")}</label></div>
        <div class="row" style="margin-top:10px"><label>Desenho da camisa<select data-alvo="uniforme" data-campo="padrao">${opcoes(PADROES, F.uniforme.padrao)}</select></label></div>
        <div class="row" style="margin-top:10px"><label>Cor principal da camisa${paleta("uniforme", "cor1")}</label><label>Segunda cor da camisa${paleta("uniforme", "cor2")}</label><label>Calção${paleta("uniforme", "calcao")}</label></div>
      </div><div><div class="previa">${svgEscudo(F.escudo, F.sigla || "ABC", 110)}${svgUniforme(F.uniforme, 90)}</div>
        <button id="cCriar" style="margin-top:12px;width:100%">Criar o clube</button>${aviso ? `<div class="bad" style="margin-top:8px">${esc(aviso)}</div>` : ""}</div></div>` : `<div class="bad">Todas as vagas estão ocupadas.</div>`}</div>`;
    if (!vagas) return;
    $("cNome").oninput = e => { F.nome = e.target.value; };
    $("cSigla").oninput = e => { F.sigla = e.target.value.toUpperCase(); document.querySelector(".previa").innerHTML = svgEscudo(F.escudo, F.sigla || "ABC", 110) + svgUniforme(F.uniforme, 90); };
    $("cCriar").onclick = async () => {
      $("cCriar").disabled = true; $("cCriar").textContent = "Criando…";
      try { await assumirClube(F.nome, F.sigla, F.escudo, F.uniforme); await carregar({ user: usuario }); }
      catch (e) { desenhar(e.message); }
    };
  };
  $("app").onclick = e => { const d = e.target.dataset; if (d.cor) { F[d.alvo][d.campo] = d.cor; desenhar(); } };
  $("app").onchange = e => { const d = e.target.dataset; if (d.alvo && e.target.tagName === "SELECT") { F[d.alvo][d.campo] = e.target.value; desenhar(); } };
  desenhar();
}

// ---------- meu clube ----------
async function telaClube(liga, clube) {
  $("app").onclick = $("app").onchange = null;
  const [elenco, clubes, partidas, tatica, admin] = await Promise.all([elencoDoClube(clube.id), clubesDaLiga(liga.id), partidasDoGrupo(liga.id, clube.grupo), minhaTatica(clube.id), ehAdmin().catch(() => false)]);
  const resultados = await resultadosDe(partidas.map(p => p.id));
  const res = Object.fromEntries(resultados.map(r => [r.partida_id, r]));
  const grupo = clubes.filter(c => c.grupo === clube.grupo), cPor = Object.fromEntries(grupo.map(c => [c.id, c])), humanos = clubes.filter(c => c.dono).length;
  const agora = Date.now(), quando = d => new Date(d).toLocaleString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const rodadas = [...new Set(partidas.map(p => p.rodada))];
  // rodada em destaque: a primeira que ainda não terminou; se todas terminaram, a última
  const atual = rodadas.find(r => partidas.some(p => p.rodada === r && new Date(p.fim).getTime() > agora)) || rodadas[rodadas.length - 1];
  const meus = partidas.filter(p => p.casa === clube.id || p.fora === clube.id);
  const proximo = meus.find(p => new Date(p.fim).getTime() > agora);
  const jogo = p => { const r = res[p.id], aoVivo = !r && new Date(p.inicio).getTime() <= agora, meu = p.casa === clube.id || p.fora === clube.id;
    return `<a class="lance" style="align-items:center;text-decoration:none;color:inherit" href="aovivo.html?id=${p.id}">${svgEscudo(cPor[p.casa].escudo, cPor[p.casa].sigla, 24)}<span ${meu ? `class="nota"` : ""}>${esc(cPor[p.casa].nome)} <b>${r ? `${r.gols_casa} x ${r.gols_fora}` : "x"}</b> ${esc(cPor[p.fora].nome)}</span>${svgEscudo(cPor[p.fora].escudo, cPor[p.fora].sigla, 24)}<span class="xg">${r ? "encerrado" : aoVivo ? `<b class="aviso">ao vivo</b>` : quando(p.inicio)}</span></a>`; };
  const tabela = classificacao(grupo, partidas, resultados);
  const linha = j => `<tr><td><span class="pp">${j.pos}</span></td><td class="esq">${esc(j.nome)}</td><td>${j.idade}</td><td class="nota">${f1(notaNaPosicao(j, j.pos))}</td>
    <td class="esq">${Object.entries(j.fam).filter(([p]) => p !== j.pos).map(([p, f]) => `${p}<span class="tag"> ${f}</span>`).join(" · ") || "—"}</td>
    ${j.at.map((v, k) => `<td class="${corAtr(v)}" title="${ATRIBUTOS[k].nome}${PESOS[POSICOES[j.pos].papel][ATRIBUTOS[k].k] ? " · conta para a posição" : ""}">${v}</td>`).join("")}</tr>`;
  $("app").innerHTML = `<div class="card topo">${svgEscudo(clube.escudo, clube.sigla, 72)}${svgUniforme(clube.uniforme, 52)}
      <div><h2 style="margin:0;font-size:20px">${esc(clube.nome)}</h2><div class="mut">${esc(liga.nome)} · temporada ${liga.temporada} · grupo ${esc(clube.grupo)}</div></div>
      ${admin ? `<a href="admin.html" style="color:var(--ac);margin-left:auto">Administração</a>` : ""}</div>
    <div class="card"><h2>Próximo jogo</h2>${proximo ? jogo(proximo) : `<div class="mut">${partidas.length ? "Não há mais jogos nesta temporada." : "O calendário ainda não foi gerado."}</div>`}
      <div class="row" style="margin-top:10px"><a href="escalacao.html?online=1"><button>Escalação e tática</button></a><span class="${tatica ? "mut" : "aviso"}">${tatica ? `Tática salva em ${quando(tatica.atualizada_em)}.` : "Você ainda não salvou uma tática: até salvar, o bot escala o seu time."}</span></div></div>
    <div class="duas">
      <div class="card"><h2>Classificação do grupo ${esc(clube.grupo)} <span class="tag">PE: pontos esperados pelas chances criadas</span></h2><div class="rolagem"><table><tr><th></th><th class="esq">Clube</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th><th>PE</th></tr>
        ${tabela.map((t, i) => `<tr><td>${i + 1}</td><td class="esq ${t.clube.id === clube.id ? "nota" : ""}">${esc(t.clube.nome)}${t.clube.dono ? "" : ` <span class="tag">bot</span>`}</td><td><b>${t.pts}</b></td><td>${t.j}</td><td>${t.v}</td><td>${t.e}</td><td>${t.d}</td><td>${t.gp}</td><td>${t.gc}</td><td>${t.gp - t.gc}</td><td class="mut">${f1(t.esp)}</td></tr>`).join("")}</table></div>
        <div class="mut" style="margin-top:6px">${humanos} ${humanos === 1 ? "dirigente" : "dirigentes"} na liga; os demais clubes são do bot.</div></div>
      <div class="card"><h2>Jogos do grupo</h2>${rodadas.length ? `<label>Rodada<select id="rodada">${rodadas.map(r => `<option value="${r}" ${r === atual ? "selected" : ""}>Rodada ${r}</option>`).join("")}</select></label><div id="jogos" style="margin-top:8px"></div>` : `<div class="mut">O calendário ainda não foi gerado.</div>`}</div>
    </div>
    <div class="card"><h2>Elenco <span class="tag">${elenco.length} jogadores</span></h2><div class="rolagem"><table><tr><th>Pos</th><th class="esq">Jogador</th><th>Id.</th><th>Nota</th><th class="esq">Também joga</th>${ATRIBUTOS.map(a => `<th title="${a.nome}">${a.k}</th>`).join("")}</tr>
      ${elenco.filter(j => j.titular).map(linha).join("")}${elenco.filter(j => !j.titular).map((j, i) => linha(j).replace("<tr>", i ? "<tr>" : `<tr class="sep">`)).join("")}</table></div></div>`;
  const mostrar = () => { if ($("rodada")) $("jogos").innerHTML = partidas.filter(p => p.rodada === +$("rodada").value).map(jogo).join(""); };
  if ($("rodada")) $("rodada").onchange = mostrar;
  mostrar();
}

$("sair").onclick = () => sair();
await montarLogin($("login"), carregar);
window.__teste = { carregar };
</script>
</body>
</html>
